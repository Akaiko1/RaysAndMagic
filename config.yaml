# Monster stats and AI
monster_ai:
  # State timers are update ticks (game.tps = 120).
  idle_patrol_timer: 60         # Time before starting patrol from idle (0.5 seconds at 120 TPS)
  patrol_idle_timer: 1200       # Time before returning to idle (10 seconds)
  attack_cooldown: 120          # Attack delay duration (1 second at 120 TPS)
  flee_duration: 840            # How long to flee (7 seconds RT / 7 TB turns)

  # Behavior chances (0.0 to 1.0)
  idle_to_patrol_chance: 0.1    # 10% chance per frame to start patrolling

  # Movement parameters
  normal_speed_multiplier: 0.5  # Normal movement speed multiplier
  flee_speed_multiplier: 1.5    # Speed multiplier when fleeing

  # Vision and pathfinding
  flee_distance_tiles: 4        # How far a fleeing monster runs before reconsidering

  # AI frequency checks (in frames)
  path_check_frequency: 30      # Check for blocked paths every N frames

  # Detection (distances in tiles, the rest are multipliers)
  pursuit:
    max_radius_tiles: 16
    retaliation_seconds: 10
    retaliation_turns: 4
    retaliation_margin_tiles: 2  # extra reach beyond the incoming shot distance
  default_alert_radius_tiles: 4        # fallback when a monster omits alert_radius
  # No detection without line of sight: an unaware monster never aggros through
  # walls/trees (hard rule in PlayerDetectionRange, not a multiplier).
  disengage_distance_multiplier: 2.0   # lose engagement at detection x this (hysteresis)
  attack_enter_range_fraction: 0.9     # enter attack at <= range x this (exit at > range)

  # Flee cycle: after N consecutive attacks, roll the chance to flee
  flee_after_attacks: 5
  flee_after_attacks_chance: 0.5

# Graphics and rendering
graphics:
  view:
    # Ratios of the usable world viewport above the party panel.
    wide_focal_ratio: 0.637
    wide_horizon_ratio: 0.645
    # Classic HUD clearance fades out before a creature crosses the camera.
    lift_fade_tiles: 0.5
    lift_full_tiles: 1.0
  elemental_attack:
    duration_seconds: 0.48
    radius_tiles: 0.35
    particle_count: 9
    max_active: 96
  # Raycasting optimization - reduced for 60 FPS performance
  rays_per_screen_width: 1  # One ray per screen pixel: best wall quality, most expensive

  # Colors (RGB values)
  colors:
    sky: [135, 206, 235]      # Light blue
    ground: [34, 139, 34]     # Green
    forest_bg: [34, 139, 34]  # Forest background

  # Distance (in tiles) beyond which a crossed-tree standee degrades to a single
  # camera-facing plane. Trees only; close trees always retain full slab depth.
  # <=0 disables the distant LOD.
  trees_as_billboards: true
  tree_standee_lod_tiles: 25

  # Moving motes emitted by authored tree tiles at night. They are local
  # visual effects rather than world lights, so dense forests stay cheap.
  night_motes:
    emission_radius_tiles: 10
    emission_interval_seconds: 2
    emission_chance: 0.20
    max_per_tree: 3
    lifetime_seconds: 7
    max_active: 96

  # Distance effects
  brightness_min: 0.3

  # Board-game standees: monsters, NPCs and scenery render as thick wooden
  # tokens standing in the world (monsters turn with their travel direction)
  # instead of camera-facing billboards.
  standee:
    enabled: true
    thickness_tiles: 0.02       # wooden slab thickness (front sticker <-> back sticker)
    core_tint: 1.0              # 0 = wood core, 1 = sprite-average core color
    turn_speed_deg_per_sec: 270 # how fast monster tokens swivel toward their heading
    npc_spin_deg_per_sec: 12    # showcase spin of non-person NPC props (0 = off); terrain sprites use env_face instead
    env_face_deg_per_sec: 20    # scenery tokens slowly turn to face the camera (0 = fixed diagonal)
    min_view_angle_deg: 22      # monster tokens never come closer than this to edge-on (0 = off)

  # Monster rendering is uncapped so sprites do not sink at close range.
  monster:
    walk_frame_seconds: 0.15  # Seconds per walking frame; matches the code default (about 6.7 FPS)
    min_sprite_size: 8
    death:
      fps: 6
      fall_seconds: 1
      fade_seconds: 5
      loot_hop_seconds: 0.45
      loot_hop_height_tiles: 0.25

  # NPC rendering (larger than monsters for better visibility)
  npc:
    min_sprite_size: 16

  # Shared visual-size classes in tile units (1.0 == a 1-tile wall).
  # Actors use frame height. Props and landmarks use visible alpha height, so
  # transparent texture padding is ignored. crossed_standee interprets its selected
  # class as frame width and preserves the source texture aspect. Existing trees
  # use tree; a smaller tree can select another class such as full_tile.
  # Content never authors a raw per-object size.
  size_classes:
    small: 0.35    # rat, bat, pixie
    medium: 0.45   # wolf, spider, goblin and other beasts
    person: 0.60   # all humanoids alike - enemy people/undead/orcs AND human NPCs
    large: 0.85    # bear, minotaur, giant beasts
    huge: 1.20     # dragons, trolls, treants, bosses
    tiny_prop: 0.30
    small_prop: 0.50
    medium_prop: 0.80
    full_tile: 1.00
    tall_prop: 1.25
    large_prop: 1.60
    structure: 2.00
    tree: 2.00      # standard crossed-tree width; height follows texture aspect

  # Ground container sprite heights in tile units (dropped loot / reward chests).
  # Fixed - not scaled by the dropping monster. Chests read bigger than bags.
  container_size_tiles:
    loot_bag: 0.25
    treasure_chest: 0.5

  # Low aurora curtains along the walkable-facing edges of tiles authored with
  # impassable_aura. Tint follows the tile's sprite or floor colour. Telegraphed
  # attacks and other tile markers share this effect with their own colours.
  impassable_aura:
    enabled: true
    radius_tiles: 7        # only tiles within this many tiles of the player
    fold_density: 7.75 # broad animated folds per tile edge (2..8)
    alpha: 0.5             # base glow strength (0..1)

  # Load-time color key: make stray magenta (left by imperfect sprite background
  # removal) transparent when sprites load. A pixel is keyed when each RGB channel
  # is within `tolerance` of `color`. color [0,0,0]/absent defaults to magenta.
  color_key:
    enabled: true
    color: [255, 0, 255]   # magenta
    tolerance: 60          # per-channel slack for the fully-transparent core
    despill: true          # fringe (semitone) pixels: strip the magenta cast, keep the base tone opaque (don't erase)
    # Despill is intentionally aggressive (strips ANY magenta hue), which greys
    # out sprites whose purple/magenta is real art. List those here (basenames;
    # naming any directional animation also covers its base and sibling sheets)
    # to despill ONLY their edge fringe
    # within edge_despill_radius px, preserving the interior. Curated from the
    # despill audit - extend as new purple art is added.
    edge_despill_radius: 3
    edge_only_despill:
      - projectile_harm_flask
      # Purple/magenta creatures
      - octopus
      - medusa
      - alien
      - archmage
      - lich
      - lich_king
      - forest_spider
      # Ice crystal highlights read as violet
      - frost_elemental
      # Sorcerer hero art (purple robes)
      - lysander
      - lysander_full
      - lysander_archmage
      - lysander_archmage_full
      - lysander_lich
      - lysander_lich_full
      # Dark-elf sorcerer hero art (violet skin)
      - vaelith
      - vaelith_full
      - vaelith_archmage
      - vaelith_archmage_full
      - vaelith_lich
      - vaelith_lich_full
      # Environment
      - bonsai_tree
      # Spellbook school tabs (mind/spirit are purple)
      - spellbook_tab_mind
      - spellbook_tab_spirit
      # Spell icons (dark / spirit / mind / arcane)
      - icon_spell_darkness
      - icon_spell_charm
      - icon_spell_psychic_shock
      - icon_spell_spirit_lash
      - icon_spell_disintegrate
      - icon_spell_bind_undead
      - icon_spell_wizard_eye
      - icon_spell_raise_dead
      - icon_spell_awaken
      - icon_spell_darkbolt
      - icon_spell_alien_dark_bolt
      # Item / weapon icons (lich / archmage / wizard themed)
      - icon_item_lich_phylactery
      - icon_item_archmage_robe
      - icon_item_wizard_robe
      - icon_item_lich_king_crown
      - icon_item_lich_card
      - icon_item_archmage_card
      - icon_item_medusa_card
      - icon_item_soul_phylactery_gem
      - icon_weapon_book_of_darkness
      - icon_weapon_battle_staff
      - icon_weapon_archmage_staff

day_night:
  half_cycle_seconds: 420
  day_light: 1.0
  night_light: 0.7
  panorama_fade_seconds: 3
  days_per_week: 7
  days_per_month: 28
  # Counts are caps: packs use vacant authored monster spawn points only.
  packs:
    - map: forest
      day_monsters:
        - monster: wolf
          count: 8
          replacement: {monster: dire_wolf, min_party_level: 20, chance: 0.20}
      night_monsters:
        - monster: forest_spider
          count: 8
          quest_progress: true
          replacement: {monster: giant_spider, min_party_level: 20, chance: 0.20}
      min_player_dist_tiles: 8
    - map: highlands
      day_monster: puma
      night_monster: mountain_troll
      count: 5
    - map: desert
      day_monsters:
        - { monster: desert_dervish, count: 5, min_party_level: 20, quest_progress: true }
      night_monster: mummy
      count: 5
    - map: deep_jungle
      day_monster: ocelot
      night_monster: masked_huntress
      count: 5
    - map: japanese_castle
      night_monsters:
        - { monster: ningyo, count: 4 }
        - { monster: vengeful_ningyo, count: 1 }
    # Tengu rule the garden ridge by day; the umbrellas and the foxes come
    # out after dark (SAKURA_GARDEN design: night-weighted spirits).
    - map: sakura_garden
      day_monster: karasu_tengu
      count: 4
      night_monsters:
        - { monster: kasa_obake, count: 3 }
        - { monster: kitsune_onmyoji, count: 2 }

    # Black dragons return only after the cliffs have been completely cleared.
    - map: dragon_cliffs
      night_monster: dragon
      count: 5
      require_map_clear: true

# Shared by all existing and new burn sources.
status_damage:
  burn_percent: 3
  boss_burn_percent: 1

status_effects:
  # A slowed monster loses one turn in this many turn-based turns (RT slows
  # movement and attack cadence by the debuff's percent instead).
  slow_skip_every_turns: 3
