monster_combat:
  elemental_attack:
    chance: 0.20
    damage_multiplier: 2.0

# UgaTaima Game Configuration

# Display settings
display:
  screen_width: 1024
  screen_height: 768
  window_title: "Rays and Magic"
  resizable: true
  fullscreen: true
  # Settings > Display presets. The interface lays out at the window's
  # logical size divided by scale and is drawn at the screen's native
  # resolution, so text and panels grow together and every layout stays
  # intact. The UI minimum size caps the effect on small windows. Keys are
  # saved; keep them stable.
  interface_sizes:
    - {key: normal, label: "Normal", scale: 1.0}
    - {key: large, label: "Large", scale: 1.25}
    - {key: largest, label: "Largest", scale: 1.5}
  default_interface_size: normal
  # Settings > Display fonts. A file is a pixel font drawn at its design size
  # (size_px, whole pixels only); no file is the built-in classic face. The
  # credit is shown in Settings > Display. Keys are saved; keep them stable.
  fonts:
    - {key: classic, label: "Classic", credit: ""}
    - {key: romulus, label: "Romulus", file: assets/fonts/romulus/Romulus.ttf, size_px: 16, credit: "Romulus by Hewett Tsoi"}
    - {key: alagard, label: "Alagard", file: assets/fonts/alagard/Alagard.ttf, size_px: 16, credit: "Alagard by Hewett Tsoi"}
    - {key: fine_fantasy, label: "Fine Fantasy", file: assets/fonts/tinyrpg/TinyRPG-FineFantasyStrategies.ttf, size_px: 12, credit: "Fine Fantasy Strategies by tiopalada"}
    - {key: brilliant, label: "Brilliant Strength", file: assets/fonts/tinyrpg/TinyRPG-BrilliantStrength.ttf, size_px: 14, credit: "Brilliant Strength by tiopalada"}
  default_font: classic
  # Keep Metal presentation paced. An unsynced loop can count Draw calls while
  # skipping displayed frames under GPU load (especially long tree corridors).
  disable_vsync_on_mac: false

# Engine settings
# tps is the simulation tick rate and the yardstick for every frame-counted
# duration in the code (config.DefaultTPS mirrors it; main.go pins the same
# value when vsync is off). Changing it rescales any duration still written in
# raw frames - durations authored in seconds convert themselves.
engine:
  tps: 120

camping:
  # Keep all four heads below the crop, including on ultrawide displays.
  max_top_crop_fraction: 0.08
  dissolve_pixel_size: 4
  dissolve_clusters_min: 5
  dissolve_clusters_max: 6
  default_scene: camp_dungeon
  fade_in_seconds: 0.65
  hold_seconds: 2.5
  fade_out_seconds: 0.8

# Game world settings
world:
  tile_size: 64
  map_width: 50
  map_height: 50
  # Unified open world: outdoor maps are stitched into one world with carved
  # passages (rules in assets/open_world.yaml). false = classic split maps.
  open_world: true
  # Monster collision bodies in tiles, keyed by size_class. One square box
  # moves the monster and takes projectile hits. Capped at 0.75 tile (48 px):
  # a larger body wedges in 1-wide corridors and at corners.
  monster_bodies:
    small: 0.375    # 24 px - rat, bat, pixie, wildlife
    medium: 0.625   # 40 px - wolf, spider, goblin
    person: 0.75    # 48 px
    large: 0.75     # 48 px
    huge: 0.75      # 48 px
  # Projectile hitboxes in tiles, keyed by physics.hitbox in spells/weapons.
  # Area damage is aoe_radius_tiles, not the hitbox.
  projectile_hitboxes:
    standard: 0.5   # arrows, bolts, bullets
    wide: 1.0       # large shots (fireball, swarm); stays in its own lane in turn-based

# Movement settings
movement:
  move_speed: 2.0
  rotation_speed: 0.05
  run_multiplier: 2.0   # real-time sprint speed while Shift is held

# Camera/3D rendering settings
camera:
  # No field_of_view knob: the square-projection FOV is DERIVED at runtime as
  # 2*atan(screen_w/(2*screen_h)) from the LIVE logical resolution (boot + every
  # resize/fullscreen), so one world tile renders as a true square at any aspect.
  view_distance: 3200          # 50 * tile_size

# UI settings
ui:
  spell_input_cooldown: 10
  damage_blink_frames: 3    # Number of frames to blink red when taking damage
  turn_based_mouse_hold:
    delay_seconds: 0.6     # Wait after pressing before automatic attacks start.
    repeat_seconds: 0.35   # Gap between automatic attacks; manual input stays responsive.

# Character stats and progression
characters:
  # Starting party gold and food
  starting_gold: 500
  starting_food: 5

  # --- Level progression pacing (documentation; knobs live in
  # internal/game/balance.go: XPRequiredPerLevel=100, XPQuadPerLevel=8) ---
  # XP to advance FROM level L = max(100*L, 8*L*L): linear through L12
  # (classic curve, untouched), quadratic from L13 up.
  # Why: monster XP grows with L^2 (targets in docs/monster-design.md), so a
  # purely linear cost made farming ACCELERATE with level (~29 zone-level
  # kills per level at L5 -> ~5 at L30). The quadratic branch holds the pace
  # FLAT: ~15 zone-level kills per level in a 4-hero party, L13 through L50.
  # (Kill XP is split by active party size, then every living hero - bench
  # included - receives that share; quest XP is granted in full.)
  # Tuning: XPQuadPerLevel 6 -> ~11 kills/level, 10 -> ~18.
  # Totals to REACH a level: L13=7800, L20=22360, L30=71040, L50=326000.
  # The curve is pinned by TestXPStepCostCurve (progression_score_test.go).

  # Stat calculation multipliers
  hit_points:
    endurance_multiplier: 2
    level_multiplier: 3

  spell_points:
    level_multiplier: 2

  auto_drink:
    threshold_pct: 35
    interval_seconds: 1

  # Class base attributes
  classes:
    knight:
      description:
        - {text: "Front-line {defense:tank}: the most HP, {defense:plate and shield}."}
        - {skill: impenetrable_defense, text: "{defense:Impenetrable Defense} takes damage off every normal hit."}
        - {text: "Ranged enemies aim at the first party slot, so put the Knight there."}
        - {text: "Picks a {damage:Sword or Spear} mastery at level 3. No magic."}
      auto_stats: {speed: 16, endurance: 28, primary: might}
      might: 15
      intellect: 10
      personality: 10
      endurance: 15
      accuracy: 12
      speed: 10
      luck: 10
      skills: [sword, spear, leather, chain, plate, shield, bodybuilding, impenetrable_defense]
      main_hand: iron_sword

    sorcerer:
      description:
        - {text: "Elemental {damage:nuker}: Fire, Water and Air spells from the start, scaling with Intellect."}
        - {skill: elemental_mastery, text: "{damage:Elemental Mastery} pierces elemental resistance."}
        - {text: "Chooses {damage:Fireball} or {damage:Dark Bolt} at level 3; {utility:Torch Light} brightens dungeons. Fragile - keep out of the first slot."}
      auto_stats: {speed: 16, endurance: 16, primary: intellect}
      might: 8
      intellect: 15
      personality: 12
      endurance: 8
      accuracy: 10
      speed: 10
      luck: 12
      skills: [dagger, staff, leather, meditation, learning, elemental_mastery]
      magic:
        - { school: fire,  spells: [torch_light, firebolt] }
        - { school: water, spells: [ice_bolt] }
        - { school: air,   spells: [sparks] }
      main_hand: magic_dagger
      quick_spell: firebolt

    cleric:
      description:
        - {text: "The party {heal:healer}. {heal:Heal} mends any hero: point at a hero's card and press F (slotted) or C, and Space heals whoever is badly hurt."}
        - {skill: natural_healer, text: "{heal:Natural Healer} strengthens every heal."}
        - {text: "Body, Mind and Spirit magic: {buff:Bless} at level 3, {heal:Mass Heal} at level 9, and the lake priestess sells {buff:Heroism}, {heal:Raise Dead} and {control:Charm}. Fights with {damage:Harm}, {damage:Mind Blast} and {damage:Spirit Lash}."}
      auto_stats: {speed: 16, endurance: 22, primary: personality}
      might: 10
      intellect: 12
      personality: 15
      endurance: 12
      accuracy: 8
      speed: 10
      luck: 10
      skills: [mace, chain, shield, meditation, learning, natural_healer]
      magic:
        - { school: body,   spells: [heal_other, harm] }
        - { school: mind,   spells: [mind_blast] }
        - { school: spirit, spells: [spirit_lash] }
      main_hand: holy_mace
      quick_spell: heal_other

    archer:
      description:
        - {skill: bow, text: "{damage:Bow} specialist with the best Accuracy - shoots from safety while the front line holds. Trained with blasters too."}
        - {text: "{utility:Wizard Eye} widens the view; can take {damage:Lightning} at level 3."}
        - {skill: disarm_trap, text: "{utility:Disarm Trap} can disarm trapped chests and softens hits on the Archer."}
      auto_stats: {speed: 16, endurance: 18, primary: accuracy, secondary: intellect}
      might: 12
      intellect: 10
      personality: 10
      endurance: 10
      accuracy: 15
      speed: 12
      luck: 10
      skills: [bow, blaster, leather, dagger, disarm_trap, bodybuilding]
      magic:
        - { school: air, spells: [wizard_eye] }
      main_hand: hunting_bow
      quick_spell: wizard_eye

    paladin:
      description:
        - {text: "Holy {defense:guardian}: axe, sword or mace in chain or plate, with a shield."}
        - {skill: sacrifice, text: "{defense:Sacrifice}: the Paladin takes part of every hit that lands on another hero."}
        - {text: "{heal:First Aid} heals the Paladin; {heal:Heal} for others can be learned at level 3."}
      auto_stats: {speed: 16, endurance: 24, primary: might, secondary: personality}
      might: 13
      intellect: 10
      personality: 13
      endurance: 13
      accuracy: 10
      speed: 10
      luck: 11
      skills: [axe, sword, mace, chain, plate, shield, bodybuilding, meditation, sacrifice]
      magic:
        - { school: body, spells: [heal] }
      main_hand: bronze_labrys
      equipment: [chain_helmet]
      quick_spell: heal

    druid:
      description:
        - {text: "Nature hybrid with Water, Mind and Earth magic."}
        - {skill: animal_bonding, text: "{auto:Animal Bonding}: every weapon attack and spell, heals included, may call a {auto:bear ally} (up to 2) built from the Druid's own HP and damage."}
        - {text: "{heal:Awaken} rouses every unconscious hero; {damage:Deadly Swarm} bursts over an area and {damage:Ice Bolt} hits one foe."}
      auto_stats: {speed: 16, endurance: 20, primary: intellect, secondary: personality}
      might: 10
      intellect: 13
      personality: 13
      endurance: 10
      accuracy: 10
      speed: 11
      luck: 11
      skills: [staff, leather, meditation, bodybuilding, learning, animal_bonding]
      magic:
        - { school: water, spells: [ice_bolt] }
        - { school: mind,  spells: [awaken] }
        - { school: earth, spells: [deadly_swarm] }
      main_hand: oak_staff
      quick_spell: awaken

  # Race stat modifiers, ADDITIVE over class base stats. The classic roster is
  # human (baseline, no modifiers).
    thief:
      description:
        - {text: "No magic - a {control:trap book} instead: lay traps on the floor that wound and hold enemies. Daggers and blasters."}
        - {skill: trapper, text: "{control:Trapper} adds trap damage and hold time."}
        - {skill: sleight_of_hand, text: "{utility:Sleight of Hand} steals loot or gold on melee hits."}
        - {skill: lockpicking, text: "{utility:Lockpicking} opens locked doors."}
        - {skill: disarm_trap, text: "{utility:Disarm Trap} can disarm trapped chests."}
      auto_stats: {speed: 16, endurance: 18, primary: accuracy, secondary: intellect}
      might: 10
      intellect: 12
      personality: 8
      endurance: 10
      accuracy: 15
      speed: 13
      luck: 12
      skills: [dagger, blaster, leather, trapper, sleight_of_hand, meditation, disarm_trap, lockpicking]
      main_hand: magic_dagger
      equipment: [leather_armor]
      quick_trap: cleave_trap

    arms_master:
      description:
        - {text: "Master of {damage:every weapon but the blaster}. Leather and shield, no magic."}
        - {skill: dual_wielding, text: "{damage:Dual Wielding} adds an off-hand weapon. In real time each hand attacks on its own recovery; in turn-based the hero gets at least two actions a round and every weapon swing takes the other hand - main, off, main, off."}
        - {skill: arms_master, text: "{damage:Arms Master} starts at Expert and adds damage to every weapon hit."}
      auto_stats: {speed: 16, endurance: 26, primary: might}
      card_rarity: rare
      might: 15
      intellect: 8
      personality: 8
      endurance: 14
      accuracy: 13
      speed: 12
      luck: 10
      skills: [sword, dagger, axe, spear, bow, mace, staff, shield, leather, bodybuilding, arms_master, dual_wielding]
      skill_start_mastery: { arms_master: expert }
      main_hand: iron_sword

    monk:
      description:
