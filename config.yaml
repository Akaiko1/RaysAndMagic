        - {skill: iron_body, text: "{defense:Iron Body} gives a large Armor Class bonus instead."}
        - {skill: spiritual_training, text: "{auto:Spiritual Training}: each melee swing, even a miss, may {auto:autocast} the slotted attack spell for free."}
        - {text: "Knows {heal:Heal}, {damage:Harm}, {damage:Mind Blast} and {damage:Spirit Lash}."}
      auto_stats: {speed: 26, endurance: 28, primary: might, secondary: personality}
      card_rarity: rare
      might: 13
      intellect: 8
      personality: 12
      endurance: 11
      accuracy: 11
      speed: 14
      luck: 10
      skills: [learning, meditation, iron_body, spiritual_training, martial_arts]
      skill_start_mastery: { learning: expert }
      magic:
        - { school: body,   spells: [heal_other, harm] }
        - { school: mind,   spells: [mind_blast] }
        - { school: spirit, spells: [spirit_lash] }
      main_hand: monk_fists
      quick_spell: mind_blast

    # Spellblade in plate. Two class passives: Spell Absorption (a hostile
    # spell hit can be eaten for HP+SP) and Strong Magic (offensive casts burn
    # extra HP for proportionally harder hits) - numbers in character/catalog.go.
    battle_mage:
      description:
        - {text: "Spellblade in plate. Starts with {heal:Resurrect}, {damage:Rock Blast}, {damage:Firewall} and {damage:Sparks}."}
        - {skill: spell_absorption, text: "{defense:Spell Absorption} can swallow a hostile spell hit and turn it into HP and SP."}
        - {skill: strong_magic, text: "{damage:Strong Magic} makes attack spells hit up to twice as hard, paid for in HP."}
      auto_stats: {speed: 16, endurance: 36, primary: intellect, secondary: might}
      card_rarity: legendary
      might: 13
      intellect: 13
      personality: 8
      endurance: 13
      accuracy: 11
      speed: 10
      luck: 11
