name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A mistyped tag fails here in seconds, before anything is built or
  # published: the downloads page accepts only v<version>.<known channel>.
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the release tag
        run: go run ./tools/downloadspage -check-tag "${GITHUB_REF_NAME}"

  windows-shaders:
    needs: check-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Precompile DirectX shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          ./.github/scripts/test-fxc-discovery.ps1
          $fxc = & ./.github/scripts/find-fxc.ps1 -SdkBin $sdkBin
          $env:PATH = "$($fxc.Directory.FullName);$env:PATH"
          go run ./tools/shadergen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-shaders
          path: internal/shadercache/data/shaders.json.gz
          if-no-files-found: error

  build-release:
    needs: windows-shaders
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: windows-shaders
          path: internal/shadercache/data

      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Build release bundles
        run: |
          chmod +x ./build_mac_release.sh
          ./build_mac_release.sh

      - name: Package release archives
        run: |
          cd dist
          zip -r RaysAndMagic-mac-universal.zip mac_universal
          zip -r RaysAndMagic-windows-amd64.zip windows_amd64
          zip -r RaysAndMagic-linux-amd64.zip linux_amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RaysAndMagic-release
          path: dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip

  # Stable releases also go to itch.io. Each archive is pushed to the channel
  # named after it (windows-amd64, mac-universal, linux-amd64); the channel name
  # tags the platform on the itch page. Needs the BUTLER_API_KEY secret.
  itch:
    needs: build-release
    if: endsWith(github.ref_name, '.stable')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ITCH_TARGET: akaiko1/raysmagic
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: RaysAndMagic-release
          path: dist

      # The archive is checked before it runs beside the API key; a new butler
      # version brings its own SHA-256.
      - name: Install butler
        env:
          BUTLER_VERSION: 15.32.0
          BUTLER_SHA256: 2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5
        run: |
          curl -fsSL -o "$RUNNER_TEMP/butler.zip" "https://broth.itch.zone/butler/linux-amd64/$BUTLER_VERSION/archive/default"
          echo "$BUTLER_SHA256  $RUNNER_TEMP/butler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::The BUTLER_API_KEY repository secret is not set"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          version="${version%.stable}"
          shopt -s nullglob
          archives=(dist/RaysAndMagic-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No release archives in dist/"
            exit 1
          fi
          butler -V
          for archive in "${archives[@]}"; do
            channel="${archive#dist/RaysAndMagic-}"
            channel="${channel%.zip}"
            butler push "$archive" "$ITCH_TARGET:$channel" --userversion "$version"
          done

  downloads-page:
    needs: build-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
