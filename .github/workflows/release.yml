name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-shaders:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Precompile DirectX shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          ./.github/scripts/test-fxc-discovery.ps1
          $fxc = & ./.github/scripts/find-fxc.ps1 -SdkBin $sdkBin
          $env:PATH = "$($fxc.Directory.FullName);$env:PATH"
          go run ./tools/shadergen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-shaders
          path: internal/shadercache/data/shaders.json.gz
          if-no-files-found: error

  build-release:
    needs: windows-shaders
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: windows-shaders
          path: internal/shadercache/data

      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Build release bundles
        run: |
          chmod +x ./build_mac_release.sh
          ./build_mac_release.sh

      - name: Package release archives
        run: |
          cd dist
          zip -r RaysAndMagic-mac-amd64.zip mac_amd64
          zip -r RaysAndMagic-mac-arm64.zip mac_arm64
          zip -r RaysAndMagic-windows-amd64.zip windows_amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RaysAndMagic-release
          path: dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
