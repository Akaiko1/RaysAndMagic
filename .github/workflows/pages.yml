name: Downloads Page

# Rebuilds the GitHub Pages downloads site from the release list. release.yml
# calls it after publishing (releases made with GITHUB_TOKEN raise no events);
# the release trigger covers releases edited or deleted by hand.
on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Render with the newest release's generator, whatever triggered the run:
      # an older tag's one rejects archives added after it (fail-fast on
      # unknown archives), so editing an old release would stop the site.
      - name: Pick the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq 'map(select(.draft | not))[0].tag_name')
          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "No published release to render." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.newest.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[]' > "${RUNNER_TEMP}/releases.ndjson"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[]' > "${RUNNER_TEMP}/tags.ndjson"

      - name: Render page
        run: |
          go run ./tools/downloadspage \
            -releases "${RUNNER_TEMP}/releases.ndjson" \
            -tags "${RUNNER_TEMP}/tags.ndjson" \
            -repo "${GITHUB_REPOSITORY}" \
            -run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -image src/pyramid_isis.png \
            -out site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
