      biomes: [nomad_city]
      volume: 1.0
    highlands:
      file: audio/music/highlands.ogg
      biomes: [highlands]
      volume: 1.0
    dragon_cliffs:
      file: audio/music/dragon_cliffs.ogg
      biomes: [dragon_cliffs]
      volume: 1.0
    jungle:
      file: audio/music/jungle.ogg
      biomes: [jungle]
      volume: 1.0
    boss_fight:
