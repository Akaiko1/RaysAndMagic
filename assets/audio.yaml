sample_rate: 48000

# Mix (2026-10-21): music sits under the effects. Its bed is about 26 dB below
# full scale in the open world; a hit lands 3-4 dB above it. The music bus and
# the track volumes set the bed, the sound volumes set each cue's priority.
# Every sound file is mastered so its loudest 100 ms (K-weighted) sits at
# -20 dBFS with peaks at or under -1.4 dBFS; a new file must match.
buses:
  master: 1.0
  ui: 1.0
  sfx: 1.0
  music: 0.35

school_sounds:
  fire: spell_fire
  water: spell_water_ice
  air: spell_air_electric
  earth: spell_earth
  light: spell_light_heal
  body: spell_light_heal
  spirit: spell_light_heal
  dark: spell_dark_psychic
  mind: spell_dark_psychic

offensive_school_sounds:
  body: spell_dark_psychic
  spirit: spell_dark_psychic

weapon_category_sounds:
  bow: bow_release
  blaster: blaster_shot
  dagger: melee_swing

music:
  crossfade_ms: 2500
  boss_crossfade_ms: 900
  loop_crossfade_ms: 3000
  # A sound with duck_music_db lowers the music while it plays.
  duck_attack_ms: 150
  duck_release_ms: 600
  boss_track: boss_fight
  # Track volume is the track's role: fights 1.0, dungeons 0.89 (-1 dB), open
  # world 0.84 (-1.5 dB), towns and temples 0.71 (-3 dB). Every file is
  # mastered to -14 LUFS. loop_start_ms/loop_end_ms skip an authored intro on
  # repeats and an authored fade-out, so the loop seam does not dip.
  tracks:
    forest:
      file: audio/music/forest.ogg
      biomes: [forest]
      volume: 0.84
    desert:
      file: audio/music/desert.ogg
      biomes: [desert]
      volume: 0.84
      loop_start_ms: 15500
      loop_end_ms: 145500
    water:
      file: audio/music/water.ogg
      biomes: [water]
      volume: 0.84
    church:
      file: audio/music/church.ogg
      biomes: [church]
      volume: 0.71
    clock_tower:
      file: audio/music/clockwork.ogg
      biomes: [clock_tower_workshop, clock_tower_gearworks, clock_tower_belfry]
      volume: 0.89
    arena:
      file: audio/music/arena.ogg
      biomes: [arena]
      volume: 1.0
    pyramid:
      file: audio/music/pyramid.ogg
      biomes: [pyramid]
      volume: 0.89
      loop_start_ms: 7000
      loop_end_ms: 147000
    lich_nexus:
      file: audio/music/lich_nexus.ogg
      biomes: [lich_nexus]
      volume: 0.89
      loop_start_ms: 500
      loop_end_ms: 143500
    culverts:
      file: audio/music/culverts.ogg
      biomes: [culverts]
      volume: 0.89
    # The eastern island shares one theme for now: the garden sits behind the
    # castle on the same island, so the castle track carries both until the
    # garden gets its own.
    japanese_castle:
      file: audio/music/japanese_castle.ogg
      biomes: [japanese_castle, sakura_garden]
      volume: 0.84
      loop_start_ms: 10500
      loop_end_ms: 144000
    city:
      file: audio/music/city.ogg
      biomes: [city]
      volume: 0.71
    elf_city:
      file: audio/music/elf_city.ogg
      biomes: [elf_city]
      volume: 0.71
    nomad_city:
      file: audio/music/nomad_city.ogg
      biomes: [nomad_city]
      volume: 0.71
    highlands:
      file: audio/music/highlands.ogg
      biomes: [highlands]
      volume: 0.84
      loop_start_ms: 5000
      loop_end_ms: 143000
    dragon_cliffs:
      file: audio/music/dragon_cliffs.ogg
      biomes: [dragon_cliffs]
      volume: 0.84
      loop_start_ms: 5000
      loop_end_ms: 147000
    # The Solstice temple stands in the jungle and borrows its theme until the
    # vestibule and the four chambers get their own; the approach is jungle.
    jungle:
      file: audio/music/jungle.ogg
      biomes: [jungle, solstice_vestibule, solstice_fire, solstice_water, solstice_earth, solstice_air]
      volume: 0.84
      loop_start_ms: 12500
      loop_end_ms: 146500
    boss_fight:
      file: audio/music/boss_fight.ogg
      volume: 1.0

