# Quest Configuration
# This file defines all quests in the game

quests:
  # Starting quests - given at the beginning of the game
  goblin_hunt:
    name: "Goblin Hunt"
    description: "The local village has been plagued by goblins. Hunt down 5 of them to make the area safer."
    type: "kill"
    target_monster: "goblin"
    target_count: 5
    is_starting_quest: true
    rewards:
      gold: 50
      experience: 100

  wolf_pack:
    name: "Wolf Pack"
    description: "A pack of wolves has been attacking travelers on the road. Eliminate 3 wolves to protect the trade routes."
    type: "kill"
    target_monster: "wolf"
    target_count: 3
    is_starting_quest: true
    rewards:
      gold: 75
      experience: 150

  # Archmage trial - given by the Mage Tower; turning it in promotes a member.
  archmage_trial:
    name: "The Archmage's Trial"
    description: "Prove your mastery of Light: slay the Lich King, then return to the Mage Tower."
    type: "kill"
    target_monster: "lich_king"
    target_count: 1
    is_starting_quest: false
    rewards:
      gold: 0
      experience: 0

  dragon_cliffs_troll_cull:
    name: "Cliffwatch Troll Cull"
    description: "Maera Cliffwatch wants the mountain trolls thinned before they overrun the bridge approaches."
    type: "kill"
    target_monster: "mountain_troll"
    target_count: 3
    target_map: "dragon_cliffs"   # cull the cliff trolls; trolls also roam the highlands
    is_starting_quest: false
    rewards:
      gold: 900
      experience: 800

  culverts_valves:
    name: "Stem the Flow"
    description: "Old Sewerman Garran wants the seven sluice valves in the Seabright culverts shut to flush out the Golden Thief Bug's lair."
    type: "interact"
    target_monster: "valve"   # interaction tag matched by OnInteract
    target_count: 7
    is_starting_quest: false
    rewards:
      gold: 1500
      experience: 700

  castle_armory:
    name: "The Warlord's Armoury"
    description: "An old retainer at the eastern castle bids you strip the five katana racks hidden behind the keep's shoji screens. Only when the castle's own steel is taken will the sealed Samurai Warlord stir to face you."
    type: "interact"
    target_monster: "sword_rack"   # interaction tag matched by OnInteract
    target_count: 5
    is_starting_quest: false
    rewards:
      gold: 2500
      experience: 1600

  # Aldric's wolf cull: completes when NO living wolf remains on the forest map
  # (extermination check), not just at the kill quota. Completion swaps the two
  # water tiles east of the lake trader for bridge planks.
  forest_wolf_cull:
    name: "Wolves of the Lakeshore"
    description: "Mystic Trader Aldric will lay a bridge to his colleague on the lake once every wolf in the Elvish Forest is dead."
    type: "kill"
    target_monster: "wolf"
    target_count: 21
    target_map: "forest"
    exterminate: true
    is_starting_quest: false
    rewards:
      gold: 600
      experience: 700
    on_complete_tiles:
      - { map: forest, x: 22, y: 24, tile: quest_bridge }
      - { map: forest, x: 23, y: 24, tile: quest_bridge }

  dragon_cliffs_ember_rites:
    name: "Ember Rites"
    description: "Old Varric says the cliff mages have begun listening to something beneath the dragon bones. Slay two archmages to break the rite."
    type: "kill"
    target_monster: "archmage"
    target_count: 2
    target_map: "dragon_cliffs"   # break the cliff rite; archmages also dwell in the highlands
    is_starting_quest: false
    rewards:
      gold: 1200
      experience: 1200

  # The dragon hunt: a rewarded quest that also unseals the reaper
  # (victory itself now belongs to endgame_triad).
  dragon_slayer:
    name: "Dragon Slayer"
    description: "Elder dragons terrorize the desert. Slay all 4 to become a true hero and save the realm."
    type: "kill"
    target_monster: "elder_dragon"   # all 4 statue dragons are named "Elder Dragon" -> type "elder_dragon"
    target_count: 4
    encounter_only: true
    is_starting_quest: true
    rewards:
      arena_points: 5000
    # The reaper comes to collect ONLY when all four god-machines are dead:
    # he materializes on the sanctum dais among his Isis handmaidens.
    on_complete_spawns:
      - { id: reaper_dais, map: pyramid_3, x: 15, y: 5, monster: ancient_god_of_death }

  # ============ ENDGAME TRIAD GATES ============
  # Starting quests so they are active on every run AND on loaded old saves
  # (quest Reset() re-seeds starting quests before a save lays its snapshot).

  # Gate for the Brood Mother: she materializes in the Ember Crater the moment
  # no dragon is left alive on the cliffs (on_complete_spawns fires once).
  broodmother_nests:
    name: "The Silent Nests"
    description: "The cliff dragons guard more than bones. Rangers swear something vast breathes beneath the Ember Crater, and that it wakes only for silence. Leave no dragon alive on the Dragon Cliffs."
    type: "kill"
    target_monster: "dragon"
    target_count: 7   # nominal; exterminate snapshots the live census at accept
    target_map: "dragon_cliffs"
    exterminate: true
    is_starting_quest: true
    rewards:
      gold: 3000
      experience: 3000
    on_complete_spawns:
      - { id: brood_mother_crater, map: dragon_cliffs, x: 39, y: 12, monster: dragon_brood_mother }

  # Gate for the Alien Enforcer: he surfaces in the Ocean Depths only AFTER the
  # party purges the Pursuer scouts and comes back down (on_entry defers the
  # spawn past the purge visit - the tavern rumor sends you back).
  water_purge:
    name: "The Quiet Deep"
    description: "Fisherfolk say the drowned lights have multiplied, and that things which are not fish now walk the seabed. Scour the Ocean Depths of the pale strangers - and mind what their silence wakes."
    type: "kill"
    target_monster: "alien"
    target_count: 3   # nominal; exterminate snapshots the live census at accept
    target_map: "water"
    exterminate: true
    is_starting_quest: true
    rewards:
      gold: 3000
      experience: 3500
    on_complete_spawns:
      - { id: enforcer_depths, map: water, x: 28, y: 43, monster: alien_enforcer, on_entry: true }

  # THE endgame quest - the VICTORY CONDITION (checkVictory watches it).
  # Its only reward is the victory itself (user decree): no gold, no xp.
  endgame_triad:
    name: "The Last Reckoning"
    description: "Three shadows crown the age: the mother brooding in her crater, the horned court risen under the sand, and the iron thing beneath the tide. End all three, and the realm is saved."
    type: "kill"
    target_monsters: ["brood_mother", "ancient_god_of_death", "alien_enforcer"]
    target_count: 3
    is_starting_quest: true
    auto_claim: true
    victory: true
    rewards:
      gold: 0
      experience: 0
