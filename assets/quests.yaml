# Quest Configuration
# This file defines all quests in the game

quests:
  # The opening chain: Wenna the herb-picker stands by the forest clearing where
  # the party begins. She asks for the goblins first and only mentions the wolves
  # once that is done (requires_quest in npcs.yaml), so a new party is handed one
  # errand at a time instead of a full journal on turn one.
  goblin_hunt:
    name: "Goblin Hunt"
    description: "Goblins have driven Wenna the Herb-Picker off the southern herb paths. Kill {target_count} Goblins south of the forest clearing, then return to Wenna for payment."
    type: "kill"
    target_monster: "goblin"
    target_count: 5
    target_map: "forest"
    is_starting_quest: false
    rewards:
      gold: 50
      experience: 100

  wolf_pack:
    name: "Wolf Pack"
    description: "Wenna can gather herbs to the south again, but wolves have stopped the carts on the north forest road. Kill {target_count} Wolves there and report back to her."
    type: "kill"
    target_monster: "wolf"
    target_count: 3
    target_map: "forest"
    is_starting_quest: false
    rewards:
      gold: 75
      experience: 150

  # The bather's nightly errand: the lake spiders come with the dark, so this one
  # is repeatable - cleared again at every nightfall (see refreshRepeatableQuests)
  # and paid in whatever draught she has on her.
  lake_spiders:
    name: "The Lake at Night"
    description: "Ilsa wants a bath without Forest Spiders gathering on the bank. Kill {target_count} at the forest lake and return to her for a reward. More arrive each night; she will pay for another clearing."
    type: "kill"
    target_monster: "forest_spider"
    target_count: 5
    target_map: "forest"
    is_starting_quest: false
    repeatable: true
    rewards:
      gold: 60
      experience: 120
      item_pool:
        - "health_potion"
        - "mana_potion"
        - "flame_ward_draught"
        - "storm_ward_draught"
        - "gloom_ward_draught"
        - "stoneskin_draught"

  # Archmage trial - given by the Mage Tower; turning it in promotes a member.
  archmage_trial:
    name: "The Archmage's Trial"
    description: "The Mage Tower offers one of us the rank of Archmage and command of Light magic. First we must slay the Lich King in the Lich Nexus and return. The tower warns that the Light will remain within whoever accepts it."
    type: "kill"
    target_monster: "lich_king"
    target_count: 1
    is_starting_quest: false
    rewards:
      gold: 0
      experience: 0

  dragon_cliffs_troll_cull:
    name: "Cliffwatch Troll Cull"
    description: "Mountain Trolls are blocking the bridges on the Dragon Cliffs. Maera Cliffwatch needs {target_count} killed before the caravans can pass. Return to her when the work is done."
    type: "kill"
    target_monster: "mountain_troll"
    target_count: 3
    target_map: "dragon_cliffs"   # cull the cliff trolls; trolls also roam the highlands
    is_starting_quest: false
    rewards:
      gold: 900
      experience: 600

  culverts_valves:
    name: "Stem the Flow"
    description: "Grist the Sluice-Rat needs all 7 sluice valves shut in the Seabright Culverts. This will drain the Golden Thief Bug's lair and open the way to its hoard. Among the stolen jewels are warm cases that spit sparks. Report back to Grist."
    type: "interact"
    target_monster: "valve"   # interaction tag matched by OnInteract
    target_count: 7
    progress_text: "valves closed"
    is_starting_quest: false
    rewards:
      gold: 1500
      experience: 700

  castle_armory:
    name: "The Warlord's Armoury"
    description: "Shozo the Ronin has a way to wake the Samurai Warlord: take the weapons from all 5 katana racks behind the eastern castle's shoji screens. Return to Shozo afterward. The temple sealed his lord in the keep, but the eastern rot still moves the dead man's hands."
    type: "interact"
    target_monster: "sword_rack"   # interaction tag matched by OnInteract
    target_count: 5
    progress_text: "sword racks stripped"
    is_starting_quest: false
    rewards:
      gold: 2500
      experience: 1400

  # --- Sakura Garden (eastern island, L18-24) ---
  # Four local errands: three ward quests in any order, then Hina's capstone
  # boss hunt. Hina's offer is gated behind all three via a nested
  # requires_quest chain on her dialogue (npcs.yaml), one prerequisite per
  # level - the quest definitions themselves stay flat.
  silent_bells:
    name: "The Silent Bells"
    description: "The Kasa Obake in the Sakura Garden have lodged fragments of the broken ward chimes in their umbrella ribs. Shiori needs {target_count} of these creatures killed to stop the bells. Return to her at the shrine."
    type: "kill"
    target_monster: "kasa_obake"
    target_count: 5
    target_map: "sakura_garden"
    is_starting_quest: false
    rewards:
      gold: 1000
      experience: 750
      item_pool:
        - "flame_ward_draught"
        - "storm_ward_draught"
        - "gloom_ward_draught"
        - "stoneskin_draught"

  stolen_water_seal:
    name: "The Stolen Water Seals"
    description: "Kappa stole the carved seals that control the koi channels. Kill {target_count} Kappa at the Moon Pond in the Sakura Garden, then report to Ayame the pond keeper so she can put the waterworks right."
    type: "kill"
    target_monster: "kappa"
    target_count: 4
    target_map: "sakura_garden"
    is_starting_quest: false
    rewards:
      gold: 1200
      experience: 850
      item_pool:
        - "health_potion"
        - "mana_potion"
        - "stoneskin_draught"

  feathers_false_oath:
    name: "Feathers of the False Oath"
    description: "Kuroha's flock has sworn itself to the power that possesses the castle's dead warlord. Kill {target_count} Karasu Tengu on the Sakura Garden ridge and return to the exile Kuroha."
    type: "kill"
    target_monster: "karasu_tengu"
    target_count: 4
    target_map: "sakura_garden"
    is_starting_quest: false
    rewards:
      gold: 1600
      experience: 1100
      item_pool:
        - "tengu_feather"

  fivefold_web:
    name: "The Fivefold Web"
    description: "Hina has traced the garden's damaged wards to the Sakura Jorogumo. The spider bride feeds on their magic through a web in the orchard. Kill her in the Sakura Garden and return to Hina."
    type: "kill"
    target_monster: "sakura_jorogumo"
    target_count: 1
    target_map: "sakura_garden"
    is_starting_quest: false
    rewards:
      gold: 3000
      experience: 2300
      item_pool:
        - "spider_lily_obi"
        - "fivefold_ceremonial_ribbon"
        - "moonspun_silk"

  # Mira's wolf cull: completes when NO living wolf remains on the forest map
  # (extermination check), not just at the kill quota. Completion swaps the two
  # water tiles east of the lake trader for bridge planks.
  forest_wolf_cull:
    name: "Wolves of the Lakeshore"
    description: "Apprentice Mira has the planks for a bridge to Priestess Liora's shrine, but wolves keep her from finishing it. Kill every Wolf in the Elvish Forest and return to Mira. She will lay the bridge across the lake."
    type: "kill"
    target_monster: "wolf"
    target_count: 21
    target_map: "forest"
    exterminate: true
    is_starting_quest: false
    rewards:
      gold: 600
      experience: 700
    on_complete_tiles:
      - { map: forest, x: 22, y: 24, tile: quest_bridge }
      - { map: forest, x: 23, y: 24, tile: quest_bridge }

  dragon_cliffs_ember_rites:
    name: "Ember Rites"
    description: "Old Varric has seen lights flashing inside the Dragon Cliffs in answer to a rite over the dragon bones. Kill {target_count} Archmages conducting it before they wake the buried fire. Return to Varric for payment."
    type: "kill"
    target_monster: "archmage"
    target_count: 2
    target_map: "dragon_cliffs"   # break the cliff rite; archmages also dwell in the highlands
    is_starting_quest: false
    rewards:
      gold: 1200
      experience: 900

  # The dragon hunt: a rewarded quest that also unseals the reaper
  # (victory itself now belongs to endgame_triad).
  dragon_slayer:
    name: "Dragon Slayer"
    description: "Swear Sylwen the Pilgrim's hunt, then slay {target_count} Elder Dragons at the desert seals and return to her. Each seal needs a matching colored statuette from the Pyramid Sanctum's reliquaries. Beneath the dragons' scorched hides lie riveted plates; sword cuts throw sparks."
    type: "kill"
    target_monster: "elder_dragon"   # all 4 statue dragons are named "Elder Dragon" -> type "elder_dragon"
    target_count: 4
    encounter_only: true
    # Taken from Sylwen, the pilgrim keeping vigil at the desert seals. The
    # statues refuse a statuette until this oath is sworn (buildStatueChoices),
    # so the hunt can never be finished by a party that never accepted it.
    is_starting_quest: false
    rewards:
      arena_points: 5000
    # The reaper comes to collect ONLY when all four god-machines are dead:
    # he materializes on the sanctum dais among his Isis handmaidens.
    on_complete_spawns:
      - { id: reaper_dais, map: pyramid_3, x: 15, y: 5, monster: ancient_god_of_death }

  # ============ SERVICE GATES ============
  # Three outland services stay shut until their errand is paid off
  # (requires_quest on the NPC in npcs.yaml): the Starlight Archive's deep
  # pages, Dunehold's Light and Dark pages, and Dunehold's mastery training.
  # Each giver is the shopkeeper, so the task is the price of admission.

  archive_missing_volumes:
    name: "The Archive's Missing Volumes"
    description: "The Starlight Archive's missing books have grown legs and teeth. Destroy {target_count} Possessed Tomes in the Clock Tower's Gearworks and report to Keeper Ilthaea. She will then sell us the Archive's advanced spells."
    type: "kill"
    target_monster: "possessed_tome"
    target_count: 3
    target_map: "clock_tower_2"   # the Gearworks; the Belfry libraries hold far more of them
    is_starting_quest: false
    rewards:
      gold: 2000
      experience: 1500

  shrine_lamps:
    name: "The Shrine's Lamps"
    description: "Yusra lent three shrine lamps to pilgrims who never returned from the Pyramid. Recover all 3, one on each floor, and bring them to her to reopen the shrine's spell shop. The lamps burn without oil."
    type: "interact"
    target_monster: "shrine_lamp"   # interaction tag matched by OnInteract
    target_count: 3
    progress_text: "shrine lamps lifted"
    is_starting_quest: false
    rewards:
      gold: 2000
      experience: 1800

  pit_standing:
    name: "Standing in the Pit"
    description: "Nadira has heard enough boasts from passing caravans. Win 3 duels in the Grand Arena at any stakes, then return to her in Dunehold. She offers Grandmaster lessons to those who already hold Master rank."
    type: "interact"
    target_monster: "arena_duel"   # bumped when a challenged champion falls (arenaDuelQuestTag)
    target_count: 3
    progress_text: "arena duels won"
    is_starting_quest: false
    rewards:
      gold: 2500
      experience: 1500

  # ============ ENDGAME TRIAD GATES ============
  # Starting quests so they are active on every run AND on loaded old saves
  # (quest Reset() re-seeds starting quests before a save lays its snapshot).

  # Gate for the Brood Mother: she materializes in the Ember Crater the moment
  # no dragon is left alive on the cliffs (on_complete_spawns fires once).
  broodmother_nests:
    name: "The Silent Nests"
    description: "Slay every Dragon on the Dragon Cliffs to draw the Brood Mother into the Ember Crater. The cliff dragons give off smoke without breathing; their eyes light before their heads turn. Something built these creatures."
    type: "kill"
    target_monster: "dragon"
    target_count: 7   # nominal; exterminate snapshots the live census at accept
    target_map: "dragon_cliffs"
    exterminate: true
    is_starting_quest: true
    rewards:
      gold: 3000
      experience: 2300
    on_complete_spawns:
      - { id: brood_mother_crater, map: dragon_cliffs, x: 39, y: 12, monster: dragon_brood_mother }

  # Gate for the Alien Enforcer: he surfaces in the Ocean Depths only AFTER the
  # party purges the Pursuer scouts and comes back down (on_entry defers the
  # spawn past the purge visit - the tavern rumor sends you back).
  water_purge:
    name: "The Quiet Deep"
    description: "Alien lamps burn in rows on the floor of the Ocean Depths. Kill every Alien there, leave the depths, then dive again. The Alien Enforcer will rise from deeper water to meet us on our return."
    type: "kill"
    target_monster: "alien"
    target_count: 3   # nominal; exterminate snapshots the live census at accept
    target_map: "water"
    exterminate: true
    is_starting_quest: true
    rewards:
      gold: 3000
      experience: 1800
    on_complete_spawns:
      - { id: enforcer_depths, map: water, x: 28, y: 43, monster: alien_enforcer, on_entry: true }

  # THE endgame quest - the VICTORY CONDITION (checkVictory watches it).
  # Its only reward is the victory itself (user decree): no gold, no xp.
  endgame_triad:
    name: "The Last Reckoning"
    description: "Three enemies remain between the realm and safety: the Brood Mother in the Ember Crater, the Ancient God of Death beneath the pyramid, and the Alien Enforcer in the Ocean Depths. Find and slay all three."
    type: "kill"
    target_monsters: ["brood_mother", "ancient_god_of_death", "alien_enforcer"]
    target_count: 3
    is_starting_quest: true
    auto_claim: true
    victory: true
    rewards:
      gold: 0
      experience: 0
