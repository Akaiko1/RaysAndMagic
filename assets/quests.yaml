# Quest Configuration
# This file defines all quests in the game

quests:
  # The opening chain: Wenna the herb-picker stands by the forest clearing where
  # the party begins. She asks for the goblins first and only mentions the wolves
  # once that is done (requires_quest in npcs.yaml), so a new party is handed one
  # errand at a time instead of a full journal on turn one.
  goblin_hunt:
    name: "Goblin Hunt"
    description: "Kill 5 Goblins on the herb paths south of the forest clearing for Wenna the Herb-Picker and report back to her."
    type: "kill"
    target_monster: "goblin"
    target_count: 5
    is_starting_quest: false
    rewards:
      gold: 50
      experience: 100

  wolf_pack:
    name: "Wolf Pack"
    description: "Kill 3 Wolves on the north forest road for Wenna the Herb-Picker and report back to her."
    type: "kill"
    target_monster: "wolf"
    target_count: 3
    is_starting_quest: false
    rewards:
      gold: 75
      experience: 150

  # The bather's nightly errand: the lake spiders come with the dark, so this one
  # is repeatable - cleared again at every nightfall (see refreshRepeatableQuests)
  # and paid in whatever draught she has on her.
  lake_spiders:
    name: "The Lake at Night"
    description: "Kill 5 Forest Spiders at the forest lake for Ilsa and report back to her. She asks again each night."
    type: "kill"
    target_monster: "forest_spider"
    target_count: 5
    target_map: "forest"
    is_starting_quest: false
    repeatable: true
    rewards:
      gold: 60
      experience: 120
      item_pool:
        - "health_potion"
        - "mana_potion"
        - "flame_ward_draught"
        - "storm_ward_draught"
        - "gloom_ward_draught"
        - "stoneskin_draught"

  # Archmage trial - given by the Mage Tower; turning it in promotes a member.
  archmage_trial:
    name: "The Archmage's Trial"
    description: "Slay the Lich King in the Lich Nexus and report back to the Mage Tower to be raised to Archmage. The raising is not a title. They put something into the one raised, and it stays in there."
    type: "kill"
    target_monster: "lich_king"
    target_count: 1
    is_starting_quest: false
    rewards:
      gold: 0
      experience: 0

  dragon_cliffs_troll_cull:
    name: "Cliffwatch Troll Cull"
    description: "Kill 3 Mountain Trolls on the Dragon Cliffs for Maera Cliffwatch and report back to her."
    type: "kill"
    target_monster: "mountain_troll"
    target_count: 3
    target_map: "dragon_cliffs"   # cull the cliff trolls; trolls also roam the highlands
    is_starting_quest: false
    rewards:
      gold: 900
      experience: 800

  culverts_valves:
    name: "Stem the Flow"
    description: "Shut the 7 sluice valves in the Seabright Culverts for Sewerman Garran and report back to him. Shutting them opens the Golden Thief Bug's lair. It hoards rings and crowns, and things that are neither: small warm cases that spark when pried at."
    type: "interact"
    target_monster: "valve"   # interaction tag matched by OnInteract
    target_count: 7
    progress_text: "valves closed"
    is_starting_quest: false
    rewards:
      gold: 1500
      experience: 700

  castle_armory:
    name: "The Warlord's Armoury"
    description: "Strip the 5 katana racks behind the shoji screens of the eastern castle for the old retainer and report back to him. Taking the castle's steel wakes the Samurai Warlord. The temple sealed him for what the eastern rot put inside him. It is still in there, and it works his arms for him."
    type: "interact"
    target_monster: "sword_rack"   # interaction tag matched by OnInteract
    target_count: 5
    progress_text: "sword racks stripped"
    is_starting_quest: false
    rewards:
      gold: 2500
      experience: 1600

  # --- Sakura Garden (eastern island, L18-24) ---
  # Four local errands: three ward quests in any order, then Hina's capstone
  # boss hunt. Hina's offer is gated behind all three via a nested
  # requires_quest chain on her dialogue (npcs.yaml), one prerequisite per
  # level - the quest definitions themselves stay flat.
  silent_bells:
    name: "The Silent Bells"
    description: "Kill 5 Kasa Obake in the Sakura Garden for Shiori the shrine keeper and report back to her. The umbrellas carry pieces of the castle's broken ward chimes, and the shrine bells will not settle while they hop."
    type: "kill"
    target_monster: "kasa_obake"
    target_count: 5
    target_map: "sakura_garden"
    is_starting_quest: false
    rewards:
      gold: 1000
      experience: 1000
      item_pool:
        - "flame_ward_draught"
        - "storm_ward_draught"
        - "gloom_ward_draught"
        - "stoneskin_draught"

  stolen_water_seal:
    name: "The Stolen Water Seals"
    description: "Kill 4 Kappa at the Moon Pond in the Sakura Garden for Ayame the pond keeper and report back to her. They stole the carved seals that work the koi channels."
    type: "kill"
    target_monster: "kappa"
    target_count: 4
    target_map: "sakura_garden"
    is_starting_quest: false
    rewards:
      gold: 1200
      experience: 1100
      item_pool:
        - "health_potion"
        - "mana_potion"
        - "stoneskin_draught"

  feathers_false_oath:
    name: "Feathers of the False Oath"
    description: "Kill 4 Karasu Tengu on the ridge in the Sakura Garden for Kuroha the exile and report back. The flock swore a new oath to what stirs in the castle."
    type: "kill"
    target_monster: "karasu_tengu"
    target_count: 4
    target_map: "sakura_garden"
    is_starting_quest: false
    rewards:
      gold: 1600
      experience: 1500
      item_pool:
        - "tengu_feather"

  fivefold_web:
    name: "The Fivefold Web"
    description: "Kill the Sakura Jorogumo in the orchard of the Sakura Garden for Hina the onmyoji apprentice and report back to her. The spider has tied the garden's three broken wards into one web and feeds on their echo."
    type: "kill"
    target_monster: "sakura_jorogumo"
    target_count: 1
    target_map: "sakura_garden"
    is_starting_quest: false
    rewards:
      gold: 3000
      experience: 3000
      item_pool:
        - "spider_lily_obi"
        - "fivefold_ceremonial_ribbon"
        - "moonspun_silk"

  # Aldric's wolf cull: completes when NO living wolf remains on the forest map
  # (extermination check), not just at the kill quota. Completion swaps the two
  # water tiles east of the lake trader for bridge planks.
  forest_wolf_cull:
    name: "Wolves of the Lakeshore"
    description: "Kill every Wolf in the Elvish Forest for Mystic Trader Aldric and report back to him. He will lay a bridge across the lake."
    type: "kill"
    target_monster: "wolf"
    target_count: 21
    target_map: "forest"
    exterminate: true
    is_starting_quest: false
    rewards:
      gold: 600
      experience: 700
    on_complete_tiles:
      - { map: forest, x: 22, y: 24, tile: quest_bridge }
      - { map: forest, x: 23, y: 24, tile: quest_bridge }

  dragon_cliffs_ember_rites:
    name: "Ember Rites"
    description: "Kill 2 Archmages on the Dragon Cliffs for Old Varric and report back to him. They chant over the dragon bones, and lately a light answers back from inside the rock, blinking slow."
    type: "kill"
    target_monster: "archmage"
    target_count: 2
    target_map: "dragon_cliffs"   # break the cliff rite; archmages also dwell in the highlands
    is_starting_quest: false
    rewards:
      gold: 1200
      experience: 1200

  # The dragon hunt: a rewarded quest that also unseals the reaper
  # (victory itself now belongs to endgame_triad).
  dragon_slayer:
    name: "Dragon Slayer"
    description: "Slay all 4 Elder Dragons at the desert seals for Sylwen the Pilgrim and report back to her. The seals will not open until you swear the hunt. The dragons do not bleed. Cut one and it sparks, and the hide under the scorch is riveted plate."
    type: "kill"
    target_monster: "elder_dragon"   # all 4 statue dragons are named "Elder Dragon" -> type "elder_dragon"
    target_count: 4
    encounter_only: true
    # Taken from Sylwen, the pilgrim keeping vigil at the desert seals. The
    # statues refuse a statuette until this oath is sworn (buildStatueChoices),
    # so the hunt can never be finished by a party that never accepted it.
    is_starting_quest: false
    rewards:
      arena_points: 5000
    # The reaper comes to collect ONLY when all four god-machines are dead:
    # he materializes on the sanctum dais among his Isis handmaidens.
    on_complete_spawns:
      - { id: reaper_dais, map: pyramid_3, x: 15, y: 5, monster: ancient_god_of_death }

  # ============ SERVICE GATES ============
  # Three outland services stay shut until their errand is paid off
  # (requires_quest on the NPC in npcs.yaml): the Starlight Archive's deep
  # pages, Dunehold's Light and Dark pages, and Dunehold's mastery training.
  # Each giver is the shopkeeper, so the task is the price of admission.

  archive_missing_volumes:
    name: "The Archive's Missing Volumes"
    description: "Kill 3 Possessed Tomes in the Gearworks of the Clock Tower for Keeper Ilthaea and report back to her. The Archive lent the tower three books. They walk the floor down there on their own legs."
    type: "kill"
    target_monster: "possessed_tome"
    target_count: 3
    target_map: "clock_tower_2"   # the Gearworks; the Belfry libraries hold far more of them
    is_starting_quest: false
    rewards:
      gold: 2000
      experience: 2000

  shrine_lamps:
    name: "The Shrine's Lamps"
    description: "Recover the 3 shrine lamps from the Pyramid for Yusra of the Oasis and return them to her. There is no oil in them and they are still warm."
    type: "interact"
    target_monster: "shrine_lamp"   # interaction tag matched by OnInteract
    target_count: 3
    progress_text: "shrine lamps lifted"
    is_starting_quest: false
    rewards:
      gold: 2000
      experience: 2200

  pit_standing:
    name: "Standing in the Pit"
    description: "Win 3 duels in the Grand Arena for Blademaster Nadira and report back to her. She sharpens no mastery for a student who has not stood on the sand."
    type: "interact"
    target_monster: "arena_duel"   # bumped when a challenged champion falls (arenaDuelQuestTag)
    target_count: 3
    progress_text: "arena duels won"
    is_starting_quest: false
    rewards:
      gold: 2500
      experience: 2500

  # ============ ENDGAME TRIAD GATES ============
  # Starting quests so they are active on every run AND on loaded old saves
  # (quest Reset() re-seeds starting quests before a save lays its snapshot).

  # Gate for the Brood Mother: she materializes in the Ember Crater the moment
  # no dragon is left alive on the cliffs (on_complete_spawns fires once).
  broodmother_nests:
    name: "The Silent Nests"
    description: "Leave no Dragon alive on the Dragon Cliffs. The Brood Mother wakes in the Ember Crater when the cliffs fall silent. The cliff dragons vent smoke without drawing breath, and their eyes light up before they turn."
    type: "kill"
    target_monster: "dragon"
    target_count: 7   # nominal; exterminate snapshots the live census at accept
    target_map: "dragon_cliffs"
    exterminate: true
    is_starting_quest: true
    rewards:
      gold: 3000
      experience: 3000
    on_complete_spawns:
      - { id: brood_mother_crater, map: dragon_cliffs, x: 39, y: 12, monster: dragon_brood_mother }

  # Gate for the Alien Enforcer: he surfaces in the Ocean Depths only AFTER the
  # party purges the Pursuer scouts and comes back down (on_entry defers the
  # spawn past the purge visit - the tavern rumor sends you back).
  water_purge:
    name: "The Quiet Deep"
    description: "Kill every Alien in the Ocean Depths, then dive again. The Alien Enforcer surfaces on your return. They do not drown and they do not surface, and their lamps burn steady down there in rows."
    type: "kill"
    target_monster: "alien"
    target_count: 3   # nominal; exterminate snapshots the live census at accept
    target_map: "water"
    exterminate: true
    is_starting_quest: true
    rewards:
      gold: 3000
      experience: 3500
    on_complete_spawns:
      - { id: enforcer_depths, map: water, x: 28, y: 43, monster: alien_enforcer, on_entry: true }

  # THE endgame quest - the VICTORY CONDITION (checkVictory watches it).
  # Its only reward is the victory itself (user decree): no gold, no xp.
  endgame_triad:
    name: "The Last Reckoning"
    description: "Slay the Brood Mother in the Ember Crater, the Ancient God of Death beneath the pyramid, the Alien Enforcer in the Ocean Depths, and save the realm."
    type: "kill"
    target_monsters: ["brood_mother", "ancient_god_of_death", "alien_enforcer"]
    target_count: 3
    is_starting_quest: true
    auto_claim: true
    victory: true
    rewards:
      gold: 0
      experience: 0
