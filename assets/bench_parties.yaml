# Benchmark parties: realistic builds at fixed levels for balance checks and
# play-tests. Launch one with `bin/test_scenario.command bench_<party>_<level>`
# or build it headless through ApplyTestScenario (see docs/test-scenarios.md).
#
# Together the parties field every class and every race. Each member is built
# by the normal progression: class kit, race, XP level-ups, the class auto
# stat chain. A build then lists:
#   - skills / schools: tiers above Novice. The budget is one tier per third
#     level plus trainer purchases: 6 at L15, 8 at L20, 11 at L25, 14 at L30.
#   - equipment: only gear obtainable by that level (drops from monsters at or
#     below it, shops, arena points from L20, clock hands from L22, dragon
#     scales late). Every open school knows all of its spells.
#   - spell / quick: the readied action (spell, flask, trap or technique) and
#     the quick-slot bar.
#   - items: everything the party carries, by key and count. Parties without
#     a healer carry 50 health and 50 mana potions.
# A member written as {name: X, from: <party>} copies that party's X.
# A variant (base: <party>) copies that party and lists only its changes:
# without_spells (no member learns them) and spell (a member's readied action
# at every level).
# TestBenchPartiesBuildAsAuthored enforces all of the above.
levels: [15, 20, 25, 30]

