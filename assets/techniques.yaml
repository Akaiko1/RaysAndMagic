techniques:
  - key: fold_step
    name: Fold Step
    description: "Cross open gaps and land on solid ground. Walls, doors and exits block the step. Repeated steps keep the original return point and refresh its lifetime."
    icon: icon_technique_fold_step
    level: 1
    sp_cost: [8, 7, 6, 5]
    range_tiles: [3, 4, 6, 8]
    min_range_tiles: 3
    duration_seconds: [12, 15, 18, 24]
    free_step: true
    reuse_seconds: 3
  - key: phase_veil
    name: Phase Veil
    description: "A shimmer of displaced air helps the party slip past incoming blows."
    trigger: "Engaged, and either two enemies within 2 tiles or a living ally below 35% HP."
    icon: icon_technique_phase_veil
    level: 1
    sp_cost: [8, 8, 8, 8]
    power: [10, 15, 20, 25]
    duration_seconds: [3, 6, 6, 9]
    cooldown_seconds: 0
    automatic: true
  - key: purify
    name: Purify
    description: "Remove all curable afflictions from living allies and release party root. Never rouses the unconscious, heals or revives."
    trigger: "A living ally has a removable affliction, or the party is rooted."
    icon: icon_technique_purify
    level: 2
    sp_cost: [12, 11, 10, 9]
    cooldown_seconds: 2
    reuse_seconds: 6
    automatic: true
  - key: quickening
    name: Quickening
    description: "RT: faster recovery for new actions. TB: extra actions from next round, at most one per hero able to act."
    trigger: "In combat, not already quickened, and able to benefit."
    icon: icon_technique_quickening
    level: 4
    sp_cost: [12, 12, 12, 12]
    power: [20, 25, 30, 35]
    tb_power: [1, 1, 2, 2]
    duration_seconds: [12, 15, 18, 24]
    cooldown_seconds: 0
    automatic: true
  - key: return_step
    name: Return Step
    description: "Return to the first Fold Step departure point from any distance in the same area, even across walls. The return point must still be active and clear."
    icon: icon_technique_return_step
    level: 6
    sp_cost: [6, 5, 4, 3]
    free_step: true
    reuse_seconds: 3
