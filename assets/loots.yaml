  - type: "item"
    key: "skeleton_key"
    chance: 0.05

# Crates, keyed by their npcs.yaml loot_crate NPC key. A crate either rolls
# a loot_table (authored treasure) or `rolls` slots; each slot picks ONE
# roll_sources entry by weight (percent, totals 100) and draws from it:
#   map          one entry from the drop tables of the monsters this map (or
#                open-world region) was created with, weighted by drop chance
#   catalog      a uniform pick from the whole catalog of item_type
#                (armor/accessory/consumable/trinket/weapon/any)
#   loot_table   one roll of that named pool, as authored (items + gold)
#   gold, arena_points  a fixed amount;  nothing  an empty slot
# rarity gates map and catalog: "rare" exactly, "common-uncommon" a span,
# "uncommon+" that tier and up. A map source with nothing in its span on this
# map sits the chest out and its share falls to the others. Quest items and
# arena uniques never roll from a catalog; cards are ordinary loot.
# Traps: trap_damage blasts every hero (element from trap_damage_types),
# trap_ignite burns them; Disarm Trap avoids either at 40/60/80/100%.
crates:
  forest_hollow_stump:
    rolls: 1
    roll_sources:
      - {pool: item, item: dawnleaf, weight: 40}
      - {pool: item, item: mooncap, weight: 40}
