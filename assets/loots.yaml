# Loot data, top to bottom:
#   loots:       per-monster drop tables (kills, Sleight of Hand, and the
#                "map" pool of every chest on that monster's map)
#   boss_loot:   appended to the table of every boss: true monster
#   crates:      placed chests and props (npcs.yaml loot_crate NPCs, by key)
#   loot_tables: named weighted pools (sword racks, encounter reward chests,
#                crate slots)
#   loot_groups: shared groups for monster drops: `type: table` merges one in,
#                `type: first_of` rolls it in order and keeps the first success
#
# A monster table entry is an item, weapon, harvest, `set` (one random piece of
# an items.yaml item set), table, first_of or `gold` (min..max coin, rolled at
# spawn, at most one per table) entry. An item-like entry may add min/max: how
# many units drop when it lands (one stack, or separate pieces for gear).

# The one card drop rule: a boss: true monster drops its card at `boss`, every
# other monster at `monster`, one roll each. The boot rejects any card entry
# in `loots` that disagrees, so author the same value there.
card_drop_chance: {boss: 0.03, monster: 0.01}

