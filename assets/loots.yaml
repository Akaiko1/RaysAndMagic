# Material groups keep ordinary and five-roll elite drops on the same chance.
loot_groups:
  wolf_material:
    - {type: item, key: wolf_pelt, chance: 0.17}

  spider_material:
    - {type: item, key: spider_silk, chance: 0.17}

  # The champion trophy: the sets roll in this order and the first success is
  # the one piece the champion drops.
  champion_trophies:
    - {type: set, key: padded, chance: 0.10}
    - {type: set, key: ringmail, chance: 0.05}

  # One independent 6% attempt for each herb or mushroom that grows in the world.
  gathered_reagents:
    - {type: harvest, key: dawnleaf, chance: 0.06}
    - {type: harvest, key: mooncap, chance: 0.06}
    - {type: harvest, key: bitterroot, chance: 0.06}
    - {type: harvest, key: embercap, chance: 0.06}
    - {type: harvest, key: grave_orchid, chance: 0.06}
