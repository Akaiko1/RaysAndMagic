# Brief jumps only; no fish persist or patrol underwater.
fish:
  species: {forest: common_carp, sakura_garden: koi, highlands: rainbow_salmon}
  roll_every_frames: 120
  # Independent rolls; 8.28 eligible forest bank tiles average about 0.112 jumps/s at 120 TPS.
  spawn_chance_per_tile: 0.0135
  flight_seconds: 1.8
  height_tiles: 0.7
  radius_tiles: 7
  beach_chance: 0.06
# Survivors persist; only deficits are replenished at the named phase.
turn_step_speed: 2.07
populations:
  - {map: deep_jungle, monster: ring_tailed_lemur, count: 10, phase: day}
  - {map: deep_jungle, monster: red_ruffed_lemur, count: 10, phase: day}
  - {map: desert, monster: desert_rabbit, count: 7, phase: day}
  - {map: desert, monster: fennec, count: 2, phase: night}
caravan:
  monster: desert_caravan
  unlock_quest: toll_of_blades
  merchant: nomad_city_safiya
  stop_seconds: 15
  attack_alert_cooldown_seconds: 20
  reward_units: 3
  stock_slots: 12
  # Equal route weights: three desert bypasses, two desert hostile crossings.
  # Retired Forest detours keep their indices for old saves; skip them in both directions.
  # Different-map consecutive points are paired map entrance anchors.
