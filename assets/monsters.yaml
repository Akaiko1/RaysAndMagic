  # Elemental dragon variants - wild dragons (dragon_cliffs biome + the two cliff
  # lair caves) and the desert-statue ELITES are built from these. The 4 elite
  # `elder_dragon*` entries below summon from the statues; these base entries are
  # the ordinary dragons. They differ only in element (resists/projectile/proc).
  dragon_red:
    type: "dragon"
    name: "Red Dragon"
    level: 23
    max_hit_points: 1650
    armor_class: 52
    experience: 2000
    damage_min: 42
    damage_max: 66
    true_damage: 10  # follows the attack school; resistance applies, armor/flat/dodge do not
    abilities:
      ignite:
        chance: 0.30  # 30% to set a character ablaze
        duration_seconds: 30  # burn DoT (3x poison strength), stacks with poison
      dragon_breath: {chance: 0.33, damage_type: "dark"}
    alert_radius: 5
    attack_radius: 2
    projectile_spell: "darkbolt"
    ranged_attack_range: 3
    speed: 3.75
    sprite: "dragon_red"
    flying: true
    letter: "r"
