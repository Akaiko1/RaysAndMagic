# Every recipe uses the same material categories in the workbench.
# Check individual materials to allow them; batch costs remain recipe-authored.
# Alternative order is retained for migrating legacy saved source selections.
# Ordinary recipes use mundane drops/common herbs; merchant currencies are reserved.
# Renewable fish cost 4; abundant day wildlife costs 2; sparse/finite drops cost 1.
# Specialty recipes may use rare trophies or gems, one per batch.
