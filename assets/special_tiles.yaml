special_tiles:
  # Violet Teleporter - randomly teleports to other violet teleporters across maps
  vteleporter:
    name: "Violet Teleporter"
    type: "teleporter"
    description: "A magical violet portal that randomly teleports you to another violet teleporter"
    solid: false
    transparent: true
    walkable: true
    sprite: ""
    render_type: "floor_only"
    floor_color: [138, 43, 226]  # Violet - now the teleporter-glow tint, not the floor
    inherit_floor: true          # ground takes the surrounding biome floor; colour shows as a glow
    properties:
      cooldown_seconds: 5
      teleporter_group: "violet"    # Only teleports to same group
      cross_map: true               # Can teleport between maps
      auto_activate: true           # Activates when stepped on
      random_destination: true      # Picks random teleporter from group
      exclude_self: true           # Won't teleport to same teleporter

  # Red Teleporter - different group for variety, also cross-map
  rteleporter:
    name: "Red Teleporter"
    type: "teleporter"
    description: "A fiery red portal that randomly teleports you to another red teleporter"
    solid: false
    transparent: true
    walkable: true
    sprite: ""
    render_type: "floor_only"
    floor_color: [220, 20, 60]  # Crimson - now the teleporter-glow tint, not the floor
    inherit_floor: true          # ground takes the surrounding biome floor; colour shows as a glow
    properties:
      cooldown_seconds: 5
      teleporter_group: "red"       # Only teleports to same group
      cross_map: true               # Can teleport between maps
      auto_activate: true           # Activates when stepped on
      random_destination: true      # Picks random teleporter from group
      exclude_self: true           # Won't teleport to same teleporter

  # Example of other special tile types for future expansion
  spike_trap:
    name: "Spike Trap"
    type: "trap"
    description: "Hidden spikes that damage unwary adventurers"
    solid: false
    transparent: true
    walkable: true
    sprite: ""
    render_type: "floor_only"
    floor_color: [139, 69, 19]  # Saddle brown RGB
    # NOTE: no properties yet - the engine only consumes the teleporter keys
    # above (teleporter_group/cooldown_seconds/auto_activate/random_destination/
    # exclude_self/cross_map). Placing [stile:spike_trap] on a map today renders
    # the floor tile and deals NO damage; wire a reader before authoring numbers.

  magic_circle:
    name: "Magic Circle"
    type: "trigger"
    description: "An ancient magic circle that activates when stepped upon"
    solid: false
    transparent: true
    walkable: true
    sprite: ""
    render_type: "floor_only"
    floor_color: [65, 105, 225]  # Royal blue RGB
    # NOTE: no properties yet - see the spike_trap note above. Stepping on this
    # tile triggers nothing until an event reader exists.