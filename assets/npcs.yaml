# UgaTaima NPC Configuration
#
# NPC TYPES:
# - spell_trader: Teaches spells to party members for gold
# - skill_trainer: Trains skills (already implemented in code)
# - merchant: Sells items
# - quest_giver: Gives quests
#
# PLACEMENT FORMAT:
# Use [npc:key] in map files to place NPCs
# The key corresponds to an NPC definition in this file

npcs:
  # Spell Traders - NPCs who teach spells for gold
  spell_trader_mage:
    name: "Priestess Liora"
    type: "spell_trader"
    description: "A serene priestess in white and gold, keeper of a lakeside shrine, who teaches the divine arts of body, mind and spirit"
    sprite: "priestess_spell_merchant"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Peace, traveler. Few cross the bridge to my shrine; the Light rewards those who do. I teach the arts of body, mind, and spirit - choose a soul to bless."
      insufficient_gold: "Devotion is not bought with empty hands. This teaching asks %d gold."
      already_known: "%s already carries this prayer in their heart."
      success: "The Light settles into %s. Wield it gently, and it will not fail you."

    # Self & divine magic - every Body, Mind and Spirit spell. Each entry authors
    # only its shop price; name/school/description are backfilled from spells.yaml
    # (see backfillTraderSpells), so this stays in sync automatically.
    spells:
      # Body
      heal: { cost: 150 }
      heal_other: { cost: 500 }
      harm: { cost: 300 }
      mass_heal: { cost: 800 }
      # Mind
      awaken: { cost: 300 }
      mind_blast: { cost: 350 }
      psychic_shock: { cost: 1200 }
      charm: { cost: 1200 }
      # Spirit
      bless: { cost: 700 }
      spirit_lash: { cost: 300 }
      heroism: { cost: 900 }
      raise_dead: { cost: 1500 }

  # Forest waterside service: she does not TEACH her water charms, she casts
  # them over the party for gold (cast_buff, fixed spans).
  mtrader0:
    name: "Apprentice Mira"
    type: "quest_giver"
    description: "An eager young hedge-mage camped at the forest's edge, casting her two water charms for coin while she dreams of greater teaching"
    sprite: "beginner_spell_merchant"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "A real adventuring party! I am Mira. I have two charms and I cannot teach either one yet, but I can cast them on you here and now for coin."
      quest_greeting: "I am camped here because I am trying to reach Priestess Liora's shrine across the lake. I cannot finish my bridge with wolves at my back. Will you help?"
      active_message: "The wolves are still out there. Kill every one of them in this forest and I will finish the bridge."
      completed_message: "Every wolf is dead. The bridge is laid across the water to Priestess Liora's shrine. Here is your reward. Go and meet her, and say Mira sent you."
      visited_message: "Use the bridge whenever you like. Give Priestess Liora my respects."
      choice_prompt: "Mira fidgets with a half-finished plank."
      choices:
        - text: "Walk us over the water"
          action: "cast_buff"
          buff: "walk_on_water"
          duration_seconds: 300
          cost: 2000
        - text: "Give us the deep breath"
          action: "cast_buff"
          buff: "water_breathing"
          duration_seconds: 600
          cost: 5000
        - text: "Why are you building a bridge?"
          action: "info"
          response: "Priestess Liora teaches the divine arts at a shrine across the lake - body, mind and spirit. The only crossing is this bridge, and I cannot lay a plank with wolves at my back."
          choices:
            - text: "What's the trouble with the wolves?"
              action: "info"
              response: "A whole pack, and they own this forest after dark. I have lost tools and nearly lost a hand. Kill every wolf in the Elvish Forest and the bridge will be finished in days."
              choices:
                - text: "Consider it done. We'll cull the pack."
                  action: "give_quest"
                  quest_id: "forest_wolf_cull"
                - text: "Let me think."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "We'll silence the wolves for you."
          action: "give_quest"
          quest_id: "forest_wolf_cull"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "forest_wolf_cull"
        - text: "Leave"
          action: "leave"
  # Example of other NPC types for future expansion
  merchant_general:
    name: "Trader Aelwen"
    type: "merchant"
    description: "A graceful elven trader in green robes, healing vials at her belt, dealing in the road staples a far-walking party always forgets"
    sprite: "elf"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Well met. I'm Aelwen - I don't deal in wonders, only the staples that keep a party walking. What did you forget to pack?"
    inventory:
      - type: "potion"
        name: "Health Potion"
        cost: 50
        quantity: 10
      - type: "weapon"
        name: "Iron Sword"
        cost: 200
        quantity: 3

  desert_merchant:
    name: "Esna the Wayfarer"
    type: "merchant"
    description: "A young traveling peddler - potion-tray at her hip, bedroll on her back - who walks the long desert routes and pays fair coin for cast-off gear"
    sprite: "merchant"
    render_category: npc
    size_class: person
    sell_available: true
    dialogue:
      greeting: "Esna's the name - I walk the long routes most folk won't, tray and bedroll and all. I pay fair coin for spare gear. Anything you'd rather not carry?"

  card_collector:
    name: "Cartomancer Odette"
    type: "card_collector"
    description: "A monocled scholar of monster cards, pouches of stamped parchment at every belt-loop, set up under a sun-awning in the dunes"
    sprite: "card_collector"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Monster cards! Slot one into your collection and the whole party shares its power - or pull one back out. Only I know the trick of pinning them."

  quest_elder:
    name: "Warden Sylvaine"
    type: "quest_giver"
    description: "A keen-eyed elven warden in green and leather, blade at her hip, who keeps watch over the roads out of the village"
    sprite: "elf_warrior"
    size_class: person
    render_category: npc
    dialogue:
      greeting: "Hold a moment, travelers. I ward the roads out of here, and of late they run to old and hungry places. Walk them with open eyes - the land remembers more than it forgives."

  shipwreck_bandit_camp:
    name: "Abandoned Shipwreck"
    type: "encounter"
    description: "An old shipwreck that appears abandoned, but sounds come from within"
    sprite: "shipwreck"
    size_class: medium_prop
    render_category: scenery
    transparent: true
    dialogue:
      greeting: "You approach an old shipwreck half-buried in the ground. Through gaps in the rotted hull, you hear voices and see flickering firelight. It seems bandits have made this wreck their hideout."
      visited_message: "The shipwreck appears empty now."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Leave quietly"
          action: "leave"
        - text: "Attack the bandits"
          action: "combat"
    encounter:
      type: "bandit_camp"
      start_message: "Bandits emerge from the shipwreck to attack!"
      quest_id: "shipwreck_bandits"
      quest_name: "Clear the Shipwreck"
      quest_description: "Bandits have made a hideout in an old shipwreck. Defeat them all to claim the bounty."
      monsters:
        - type: "bandit"
          count_min: 2
          count_max: 5
      rewards:
        gold: 2000
        experience: 500
        completion_message: "The shipwreck bandits have been defeated!"
      first_visit_only: true

  # Dragon statues (desert corners). Unique names so save/load tracks each
  # spent statue independently. The "summon" choice is injected at dialog-open
  # from the statuettes the party holds; only "Leave" is static here.
  dragon_statue_black:
    name: "Black Dragon Statue"
    type: "encounter"
    description: "A coiled obsidian dragon, mouth agape as if mid-roar"
    sprite: "dragon_statue"
    render_category: scenery
    transparent: true
    size_class: full_tile
    hide_when_visited: true
    dialogue:
      greeting: "The statue's hollow eyes seem to follow you. Carved runes hint that a dragon statuette could wake what sleeps in the stone."
      choice_prompt: "Place a statuette?"
      choices:
        - text: "Leave"
          action: "leave"
    summons:
      - statuette: "Black Dragon Statuette"
        monster: "elder_dragon"
        label: "Black"
        quest_id: "dragon_slayer"
        locked_response: "The inscription says this seal will answer only to someone sworn to hunt all four Elder Dragons. A pilgrim keeping watch among the dunes may know how to take that oath."

  dragon_statue_red:
    name: "Red Dragon Statue"
    type: "encounter"
    description: "A rearing crimson dragon wrought in dark stone"
    sprite: "dragon_statue"
    render_category: scenery
    transparent: true
    size_class: full_tile
    hide_when_visited: true
    dialogue:
      greeting: "The statue's hollow eyes seem to follow you. Carved runes hint that a dragon statuette could wake what sleeps in the stone."
      choice_prompt: "Place a statuette?"
      choices:
        - text: "Leave"
          action: "leave"
    summons:
      - statuette: "Red Dragon Statuette"
        monster: "elder_dragon_red"
        label: "Red"
        quest_id: "dragon_slayer"
        locked_response: "The inscription says this seal will answer only to someone sworn to hunt all four Elder Dragons. A pilgrim keeping watch among the dunes may know how to take that oath."

  dragon_statue_green:
    name: "Green Dragon Statue"
    type: "encounter"
    description: "A serpentine dragon of mossy green stone"
    sprite: "dragon_statue"
    render_category: scenery
    transparent: true
    size_class: full_tile
    hide_when_visited: true
    dialogue:
      greeting: "The statue's hollow eyes seem to follow you. Carved runes hint that a dragon statuette could wake what sleeps in the stone."
      choice_prompt: "Place a statuette?"
      choices:
        - text: "Leave"
          action: "leave"
    summons:
      - statuette: "Green Dragon Statuette"
        monster: "elder_dragon_green"
        label: "Green"
        quest_id: "dragon_slayer"
        locked_response: "The inscription says this seal will answer only to someone sworn to hunt all four Elder Dragons. A pilgrim keeping watch among the dunes may know how to take that oath."

  dragon_statue_gold:
    name: "Gold Dragon Statue"
    type: "encounter"
    description: "A gilded dragon that glints even in the shade"
    sprite: "dragon_statue"
    render_category: scenery
    transparent: true
    size_class: full_tile
    hide_when_visited: true
    dialogue:
      greeting: "The statue's hollow eyes seem to follow you. Carved runes hint that a dragon statuette could wake what sleeps in the stone."
      choice_prompt: "Place a statuette?"
      choices:
        - text: "Leave"
          action: "leave"
    summons:
      - statuette: "Gold Dragon Statuette"
        monster: "elder_dragon_gold"
        label: "Gold"
        quest_id: "dragon_slayer"
        locked_response: "The inscription says this seal will answer only to someone sworn to hunt all four Elder Dragons. A pilgrim keeping watch among the dunes may know how to take that oath."

  prison:
    name: "Mountain Prison"
    type: "encounter"
    description: "A grim stockade of black iron, two elf jailers pacing the gate"
    sprite: "prison"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: medium_prop
    dialogue:
      greeting: "Two champions languish in this mountain stockade, guarded by a pair of elf swordsmen. The jailers turn on you the moment you approach the bars."
      visited_message: "The cages hang open and empty - the freed champions have gone to await you at the tavern."
      choice_prompt: "Free the prisoners?"
      choices:
        - text: "Break them out (fight the jailers)"
          action: "combat"
        - text: "Leave"
          action: "leave"
    encounter:
      type: "prison_break"
      first_visit_only: true
      start_message: "The elf jailers draw steel!"
      monsters:
        - type: "elf_swordsman"
          count_min: 2
          count_max: 2
      rewards:
        experience: 0
        completion_message: "The cages spring open - the imprisoned champions head for the tavern to await you."
        frees_captives: true

  tavern:
    name: "The Wandering Wyvern"
    type: "encounter"
    description: "A cozy timber tavern; off-duty heroes nurse their drinks here"
    sprite: "tavern"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: medium_prop
    town_portal: true   # recall anchor: makes its map a Town Portal destination
    dialogue:
      greeting: "The keeper nods. 'Beds upstairs, stew on the fire, and your benched companions at the corner table. What'll it be?'"
      choice_prompt: "The keeper waits."
      choices:
        - text: "Manage roster"
          action: "open_roster"
        - text: "Manage your stash"
          action: "manage_stash"
        - text: "Rest the night (25 gold)"
          action: "tavern_rest"
          cost: 25
        - text: "Buy rations (+5 food, 1000 gold)"
          action: "buy_food"
          cost: 1000
          amount: 5
        - text: "Leave"
          action: "leave"

  mage_tower:
    name: "Mage Tower"
    type: "encounter"
    description: "A slender spire of pale stone, its wards flickering white"
    sprite: "mage_tower"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    rejects_lich: true
    dialogue:
      greeting: "A voice rings down from the tower's heights, neither man's nor woman's: 'You feel the wards part for you. Few do. Speak, then - there is a trial here for those bold enough to be raised.'"
      active_message: "The voice stirs again, cooler now: 'The Lich King still draws breath, and so the throne of Archmage stays empty. Return when the deed is done.'"
      completed_message: "The wards blaze white: 'You have broken the Lich King. The Light has waited long for hands worthy of it. Step forward, and be raised to Archmage.'"
      visited_message: "The tower stands quiet now - its highest seat is filled, and an Archmage walks among you."
      choice_prompt: "The Mage Tower's wards flicker white, waiting."
      choices:
        - text: "What trial does the tower offer?"
          action: "info"
          response: "'The seat of Archmage has stood empty since the Lich King rose. Kill him at his nexus, return alive, and one of you will be raised to command the Light.'"
          choices:
            - text: "What does becoming Archmage grant?"
              action: "info"
              response: "'Command of the highest Light. The pages can be bought at any shrine that keeps them; the school itself cannot, and without it the pages are ink. It is not a blessing laid on a man. They put it inside him and it stays there. It will not go into the undead, and it will not go into anyone who has not faced the Lich King.'"
              choices:
                - text: "We accept. The Lich King will fall."
                  action: "give_quest"
                  quest_id: "archmage_trial"
                - text: "Not yet."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "Accept the trial (slay the Lich King)"
          action: "give_quest"
          quest_id: "archmage_trial"
        - text: "I have slain the Lich King"
          action: "turn_in_quest"
          quest_id: "archmage_trial"
        - text: "Leave"
          action: "leave"

  dragon_cliffs_ranger:
    name: "Maera Cliffwatch"
    type: "quest_giver"
    description: "A wind-battered scout who watches the dragon cliffs for raiders and trolls"
    sprite: "dragon_cliffs_ranger"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Down - keep low when the wind shifts. Good. You've a steadier hand than the last lot who came up this trail. I'm Maera; I watch these cliffs so the bridge towns below get a warning before the trouble does. And lately there's trouble."
      active_message: "Still too many of them on the ridge. Thin the pack and the bridge approaches are ours again - I'll know the moment the mist clears."
      completed_message: "The bridge stones are quiet for the first time in weeks. I watched you work the ridge - clean, no wasted blood. You've earned your due; let me settle up."
      visited_message: "The cliffs hold, and the towns below sleep easier. Safe travels, friend - mind the wind."
      choice_prompt: "Maera studies the ridgeline."
      choices:
        - text: "What kind of trouble?"
          action: "info"
          response: "Mountain Trolls. They climb out of the gorges under the mist and hold the bridge stones, and no caravan can pass them. They have never massed like this before."
          choices:
            - text: "Why are they suddenly so bold?"
              action: "info"
              response: "I do not know. Old Varric down the trail talks about rites in the rock. What I see through the glass is more trolls every dawn, pushing for the bridges. Kill three of them and the approaches are safe again."
              choices:
                - text: "We'll thin the ridge for you."
                  action: "give_quest"
                  quest_id: "dragon_cliffs_troll_cull"
                - text: "Let me look around first."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "We'll clear the trolls."
          action: "give_quest"
          quest_id: "dragon_cliffs_troll_cull"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "dragon_cliffs_troll_cull"
        - text: "Leave"
          action: "leave"

  dragon_cliffs_bone_hermit:
    name: "Old Varric Bone-Speaker"
    type: "quest_giver"
    description: "A hermit draped in dragon teeth and old cliff charms"
    sprite: "dragon_cliffs_bone_hermit"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Put your hand on the rock under your feet. Something knocks back, slow and even, always the same count. Thirty years I have hung dragon-teeth on these cliffs and never felt that. The mountain mages are working a rite down there."
      active_message: "The knocking is still in the rock. Two Archmages are still alive up there. Kill them and it stops."
      completed_message: "The knocking has stopped. The rock is only rock again. You broke the rite, and the old dead beneath us have gone quiet. Take what the bones owe you - they pay their debts, unlike the living."
      visited_message: "The dragon-bones are quiet at last. Thirty years, and finally a still night. Go well, ash-walker."
      choice_prompt: "Varric taps his dragon-bone staff against the stone."
      choices:
        - text: "What is knocking in the rock?"
          action: "info"
          response: "Dragons died on these cliffs long before your grandmother was born, and their bones are still down there. The mountain mages have found a rite that wakes the fire in them. Twice now a light has answered them out of the rock, blinking slow, the same pattern both times."
          choices:
            - text: "What happens if the rite is finished?"
              action: "info"
              response: "Then the cliffs burn again. The trolls feel it already, which is why they climb and why Maera's bridges are under attack. Two Archmages are working the rite. Kill them and it ends."
              choices:
                - text: "We'll silence the mages and end the rite."
                  action: "give_quest"
                  quest_id: "dragon_cliffs_ember_rites"
                - text: "Let me weigh it."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "We'll end the ember rites."
          action: "give_quest"
          quest_id: "dragon_cliffs_ember_rites"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "dragon_cliffs_ember_rites"
        - text: "Leave"
          action: "leave"

  dragon_cliffs_bone_lair:
    name: "Bone-Maw Lair"
    type: "encounter"
    description: "A cliff cave framed by fossilized dragon jaws and scattered ribs"
    sprite: "dragon_cliffs_bone_lair"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "The cave exhales a cold animal breath. Deep inside, claws scrape stone."
      visited_message: "The Bone-Maw is silent now - only scorched bones and a cold draft remain."
      choice_prompt: "Enter the Bone-Maw?"
      choices:
        - text: "Enter the lair"
          action: "combat"
        - text: "Back away"
          action: "leave"
    encounter:
      type: "dragon_lair"
      first_visit_only: true
      start_message: "A green dragon coils out of the bone-strewn dark!"
      quest_id: "dragon_cliffs_bone_lair"
      quest_name: "Bone-Maw Lair"
      quest_description: "Clear the bone-framed dragon lair in the Dragon Cliffs."
      monsters:
        - type: "dragon_green"
          count_min: 1
          count_max: 1
      rewards:
        gold: 1500
        experience: 1500
        completion_message: "The Bone-Maw falls silent."

  dragon_cliffs_ember_lair:
    name: "Ember-Heart Lair"
    type: "encounter"
    description: "A basalt dragon den split by glowing ember cracks"
    sprite: "dragon_cliffs_ember_lair"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "Heat rolls from the cave mouth. Something vast shifts behind the red glow."
      visited_message: "The Ember-Heart has cooled to black stone - the cavern lies dark and still."
      choice_prompt: "Enter the Ember-Heart?"
      choices:
        - text: "Enter the lair"
          action: "combat"
        - text: "Back away"
          action: "leave"
    encounter:
      type: "dragon_lair"
      first_visit_only: true
      start_message: "A red dragon erupts from the ember-lit cavern!"
      quest_id: "dragon_cliffs_ember_lair"
      quest_name: "Ember-Heart Lair"
      quest_description: "Clear the burning dragon lair in the Dragon Cliffs."
      monsters:
        - type: "dragon_red"
          count_min: 1
          count_max: 1
      rewards:
        gold: 2000
        experience: 1500
        completion_message: "The Ember-Heart cools to black stone."

  abandoned_church:
    name: "Abandoned Church"
    type: "encounter"
    description: "A ruined stone church whose broken doorway descends into darkness"
    sprite: "abandoned_church"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "The abandoned church stands silent among the trees. Villagers say the old priest locked the doors after the crypt bells rang by themselves, and no one who entered after dusk returned unchanged."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter the church"
          action: "enter_map"
          map: "church"
        - text: "Leave it alone"
          action: "leave"

  abandoned_church_exit:
    name: "Church Entrance"
    type: "encounter"
    description: "The cold doorway back to the forest"
    sprite: "church_exit"
    size_class: full_tile
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    dialogue:
      greeting: "Cold air moves through the doorway behind you. The forest path is still visible beyond the ruined arch."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Return to the forest"
          action: "enter_map"
          map: "forest"
        - text: "Stay inside"
          action: "leave"

  pyramid_entrance:
    name: "Ancient Pyramid"
    type: "encounter"
    description: "A sun-baked pyramid with a narrow stairway descending into darkness"
    sprite: "pyramid_facade"
    render_category: wide_landmark
    size_class: structure
    grid_span_tiles: 4
    grid_span_dir: "e"
    prompt_verb: enter
    transparent: true
    dialogue:
      greeting: "The pyramid's entrance yawns open beneath worn sandstone blocks. Dry air carries the smell of dust, pitch, and something sealed too long."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter the pyramid"
          action: "enter_map"
          map: "pyramid_1"
        - text: "Leave it alone"
          action: "leave"

  pyramid_exit:
    name: "Pyramid Entrance"
    type: "encounter"
    description: "The stairway back out of the pyramid"
    sprite: "pyramid_stairs_up"
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "Warm daylight spills down the sandstone stairs behind you."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Leave the pyramid"
          action: "enter_map"
          map: "desert"
        - text: "Stay inside"
          action: "leave"

  pyramid_stairs_to_1:
    name: "Stairs to Level 1"
    type: "encounter"
    description: "Sandstone stairs leading upward"
    sprite: "pyramid_stairs_up"
    render_category: wall_mounted
    prompt_verb: climb
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "The stairs climb toward the upper chambers."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Go to level 1"
          action: "enter_map"
          map: "pyramid_1"
        - text: "Stay here"
          action: "leave"

  pyramid_stairs_to_2:
    name: "Stairs to Level 2"
    type: "encounter"
    description: "Sandstone stairs leading deeper"
    sprite: "pyramid_stairs_down"
    render_category: wall_mounted
    prompt_verb: climb
    transparent: true
    size_class: medium_prop
    dialogue:
      greeting: "The stairs descend into a colder, darker level of the pyramid."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Go to level 2"
          action: "enter_map"
          map: "pyramid_2"
        - text: "Stay here"
          action: "leave"

  pyramid_stairs_to_3:
    name: "Stairs to the Sanctum"
    type: "encounter"
    description: "A narrow stairway toward the sealed sanctum"
    sprite: "pyramid_stairs_down"
    render_category: wall_mounted
    prompt_verb: climb
    transparent: true
    size_class: medium_prop
    dialogue:
      greeting: "A painted stairway falls away into a chamber marked by four dragon seals."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Go to the sanctum"
          action: "enter_map"
          map: "pyramid_3"
        - text: "Stay here"
          action: "leave"

  lich_nexus_entrance:
    name: "Lich Nexus"
    type: "encounter"
    description: "A black stone arch crawling with trapped souls"
    sprite: "lich_nexus_entrance"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "Green-violet fire coils inside the arch. Beyond it, you hear the slow chant of dead kings."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter the nexus"
          action: "enter_map"
          map: "lich_nexus"
        - text: "Step away"
          action: "leave"

  lich_nexus_exit:
    name: "Nexus Portal"
    type: "encounter"
    description: "A portal back to the living world"
    sprite: "lich_nexus_exit"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "The portal flickers with a path away from the liches' hall."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Leave the nexus"
          action: "enter_map"
          map: "highlands"
        - text: "Stay inside"
          action: "leave"

  seabright_gate:
    name: "Seabright Gate"
    type: "encounter"
    description: "A stone road gate leading toward the sea city of Seabright"
    sprite: "city_exterior"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "Seabright's gate stands open beyond the forest road. An eastbound ship takes on water for the far isles, and a riverboat at the slip hires crew for the green river into the deep jungle."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter Seabright"
          action: "enter_map"
          map: "city"
        - text: "Sail to the eastern islands"
          action: "enter_map"
          map: "japanese_castle"
        - text: "Take the riverboat up the river into the deep jungle"
          action: "enter_map"
          map: "deep_jungle"
        - text: "Stay in the forest"
          action: "leave"

  # --- Seabright Culverts (sewer dungeon) ---
  culverts_entrance:
    name: "Culvert Outflow"
    type: "encounter"
    description: "A great barred storm-drain venting into the harbor"
    sprite: "culvert_outlet"
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "A grated outflow descends beneath Seabright into the city culverts. Far down in the dark, something gold glitters."
      choice_prompt: "Descend into the culverts?"
      choices:
        - text: "Enter the culverts"
          action: "enter_map"
          map: "culverts"
        - text: "Stay in the city"
          action: "leave"

  culverts_exit:
    name: "Outflow Grate"
    type: "encounter"
    description: "The barred outflow back up to Seabright harbor"
    sprite: "culvert_outlet"
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "Daylight filters down through the outflow grate - the way back up to Seabright."
      choice_prompt: "Leave the culverts?"
      choices:
        - text: "Climb back to Seabright"
          action: "enter_map"
          map: "city"
        - text: "Stay below"
          action: "leave"

  culverts_oldman:
    name: "Grist the Sluice-Rat"
    type: "quest_giver"
    description: "A cloaked ratfolk who keeps the Seabright culverts and their seven sluice valves, lantern always lit"
    sprite: "ratman_cloak"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Hsss - easy, top-dweller. Grist means no harm. I keep these culverts; have, since before your harbor learned to count its coin. Lower that steel and I'll tell you what glitters down here in the dark."
      active_message: "Still seven valves gushing, friend. Wheel them all shut and the bug's hall drains to mud - then it's nowhere left to skitter."
      completed_message: "I hear it now - the channels run dry, and something gold-shelled scratches at the bottom of its own hall with no water left to flee through. You did the trick. Take Grist's thanks, and the harbor's."
      visited_message: "Dry as a picked bone down there now. Mind its bite, top-dweller - gold or no, it's still got pincers."
      choice_prompt: "Grist's whiskers twitch toward the dark."
      choices:
        - text: "What glitters down here? (ask Grist)"
          action: "info"
          response: "The Golden Thief Bug. Big as a hound, and it drags every dropped ring and lost crown down into its flooded hall. Half of what it takes is not jewellery at all - little warm cases, and they spark if you pry at them. It will not stand and fight, either. Close on it and it blinks away three strides off."
          choices:
            - text: "So how do you corner a thing that vanishes?"
              action: "info"
              response: "Take its water. Seven sluice valves feed the flood in its hall. Shut all seven and the hall drains to bare stone, and then it has nowhere to swim and must fight you."
              choices:
                - text: "Then I'll shut all seven valves."
                  action: "give_quest"
                  quest_id: "culverts_valves"
                - text: "Let me think on it."
                  action: "back"
            - text: "Hm. Tell me the rest later."
              action: "back"
        - text: "Why does a rat keep the harbor's drains?"
          action: "info"
          response: "Because nobody above ground will. My kind were here when Seabright was three huts and a weir. We mind the valves and keep the floods out of your cellars. The bug has been eating our quiet and I want it gone."
          choices:
            - text: "Fair enough. Back to the bug."
              action: "back"
        - text: "I'll drain its lair for you."
          action: "give_quest"
          quest_id: "culverts_valves"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "culverts_valves"
        - text: "Leave"
          action: "leave"

  # Seven sluice valves. Distinct keys/names so each remembers being shut
  # independently (NPC Visited is save-tracked by name). Dialogue is shared via a
  # YAML anchor - it's a read-only template; only npc.Visited mutates at runtime.
  culvert_valve_1:
    name: "Sluice Valve I"
    type: "encounter"
    sprite: "culvert_valve"
    render_category: scenery
    transparent: true
    size_class: small_prop
    steam_when_visited: true
    dialogue: &valve_dialogue
      greeting: "A rust-caked sluice valve, half-open. Water roars through the channel below."
      visited_message: "The valve is wrenched shut; the channel runs dry."
      choice_prompt: "Close the valve?"
      choices:
        - text: "Heave the wheel shut"
          action: "prop"
          prop:
            tag: "valve"
            not_yet: "The valve won't budge - no reason to shut it yet."
            took: "You heave the valve shut."
            completed: "The flood drains from the lair."
          quest_id: "culverts_valves"
        - text: "Leave it"
          action: "leave"
  culvert_valve_2:
    name: "Sluice Valve II"
    type: "encounter"
    sprite: "culvert_valve"
    render_category: scenery
    transparent: true
    size_class: small_prop
    steam_when_visited: true
    dialogue: *valve_dialogue
  culvert_valve_3:
    name: "Sluice Valve III"
    type: "encounter"
    sprite: "culvert_valve"
    render_category: scenery
    transparent: true
    size_class: small_prop
    steam_when_visited: true
    dialogue: *valve_dialogue
  culvert_valve_4:
    name: "Sluice Valve IV"
    type: "encounter"
    sprite: "culvert_valve"
    render_category: scenery
    transparent: true
    size_class: small_prop
    steam_when_visited: true
    dialogue: *valve_dialogue
  culvert_valve_5:
    name: "Sluice Valve V"
    type: "encounter"
    sprite: "culvert_valve"
    render_category: scenery
    transparent: true
