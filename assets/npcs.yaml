  # ================= OPENING QUEST GIVERS (2026-07-30) =================
  # The first errands now have faces. A new party used to boot with a full
  # journal handed out by nobody; these three own those quests instead, and each
  # one is met where its trouble is.

  # Wenna keeps the herb paths by the clearing where every party wakes up. She
  # asks for the goblins first; the wolf road only comes up once that is settled
  # (requires_quest on the second offer), so the journal fills one line at a time.
  forest_peasant_wenna:
    name: "Wenna the Herb-Picker"
    type: "quest_giver"
    description: "A village woman with a flower basket and a walking staff"
    sprite: "forest_peasant"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Good day to you. I am Wenna, and I cut herbs on these paths - or I did, until the goblins nested south of the clearing."
      active_message: "Five of them, and mind the thicket south of the clearing. That is where they nest."
      completed_message: "The south path is mine again. Take this with my thanks. And I have one more trouble, if you will hear it."
      visited_message: "Both paths are safe now. Come to me if you need a bandage."
      quest_messages:
        goblin_hunt:
          offer: "Good day to you. I am Wenna, and I cut herbs on these paths - or I did, until the goblins nested south of the clearing."
          active: "Five of them, and mind the thicket south of the clearing. That is where they nest."
          completed: "The south path is mine again. Take this with my thanks. And I have one more trouble, if you will hear it."
        wolf_pack:
          offer: "The south path is mine again. But the north road is still closed to me, if you will hear why."
          active: "Three Wolves hunt the north road after dusk. I will wait here until the carters can travel it again."
          completed: "The north road is safe again. Take this with my thanks; both herb paths are open."
      choice_prompt: "Wenna shifts her basket."
      choices:
        - text: "Tell us about the goblins."
          action: "info"
          quest_step: "goblin_hunt"
          response: "Five Goblins, nesting south past the clearing. They took my second basket and near took my hand with it."
          choices:
            - text: "We will kill them."
              action: "give_quest"
              quest_id: "goblin_hunt"
            - text: "Back."
              action: "back"
        - text: "We will kill the goblins."
          action: "give_quest"
          quest_id: "goblin_hunt"
        - text: "Report the goblin nest cleared"
          action: "turn_in_quest"
          quest_id: "goblin_hunt"
        - text: "What is the other trouble?"
          action: "info"
          requires_quest: "goblin_hunt"
          quest_step: "wolf_pack"
          response: "The north road. Three Wolves work it after dusk, and the carters will not travel it. I cannot reach the good meadow while they hold that road."
          choices:
            - text: "Three Wolves. It is done."
              action: "give_quest"
              quest_id: "wolf_pack"
              requires_quest: "goblin_hunt"
            - text: "Back."
              action: "back"
        - text: "Report the wolf pack killed"
          action: "turn_in_quest"
          quest_id: "wolf_pack"
          requires_quest: "goblin_hunt"

  lake_bather_ilsa:
    name: "Ilsa"
    type: "quest_giver"
    description: "A young woman in a bathing wrap, standing in the lake shallows"
    sprite: "lake_bather"
    render_category: npc
    size_class: person
    night_only: true
    dialogue:
      greeting: "Keep your distance, if you please. I bathe here after dark, and every night the Forest Spiders come down to the reeds and watch me do it."
      active_message: "Five of them will do. I will wait in the shallows - they do not cross deep water."
      completed_message: "The shore is quiet. Take something from my bundle, you have earned it."
      visited_message: "I have an hour of dark left and I mean to spend it in this lake."
      choice_prompt: "Ilsa watches the reeds."
      choices:
        - text: "Tell us about the spiders."
          action: "info"
          response: "Pale ones, and big. They come out of the trees when the light goes. They will not cross open water, so I stand out here and wait them out."
          choices:
            - text: "We will kill five of them."
              action: "give_quest"
              quest_id: "lake_spiders"
            - text: "Back."
              action: "back"
        - text: "We will clear the shore."
          action: "give_quest"
          quest_id: "lake_spiders"
        - text: "Report the shore cleared"
          action: "turn_in_quest"
          quest_id: "lake_spiders"

  desert_pilgrim_sylwen:
    name: "Sylwen the Pilgrim"
    type: "quest_giver"
    description: "A sun-worn elf in travelling leathers, keeping watch on a dragon statue"
    sprite: "desert_pilgrim"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Do not touch the stone. I have walked these four seals for two years, and I have watched three parties press a statuette to the runes and get nothing for it."
      active_message: "Four Elder Dragons, one to each seal. They come out of the stone fighting, so keep your backs to it."
      completed_message: "All four are dead. The desert is quiet and I have nothing left to watch. Take what the pilgrimage owed you."
      visited_message: "Four seals, four empty plinths. I will walk east now."
      choice_prompt: "Sylwen keeps a hand on the warm stone."
      choices:
        - text: "Why do the runes do nothing?"
          action: "info"
          response: "The seal is an oath, not a lock. Press a statuette to it as a passing traveller and the stone stays cold. Swear to hunt all four dragons first, and the same statuette will open it."
          choices:
            - text: "What sleeps in the stone?"
              action: "info"
              response: "Elder Dragons. Four of them, and something broke in them long ago. I have put my hand on one through the seal: rivets under the scorch, and it was warm. Warm, and not alive. The desert is not walkable while they lie there."
              choices:
                - text: "We swear the hunt. All four."
                  action: "give_quest"
                  quest_id: "dragon_slayer"
                - text: "Back."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "We swear the hunt. All four."
          action: "give_quest"
          quest_id: "dragon_slayer"
        - text: "Report the fourth seal empty"
          action: "turn_in_quest"
          quest_id: "dragon_slayer"
