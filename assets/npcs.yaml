      - { type: "item", name: "Iron Helmet",     cost: 280,  quantity: 2, tab: "Plate" }
      - { type: "item", name: "Iron Greaves",    cost: 300,  quantity: 2, tab: "Plate" }
      - { type: "item", name: "Belt of Strength", cost: 900,  quantity: 1, tab: "Road" }
      - { type: "item", name: "Belt of Speed",    cost: 1900, quantity: 1, tab: "Road" }
      - { type: "item", name: "Magic Ring",       cost: 600,  quantity: 2, tab: "Road" }
      - { type: "potion", name: "Health Potion",  cost: 60,   quantity: 15, tab: "Road" }
      - { type: "potion", name: "Mana Potion",    cost: 70,   quantity: 15, tab: "Road" }
      - { type: "item", name: "Ordinary Key",     cost: 500,  quantity: -1, tab: "Road" }
      - { type: "item", name: "Inlaid Key",       cost: 2500, quantity: -1, tab: "Road" }

  nomad_city_trainer:
    name: "Blademaster Nadira"
    type: "skill_trainer"
    description: "Dunehold's drill master, who takes the caravan guards apart every morning on the sand of the gate yard"
    sprite: "nomad_combat_trainer"
    render_category: npc
    size_class: person
    # No training until the party has a record in the pit (pit_standing). The
    # trainer dialog has no quest tab, so the errand is the whole conversation
    # while the gate is shut and the mastery grid replaces it once it is paid.
    requires_quest: "pit_standing"
    dialogue:
      greeting: "Nadira. I drill the gate guard at dawn and I take paying students after. I sharpen a mastery you already hold. Name the character and the skill."
      quest_greeting: "Nadira. I sharpen nothing for a student who has not stood on the sand. The Grand Arena is out the gate and south down the sand road. Win three bouts there, at any stakes, and I will take your money."
      active_message: "Three bouts, and the duel master takes one wager per day at each stake. Come back when the pit has your name three times."
      completed_message: "Three bouts on the sand. That will do - name the character and the skill."
      choice_prompt: "Nadira rests a practice blade across her shoulder."
      choices:
        - text: "Why the arena?"
          action: "info"
          response: "Because mastery is not taught to people who have never been hit by someone better. The pit hits back and it keeps count. Three bouts."
          choices:
            - text: "We will win three bouts."
              action: "give_quest"
              quest_id: "pit_standing"
            - text: "Back."
              action: "back"
        - text: "We will win three bouts."
          action: "give_quest"
          quest_id: "pit_standing"
        - text: "Report three bouts won"
          action: "turn_in_quest"
          quest_id: "pit_standing"
        - text: "Leave"
          action: "leave"

  nomad_city_spells:
    name: "Yusra of the Oasis"
    type: "spell_trader"
    description: "The oasis lamp-keeper, who sells copied spells at the shrine steps and lights the pool at dusk"
    sprite: "nomad_oasis_spell_seller"
    render_category: npc
    size_class: person
    # Her shrine is dark until its lamps come back out of the pyramid: no spell
    # rows until shrine_lamps is turned in (service gate). The Light/Dark school
    # requirement below is a SECOND, separate gate on each purchase.
    requires_quest: "shrine_lamps"
    dialogue:
      greeting: "Yusra, of the shrine. I keep the two high schools - the Light, and the other one. No caravan can read either, and neither can you until one of you carries the school already. Look anyway. Then pick a character and pick a page."
      insufficient_gold: "That page costs %d gold. Come back with it."
      already_known: "%s carries that one already."
      success: "Written out for %s. Do not waste it on lizards."
      quest_greeting: "Yusra, of the shrine. I write nothing at a dark shrine. Three of my lamps went down into the pyramid with the last party that wanted these pages, and the party stayed down there. Bring the three lamps up to me and I will open the book."
      active_message: "Three lamps, one on each floor of the pyramid, still in their brackets. There is no oil in them and they are still warm."
      completed_message: "Three lamps back on the steps. The shrine burns again. Now pick a character and pick a page."
      visited_message: "The lamps burn on the steps. Both high schools are open to you - as far as your own souls can carry them."
      choice_prompt: "Yusra trims a wick that has nothing to burn."
      choices:
        - text: "Why is the shrine dark?"
          action: "info"
          response: "Because its lamps are in the pyramid. Pilgrims came for the Light pages, went down to prove they were worthy of them, and left my lamps in the stone. I keep no shop at a dark shrine."
          choices:
            - text: "We will bring the three lamps up."
              action: "give_quest"
              quest_id: "shrine_lamps"
            - text: "Back."
              action: "back"
        - text: "We will bring the three lamps up."
          action: "give_quest"
          quest_id: "shrine_lamps"
        - text: "Return the three shrine lamps"
          action: "turn_in_quest"
          quest_id: "shrine_lamps"
        - text: "Leave"
          action: "leave"
    # Light and Dark, priced 10000+. NOTE the hard gate: a row sells only to a
    # character who already holds ONE OF the page's schools (HasSchoolOpenFor over
    # the spell's whole school list - a dual-school page sells to a holder of
    # either), and NO starting class opens Light or Dark (config.yaml class kits)
    # - so this shop only becomes usable once a party member holds the school,
    # i.e. after the Archmage trial or a lich turn. That is deliberate: it is the
    # endgame gold sink, and her greeting says the requirement out loud instead of
    # leaving a wall of red rows.
    # alien_dark_bolt is monster_only and is excluded - it is never learnable.
    spells:
      # Light
      ray_of_light: { cost: 10000 }
      hour_of_power: { cost: 12000 }
      day_of_the_gods: { cost: 16000 }
      resurrect: { cost: 20000 }
      # Dark
      darkbolt: { cost: 10000 }
      bind_undead: { cost: 12000 }
      darkness: { cost: 16000 }
      disintegrate: { cost: 22000 }

