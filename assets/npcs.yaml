      - type: "potion"
        name: "Mana Potion"
        cost: 250
        quantity: -1
      - type: "potion"
        name: "Sake Flask"
        cost: 250
        quantity: -1
      - type: "potion"
        name: "Antivenom"
        cost: 250
        quantity: -1
      - type: "potion"
        name: "Revival Potion"
        cost: 1000
