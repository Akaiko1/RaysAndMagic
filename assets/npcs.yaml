  arena_duel_master:
    name: "Arena Duel Master"
    type: "encounter"
    description: "A scarred gladiator in gilded armour, keeper of the pit's rules"
    sprite: "gladiator_gatekeeper"
    render_category: npc
    transparent: true
    size_class: person
    currency: "arena_points"
    arena_board: true
    stock_weapons_rarity: "uncommon"
    stock_weapons_cost: 750
    inventory: *arena_shop
    dialogue:
      greeting: "The duel master raps her halberd on the flagstones. 'Name your stakes, challenger. The pit picks your opponent - and each wager stands once a day. Once you step onto the sand, the gates stay down until one of you falls.'"
      choice_prompt: "What stakes?"
      choices:
        - text: "An easy bout"
          action: "start_arena_duel"
          tier: "easy"
        - text: "A proper duel"
          action: "start_arena_duel"
          tier: "normal"
        - text: "An impossible match"
          action: "start_arena_duel"
          tier: "impossible"
        - text: "Not yet"
          action: "leave"

  # Portcullis barring a chamber doorway while a duel champion lives on the map.
