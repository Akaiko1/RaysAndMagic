      choice_prompt: "What do you do?"
      choices:
        - text: "Step back"
          action: "leave"

  # Lockable doors (2026-07-18). render_category "door" stands across the
  # opening and is solid while closed; door_behavior "locked" routes the click
  # to the unlock dialog. Once opened (Visited) the door is invisible + walkable,
  # persisted in the save. door_key_items are items.yaml keys. The Skeleton Key
  # (master_key) opens any of these without spending.
  wooden_door:
    name: "Wooden Door"
    type: "door"
    door_behavior: "locked"
    description: "A stout plank door banded with iron - a simple lock, a stubborn frame"
    sprite: "door_wood"
    render_category: door
    transparent: true
    size_class: full_tile
    lock_label: "wooden"
    door_key_items: ["ordinary_key"]
    door_stat_reqs:
      - stat: "Might"
        value: 55
    dialogue:
      greeting: "The wooden door is barred from the far side. It might yield to a strong shoulder - or the right key."
      choice_prompt: "How do you open it?"
      choices: []

  reinforced_door:
    name: "Reinforced Door"
