    dialogue:
      greeting: "Mind the wet ink. I'm Oletta of the Tideglass Scriptorium - I scribe the four elements true: fire, water, air, earth. No Light, no Dark. Choose a character."
      insufficient_gold: "A clean copy costs %d gold. Come back when the purse allows."
      already_known: "%s already carries this one - I'll not sell you the same page twice."
      success: "There - scribed clean into %s. The ink will hold."
    # The elemental catalog: every Fire, Water, Air and Earth spell (no Light or
