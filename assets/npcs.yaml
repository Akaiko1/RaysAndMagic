  # ================= OPENING QUEST GIVERS (2026-07-30) =================
  # The first errands now have faces. A new party used to boot with a full
  # journal handed out by nobody; these three own those quests instead, and each
  # one is met where its trouble is.

  # Wenna keeps the herb paths by the clearing where every party wakes up. She
  # asks for the goblins first; the wolf road only comes up once that is settled
  # (requires_quest on the second offer), so the journal fills one line at a time.
  forest_peasant_wenna:
    name: "Wenna the Herb-Picker"
    type: "quest_giver"
    description: "A village woman with a flower basket and a walking staff"
    sprite: "forest_peasant"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "You've brought swords. Good. I was about to try a broom. Goblins have taken over my herb paths south of the clearing, and I could use your help."
      active_message: "Hunt the Goblins south of the clearing, then come back for your pay. Keep an eye on the thicket."
      completed_message: "That takes care of the goblins. Here is your pay. I can gather herbs to the south again, but there is trouble on the north road too."
      visited_message: "Both herb paths open again! My thanks to you. Take care of yourselves out there."
      quest_messages:
        goblin_hunt:
          offer: "You've brought swords. Good. I was about to try a broom. Goblins have taken over my herb paths south of the clearing, and I could use your help."
          active: "Hunt the Goblins south of the clearing, then come back for your pay. Keep an eye on the thicket."
          completed: "That takes care of the goblins. Here is your pay. I can gather herbs to the south again, but there is trouble on the north road too."
        wolf_pack:
          offer: "Now for the north road. The carters have stopped using it, and I cannot reach the meadow. Have you time for another job?"
          active: "Hunt the Wolves on the north forest road, then return to me. They've frightened off every carter who uses it."
          completed: "The carters can use the north road again. Here's your pay. With both paths open, I can get back to gathering herbs."
      choice_prompt: "Wenna shifts her basket."
      choices:
        - text: "Tell us about the goblins."
          action: "info"
          quest_step: "goblin_hunt"
          response: "Goblins in the thicket south of the clearing. One stole my basket; the next tried to take the hand holding it. Hunt the Goblins and come back. I can pay for the work."
          choices:
            - text: "We will kill them."
              action: "give_quest"
              quest_id: "goblin_hunt"
            - text: "Back."
              action: "back"
        - text: "We will kill the goblins."
          action: "give_quest"
          quest_id: "goblin_hunt"
        - text: "Report the goblin nest cleared"
          action: "turn_in_quest"
          quest_id: "goblin_hunt"
        - text: "What is the other trouble?"
          action: "info"
          requires_quest: "goblin_hunt"
          quest_step: "wolf_pack"
          response: "Wolves on the north road. The carters won't go through, and the meadow I need is beyond them. Hunt the Wolves there and return to me for another payment."
          choices:
            - text: "We will hunt the Wolves."
              action: "give_quest"
              quest_id: "wolf_pack"
              requires_quest: "goblin_hunt"
            - text: "Back."
              action: "back"
        - text: "Report the wolf pack killed"
          action: "turn_in_quest"
          quest_id: "wolf_pack"
          requires_quest: "goblin_hunt"

  lake_bather_ilsa:
    name: "Ilsa"
    type: "quest_giver"
    description: "A young woman in a bathing wrap, standing in the lake shallows"
    sprite: "lake_bather"
    render_category: npc
    size_class: person
    night_only: true
    dialogue:
      greeting: "Stay there, please. The spiders have already had a good enough look. I came for a bath, and now I cannot reach my clothes. Would you clear the bank?"
      active_message: "Clear the Forest Spiders here by the lake, then come back. I can wait in the water a little longer."
      completed_message: "At last! Turn around while I get my things. There is gold and a potion in my bundle for you."
      visited_message: "Much better. I should like to finish my bath now."
      choice_prompt: "Ilsa watches the reeds."
      choices:
        - text: "Tell us about the spiders."
          action: "info"
          response: "Big pale Forest Spiders. They come down from the trees every night, and they won't cross the open water. Clear the bank and I'll pay you. If they come back another night, so will the offer."
          choices:
            - text: "We will clear the bank."
              action: "give_quest"
              quest_id: "lake_spiders"
            - text: "Back."
              action: "back"
        - text: "We will clear the shore."
          action: "give_quest"
          quest_id: "lake_spiders"
        - text: "Report the shore cleared"
          action: "turn_in_quest"
          quest_id: "lake_spiders"

  desert_pilgrim_sylwen:
    name: "Sylwen the Pilgrim"
    type: "quest_giver"
    description: "A sun-worn elf in travelling leathers, keeping watch on a dragon statue"
    sprite: "desert_pilgrim"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Trying the statue? Three parties have pressed statuettes to those runes while I watched. None knew the oath. I am Sylwen. I have kept these four seals for two years."
      active_message: "Hunt the Elder Dragons, then return to me. Each desert seal takes a statuette of its own color. The Pyramid Sanctum's reliquaries hold them. Be ready when the seal opens."
      completed_message: "The Elder Dragons are destroyed. After two years watching these stones, I had begun to think I would grow old here. You have earned the pilgrimage's reward."
      visited_message: "My watch is over. I keep looking at the road east, wondering how far I could walk before sundown."
      choice_prompt: "Sylwen keeps a hand on the warm stone."
      choices:
        - text: "Why do the runes do nothing?"
          action: "info"
          response: "First swear here to hunt the Elder Dragons. Then take the colored dragon statuettes from the Pyramid Sanctum's reliquaries to their matching desert seals. A statuette will open its seal only after you have taken the oath."
          choices:
            - text: "What sleeps in the stone?"
              action: "info"
              response: "Elder Dragons. Through a crack in one seal I touched a hide of scorched, riveted plates. It was warm. A blade struck against it threw sparks. Whatever the ancients built them for, they have become dangerous. We must destroy them."
              choices:
                - text: "We swear the hunt."
                  action: "give_quest"
                  quest_id: "dragon_slayer"
                - text: "Back."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "We swear the hunt."
          action: "give_quest"
          quest_id: "dragon_slayer"
        - text: "Report the seals empty"
          action: "turn_in_quest"
          quest_id: "dragon_slayer"
