  # --- Eastern Isle Castle (japanese_castle) ---
  japanese_castle_exit:
    name: "Moored Ship"
    type: "encounter"
    description: "The ship that bore you east, waiting at the castle dock"
    sprite: "eastern_ship"
    render_category: scenery
    prompt_verb: board
    transparent: true
    size_class: large_prop
    dialogue:
      greeting: "Your ship rocks at the dock, ready to bear you back across the eastern sea to the forest road."
      choice_prompt: "Set sail for home?"
      choices:
        - text: "Sail back to the mainland"
          action: "enter_map"
          map: "forest"
        - text: "Stay ashore"
          action: "leave"

  castle_oldman:
    name: "Shozo the Ronin"
    type: "quest_giver"
    description: "A ronin in a straw cloak who still guards his dead lord's castle"
    sprite: "ronin_outcast"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "You may enter, but hear me first. I am Shozo. I served the lord of this castle while he lived. He lies in the high keep, and I have kept watch at his gate ever since."
      active_message: "Find all 5 katana racks behind the shoji screens in the upper halls. Take the weapons and return to me. My lord will wake when his soldiers' swords are gone."
      completed_message: "The racks are empty. I heard him rise. Take this payment, then go to the high keep. Whatever wears his armor, remember that he once defended these people."
      visited_message: "I have done what I can. You know the way to the high keep."
      choice_prompt: "Shozo rests a hand on his sheathed katana."
      choices:
        - text: "Who sleeps in the keep above?"
          action: "info"
          response: "The Samurai Warlord was my lord. The eastern rot killed him defending these walls, then moved his body after death. The temple sealed him in the high keep. Through the screen I have watched his dead fingers practice their grip on a sword."
          choices:
            - text: "Then how does one wake him?"
              action: "info"
              response: "His guards hid five katana racks behind the upper halls' paper screens. Take every weapon from them. Even now, my lord will rise against a stranger who carries his soldiers' steel."
              choices:
                - text: "I will bare the five racks."
                  action: "give_quest"
                  quest_id: "castle_armory"
                - text: "A grave thing. Let me consider."
                  action: "back"
            - text: "Why not let him sleep?"
              action: "info"
              response: "People disappear on the road. The temple seal grows weaker, and I grow older. When it fails, he will leave the keep. I would have him faced here, while we can choose the ground."
              choices:
                - text: "Then back to how he wakes."
                  action: "back"
        - text: "And who are you, truly?"
          action: "info"
          response: "I was his sworn sword. When he fell, I stayed alive to keep people from following him. Some would call that cowardice. There are travelers who reached home because I kept this gate."
          choices:
            - text: "There's honor in that. Go on."
              action: "back"
        - text: "I will wake your lord and end him."
          action: "give_quest"
          quest_id: "castle_armory"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "castle_armory"
        - text: "Leave"
          action: "leave"

  # Five katana racks behind shoji screens. Distinct keys/names so each remembers
  # being looted independently (NPC Visited is save-tracked). Dialogue shared via a
  # YAML anchor - read-only template; only npc.Visited mutates at runtime. Looting
  # rolls the castle_armory loot table (zone gear, never a unique) into the party.
  sword_rack_1:
    name: "Katana Rack"
    type: "encounter"
    sprite: "sword_rack"
    render_category: scenery
    transparent: true
    size_class: tiny_prop
    dialogue: &rack_dialogue
      greeting: "A lacquered rack of katana and castle gear, half-hidden behind a paper screen."
      visited_message: "The rack stands stripped and bare."
      choice_prompt: "Take the castle's arms?"
      choices:
        - text: "Take from the rack"
          action: "prop"
          quest_id: "castle_armory"
          prop:
            tag: "sword_rack"
            not_yet: "No reason to disturb the armoury yet."
            took: "Sword rack cleared."
            completed: "A cold wind stirs the keep - the Warlord wakes."
            loot_table: "castle_armory"
            loot_line: "You take from the rack: %s."
        - text: "Leave it"
          action: "leave"
  sword_rack_2:
    name: "Katana Rack"
    type: "encounter"
    sprite: "sword_rack"
    render_category: scenery
    transparent: true
    size_class: tiny_prop
    dialogue: *rack_dialogue
  sword_rack_3:
    name: "Katana Rack"
    type: "encounter"
    sprite: "sword_rack"
    render_category: scenery
    transparent: true
    size_class: tiny_prop
    dialogue: *rack_dialogue
  sword_rack_4:
    name: "Katana Rack"
    type: "encounter"
    sprite: "sword_rack"
    render_category: scenery
    transparent: true
    size_class: tiny_prop
    dialogue: *rack_dialogue
  sword_rack_5:
    name: "Katana Rack"
    type: "encounter"
    sprite: "sword_rack"
    render_category: scenery
    transparent: true
    size_class: tiny_prop
    dialogue: *rack_dialogue

  # --- Sakura Garden (eastern island, L18-24) ---
  # Paired garden gates: the entrance stands on the castle's south wall by the
  # arrival court, the exit just inside the garden. In open-world mode both are
  # removed (open_world.yaml) - the carved passage replaces them.
  sakura_garden_entrance:
    name: "Garden Gatehouse"
    type: "encounter"
    description: "A broad gatehouse in the castle's south wall; sakura crowns show through the open doors"
    sprite: "sakura_garden_entrance"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "Through the south gatehouse, flowering cherry trees cover the temple hill. Petals have piled on the untended paths."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter Sakura Garden"
          action: "enter_map"
          map: "sakura_garden"
        - text: "Stay in the castle"
          action: "leave"

  sakura_garden_exit:
    name: "Castle Gate"
    type: "encounter"
    description: "The smaller garden gate leading back to the castle courtyard"
    sprite: "sakura_garden_exit"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "The garden's north gate opens on the castle courtyard, and the road back to the ship."
      choice_prompt: "Leave the garden?"
      choices:
        - text: "Return to Eastern Isle Castle"
          action: "enter_map"
          map: "japanese_castle"
        - text: "Stay in the garden"
          action: "leave"

  miko_shiori:
    name: "Shiori"
    type: "quest_giver"
    description: "A young shrine keeper in red and white, sweeping the entry court alone"
    sprite: "miko_shiori"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Welcome to the shrine. I am Shiori; the priests left me in charge. Please forgive the bells. I have tied up every clapper, and still they ring."
      active_message: "Hunt the Kasa Obake on the Sakura Garden's bamboo paths. The broken chime pieces are caught in their ribs. That should stop the bells."
      completed_message: "The bells have stopped! I can finally hear the broom on the steps. Thank you. Take this from the shrine."
      visited_message: "It is a pleasure to welcome guests without shouting over the bells."
      choice_prompt: "Shiori rests her broom."
      choices:
        - text: "Why do the bells ring wrong?"
          action: "info"
          response: "Our ward chimes were cast from one piece of bronze. When the castle's curse broke them, the Kasa Obake picked up the fragments. Now those umbrellas hop through the bamboo with bronze in their ribs, ringing all night. Please hunt them down."
          choices:
            - text: "We will silence those Kasa Obake."
              action: "give_quest"
              quest_id: "silent_bells"
            - text: "Back."
              action: "back"
        - text: "We will still the bells."
          action: "give_quest"
          quest_id: "silent_bells"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "silent_bells"
        - text: "Leave"
          action: "leave"

  pond_keeper_ayame:
    name: "Ayame"
    type: "quest_giver"
    description: "A sun-browned gardener with a ladle and gourd, working the pond terraces"
    sprite: "pond_keeper_ayame"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Careful of the mud. That was a flower bed yesterday. I'm Ayame, keeper of the Moon Pond. The kappa have taken an interest in my waterworks."
      active_message: "Hunt the Kappa at the Moon Pond, then come back. They took the seals that control my channels."
      completed_message: "The water is flowing where it should, and the koi have come back to the bridge. Here is your reward. I have some flowers to replant."
      visited_message: "There you are. The bridge is dry if you'd like to sit and watch the fish."
      choice_prompt: "Ayame leans on her ladle."
      choices:
        - text: "What did the kappa take?"
          action: "info"
          response: "Four stone seals, one for each channel gate. Fit a seal in its slot and the gate adjusts to the water level by itself. The kappa pulled them out when the wards failed. Now half my beds are flooded and the other half are drying out. Hunt the Kappa and come back to me."
          choices:
            - text: "We will deal with the Kappa."
              action: "give_quest"
              quest_id: "stolen_water_seal"
            - text: "Back."
              action: "back"
        - text: "We will get the seals back."
          action: "give_quest"
          quest_id: "stolen_water_seal"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "stolen_water_seal"
        - text: "Leave"
          action: "leave"

  tengu_exile_kuroha:
    name: "Kuroha"
    type: "quest_giver"
    description: "A black-winged tengu in a faded blue robe, watching the ridge from a safe overlook"
    sprite: "tengu_exile_kuroha"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Keep your sword lowered. If I meant to kill you, I would have stayed in the trees. I am Kuroha. The flock on that ridge has cast me out."
      active_message: "Hunt the Karasu Tengu on the garden ridge. They dive without calling now. Watch the maples above you."
      completed_message: "The oath-sworn have paid. I knew their voices before the oath took them. Take this feather as payment; my people will know it."
      visited_message: "I will stay here until the flock is free of that oath. I would like to fly home."
      choice_prompt: "Kuroha's wings settle."
      choices:
        - text: "What oath did you refuse?"
          action: "info"
          response: "We swore to guard the mountain. The flock has given a new oath to the power in the castle, the thing that moves the dead warlord's hands. I heard it answer them: steady knocking beneath the earth. They knelt to it. I left. Hunt its Karasu Tengu on the ridge."
          choices:
            - text: "We will break their oath."
              action: "give_quest"
              quest_id: "feathers_false_oath"
            - text: "Back."
              action: "back"
        - text: "We will thin the oath-sworn."
          action: "give_quest"
          quest_id: "feathers_false_oath"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "feathers_false_oath"
        - text: "Leave"
          action: "leave"

  # Hina's capstone: the give_quest sits at the bottom of a nested chain, one
  # requires_quest per level, so the boss hunt only opens once all three ward
  # errands (bells, seals, oath) are turned in and paid.
  onmyoji_hina:
    name: "Hina"
    type: "quest_giver"
    description: "An onmyoji apprentice in pale blue, a bell in one hand and a folded paper seal in the other"
    sprite: "onmyoji_hina"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Please don't step on the papers. I've nearly got them in order. My master went into the orchard a month ago to examine the wards. He never came back, so I have to finish this myself."
      active_message: "The Sakura Jorogumo is in the orchard, among the thick weeping trees. Kill her, then come back. Her web is still feeding on the wards."
      completed_message: "The web has broken. Every ward stopped answering it at once. I kept hoping my master would come back with you. Thank you for going in there. This is yours."
      visited_message: "I am putting my master's notes in order. Then I shall go home. I haven't told his family yet."
      choice_prompt: "Hina looks up from her papers."
      choices:
        - text: "What is wrong with the garden?"
          action: "info"
          response: "The temple had three wards: the bronze chimes, the water seals, and the tengu's oath. All three failed when the castle was cursed. Their magic still reaches the orchard. Help Shiori, Ayame, and Kuroha; I need to learn what remains after each ward is freed."
          choices:
            - text: "Back."
              action: "back"
        - text: "The bells are settled."
          action: "info"
          requires_quest: "silent_bells"
          response: "Good. That frees the chimes, but their old pattern still sounds from the orchard. Something there has caught an echo of their magic. What about Ayame's water seals?"
          choices:
            - text: "The pond seals are back as well."
              action: "info"
              requires_quest: "stolen_water_seal"
              response: "Then the pond is free as well. The orchard still repeats the water ward's pattern. The echoes must be caught together. Have you helped Kuroha with the ridge oath?"
              choices:
                - text: "The ridge oath is broken. Name the thing."
                  action: "info"
                  requires_quest: "feathers_false_oath"
                  response: "That accounts for all three. It is the Sakura Jorogumo, the spider bride. She has woven their magic into her web in the orchard. Kill her and the echoes will die with her."
                  choices:
                    - text: "We will kill the Sakura Jorogumo."
                      action: "give_quest"
                      quest_id: "fivefold_web"
                    - text: "Not yet."
                      action: "back"
                - text: "Back."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "fivefold_web"
        - text: "Leave"
          action: "leave"

  # The oasis shrine's lamps, one per pyramid floor: taking all three settles
  # Yusra's requires_quest and opens her Light/Dark shelf. Same one-shot prop
  # pattern as the valves and the katana racks (action: prop -> the prop's own
  # tag -> the quest's interact tag), so a lamp taken before the errand is
  # accepted is refused instead of being wasted.
  shrine_lamp_1:
    name: "Shrine Lamp"
    type: "encounter"
    sprite: "nomad_lantern"
    render_category: scenery
    transparent: true
    size_class: small_prop
    # A lamp the party lifted is IN THE PACK: it stops rendering and stops being
    # interactable, and the Visited flag carries that through a save.
    hide_when_visited: true
    dialogue: &shrine_lamp_dialogue
      greeting: "A brass oasis lamp stands in a wall bracket. It is dry, and warm to the hand."
      choice_prompt: "Take the lamp?"
      choices:
        - text: "Lift it out of the bracket"
          action: "prop"
          quest_id: "shrine_lamps"
          prop:
            tag: "shrine_lamp"
            not_yet: "No reason to take the lamp yet."
            took: "You lift the shrine lamp out of its bracket."
            completed: "The shrine's lamps are out of the stone."
        - text: "Leave it"
          action: "leave"
  shrine_lamp_2:
    name: "Shrine Lamp"
    type: "encounter"
    sprite: "nomad_lantern"
    render_category: scenery
    transparent: true
    size_class: small_prop
    hide_when_visited: true
    dialogue: *shrine_lamp_dialogue
  shrine_lamp_3:
    name: "Shrine Lamp"
    type: "encounter"
    sprite: "nomad_lantern"
    render_category: scenery
    transparent: true
    size_class: small_prop
    hide_when_visited: true
    dialogue: *shrine_lamp_dialogue

  # Invisible gate NPCs for the forest<->highlands portal. sprite "" renders
  # nothing at all; ground_tile paints the portal-stream tile under the gate so
  # the party steps onto shimmering water. Triggered with the interact key.
  portal_gate_highlands:
    name: "Mountain Path"
    type: "encounter"
    description: "A shimmer over the stream - a path toward the misty highlands"
    sprite: ""
    render_category: invisible
    prompt_verb: take
    ground_tile: "forest_portal_stream"
    transparent: true
    dialogue:
      greeting: "The water shimmers with a cold mountain light. A path to the misty highlands opens beyond."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Travel to the highlands"
          action: "enter_map"
          map: "highlands"
        - text: "Stay in the forest"
          action: "leave"

  portal_gate_forest:
    name: "Forest Path"
    type: "encounter"
    description: "The shimmer that leads back down to the forest"
    sprite: ""
    render_category: invisible
    prompt_verb: take
    ground_tile: "highlands_stream"
    transparent: true
    dialogue:
      greeting: "The mountain mist parts, revealing the green path back down to the forest."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Return to the forest"
          action: "enter_map"
          map: "forest"
        - text: "Stay in the highlands"
          action: "leave"

  city_exit:
    name: "City Gate"
    type: "encounter"
    description: "The main gate back to the forest road"
    sprite: "city_gate"
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "The gate opens back onto the forest path."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Return to the forest"
          action: "enter_map"
          map: "forest"
        - text: "Stay in Seabright"
          action: "leave"

  city_weapon_shop:
    name: "Bladewright Dalia"
    type: "merchant"
    description: "Seabright's blade merchant, wearing several examples of her stock"
    sprite: "city_weapon_merchant"
    render_category: npc
    size_class: person
    sell_available: true
    dialogue:
      greeting: "Let me see that edge. Hm. I'm Dalia, of Seabright Arms. Look over the rack; everything here leaves my shop sharp."
    # Stock is one class-appropriate upgrade above the starter loadout -
    # nothing here matches an item the party already carries at L1.
    inventory:
      - type: "weapon"
        name: "Silver Sword"
        cost: 800
        quantity: 2
      - type: "weapon"
        name: "Steel Mace"
        cost: 550
        quantity: 2
      - type: "weapon"
        name: "Battle Staff"
        cost: 400
        quantity: 2
      - type: "weapon"
        name: "Elven Bow"
        cost: 750
        quantity: 1
      - type: "weapon"
        name: "Throwing Knife"
        cost: 200
        quantity: 3

  city_potion_shop:
    name: "Apothecary Wrenna"
    type: "merchant"
    description: "An apothecary with carefully labeled vials at her belt"
    sprite: "city_potion_merchant"
    render_category: npc
    size_class: person
    sell_available: true
    stock_refresh_weeks: 1
    dialogue:
      greeting: "Welcome to Harbor Remedies. Wrenna, apothecary. Tell me what you need, and keep the stoppers in until you need it."
    inventory:
      - type: "potion"
        name: "Health Potion"
        cost: 50
        quantity: 20
      - type: "potion"
        name: "Mana Potion"
        cost: 60
        quantity: 20
      - type: "potion"
        name: "Revival Potion"
        cost: 500
        quantity: 10

  city_spell_shop:
    name: "Scrivener Oletta"
    type: "spell_trader"
    description: "An elemental scribe who keeps the Tideglass Scriptorium by the harbor"
    sprite: "city_spell_merchant"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Mind the ink! Oletta, Tideglass Scriptorium. Fire, Water, Air, and Earth spells, copied to order. For Light or Dark you will need another teacher. Who will be studying?"
      insufficient_gold: "A clean copy costs %d gold. Come back when the purse allows."
      already_known: "%s already carries this one - I'll not sell you the same page twice."
      success: "There - scribed clean into %s. The ink will hold."
    # The elemental catalog: every Fire, Water, Air and Earth spell (no Light or
    # Dark). Each entry authors only its shop price; name/school/description are
    # backfilled from spells.yaml (see backfillTraderSpells).
    spells:
      # Fire
      fireball: { cost: 400 }
      firebolt: { cost: 250 }
      torch_light: { cost: 150 }
      inferno: { cost: 1500 }
      # Water
      ice_bolt: { cost: 250 }
      walk_on_water: { cost: 500 }
      water_breathing: { cost: 1000 }
      hot_steam: { cost: 2000 }
      # Air
      sparks: { cost: 150 }
      lightning: { cost: 600 }
      wizard_eye: { cost: 150 }
      starburst: { cost: 2000 }
      # Earth
      rock_blast: { cost: 350 }
      deadly_swarm: { cost: 700 }
      stun: { cost: 1500 }
      stone_skin: { cost: 2000 }

  city_mastery_trainer:
    name: "Master Ilyra"
    type: "skill_trainer"
    description: "A martial instructor in worn leather, carrying a practice staff"
    sprite: "city_skill_trainer"
    render_category: npc
    size_class: person
    training: { expert: 1000, master: 4000 }
    dialogue:
      greeting: "Feet apart. Yes, even you with the spellbook. I can teach you as far as Master; beyond that, seek Nadira in Dunehold."

  # --- Silverbough (elf_city), the elven town in the Misty Highlands ---
  # The elves live in the highland pinewood - elf_archer and elf_swordsman are
  # both biomes: ["highlands"] - so their town stands there, not in the forest
  # that only carries their name. Seabright is the full-service port; these two
  # towns each carry a trade it does not. Silverbough has the bows, the potion
  # garden and the archive.
  elf_city_exit:
    name: "Silverbough Gate"
    type: "encounter"
    description: "The root-grown arch that closes Silverbough against the pinewood"
    sprite: "elf_city_gate"
    # The way OUT sits flush on the town wall, like Seabright's city_exit. The
    # cross standee is the overworld entrance; full_tile targets one visible
    # wall-tile height without a texture-specific decimal.
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "The arch opens back onto the highland track."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Return to the highlands"
          action: "enter_map"
          map: "highlands"
        - text: "Stay in Silverbough"
          action: "leave"

  elf_city_bowyer:
    name: "Captain Aewen"
    type: "merchant"
    description: "The ranger captain of Silverbough; she outfits the wood patrols and sells what is left over"
    sprite: "elf_ranger_captain"
    render_category: npc
    size_class: person
    sell_available: true
    dialogue:
      greeting: "Captain Aewen, pinewood patrol. These bows are from our stores. Check the string and take your time choosing; you'll be the one carrying it."
    inventory:
      - { type: "weapon", name: "Long Bow",       cost: 1200, quantity: 2, tab: "Bows" }
      - { type: "weapon", name: "Elven Bow",      cost: 750,  quantity: 3, tab: "Bows" }
      - { type: "weapon", name: "Hunting Bow",    cost: 400,  quantity: 3, tab: "Bows" }
      - { type: "item",   name: "Leather Armor",  cost: 90,   quantity: 4, tab: "Scout Kit" }
      - { type: "item",   name: "Leather Helmet", cost: 60,   quantity: 4, tab: "Scout Kit" }
      - { type: "item",   name: "Leather Pants",  cost: 70,   quantity: 4, tab: "Scout Kit" }
      - { type: "item",   name: "Elven Shield",   cost: 1200, quantity: 2, tab: "Scout Kit" }
      - { type: "item", name: "Accuracy Talisman", cost: 1800, quantity: 1, tab: "Scout Kit" }

  elf_city_apothecary:
    name: "Herbwright Nerith"
    type: "merchant"
    description: "Silverbough's potion-maker, who keeps the walled physic garden behind her shop"
    sprite: "elf_apothecary"
    render_category: npc
    size_class: person
    sell_available: true
    stock_refresh_weeks: 1
    dialogue:
      greeting: "Nerith. Wipe your boots; that's my physic garden behind you. Going into the glen? Take antivenom. The things in the peat have had a good breeding year."
    inventory:
      - { type: "potion", name: "Health Potion",  cost: 50,  quantity: 20 }
      - { type: "potion", name: "Mana Potion",    cost: 60,  quantity: 20 }
      - { type: "potion", name: "Antivenom",      cost: 45,  quantity: 20 }
      - { type: "potion", name: "Revival Potion", cost: 500, quantity: 10 }
      - { type: "item",   name: "Dead Branch",    cost: 240, quantity: 5 }

  elf_city_archive:
    name: "Keeper Ilthaea"
    type: "spell_trader"
    description: "The keeper of the Starlight Archive, with a book under her arm and its keys at her belt"
    sprite: "elf_starlight_librarian"
    render_category: npc
    size_class: person
    # The shelf is shut until the Archive's loan is settled: no spell rows at all
    # until archive_missing_volumes is turned in (service gate, npcServiceGateOpen).
    requires_quest: "archive_missing_volumes"
    dialogue:
      greeting: "The restricted shelves are open to you. Oletta in Seabright sells the elementary pages more cheaply; you will find the advanced work here. Choose who will study it."
      insufficient_gold: "That page costs %d gold. The Archive does not lend."
      already_known: "%s has that page already. I will not sell it twice."
      success: "Copied out for %s. Read it before you need it, not after."
      quest_greeting: "Keeper Ilthaea, Starlight Archive. I am attending to three overdue loans. Help me settle them, and you may buy from the restricted shelves."
      active_message: "Destroy the Possessed Tomes in the Clock Tower's Gearworks and return here. Take care when they open their covers."
      completed_message: "The missing volumes are accounted for. I dislike writing that in the ledger, but it closes the account. Your reward is ready, and you may now buy from the restricted shelves."
      visited_message: "Your assistance is recorded in the ledger. The restricted shelves remain open to you."
      choice_prompt: "Ilthaea keeps one hand flat on the shelf."
      choices:
        - text: "Why will you not sell to us?"
          action: "info"
          response: "A clockmaker's apprentice borrowed three volumes. They are still in the Gearworks, walking about and attacking people. Destroy those Possessed Tomes, then report to me. The Archive will pay, and you may buy our advanced spells."
          choices:
            - text: "We will put those books down."
              action: "give_quest"
              quest_id: "archive_missing_volumes"
            - text: "Back."
              action: "back"
        - text: "We will put those books down."
          action: "give_quest"
          quest_id: "archive_missing_volumes"
        - text: "Report the three books destroyed"
          action: "turn_in_quest"
          quest_id: "archive_missing_volumes"
        - text: "Leave"
          action: "leave"
    # The mage schools' deep pages: every Fire/Water/Air/Earth spell that
    # Seabright does NOT stock - Fly excluded on purpose, so the wandering
    # spell_lectern keeps one spell nobody can buy. Priced 10000+ because these
    # were exploration-only until now; the Archive is a gold sink, not a
    # shortcut. (The lectern degrades gracefully: with its pool known it says so
    # and is not consumed - useSpellLectern.)
    spells:
      # Air
      jump: { cost: 10000 }
      # Earth
      town_portal: { cost: 12000 }
      stone_blossom: { cost: 16000 }
      earthquake: { cost: 20000 }
      # Fire
      fire_shield: { cost: 14000 }
      firewall: { cost: 14000 }
      # Water
      summon_ice_elemental: { cost: 18000 }

  # --- Dunehold (nomad_city), the caravan town in the deep desert ---
  # The armour town. Seabright sells arms and Silverbough sells bows; nobody
  # sold a mail shirt anywhere in the world before this gate opened.
  nomad_city_exit:
    name: "Dunehold Gate"
    type: "encounter"
    description: "The twin-tower gate of Dunehold, banners hanging dead in the heat"
    sprite: "nomad_city_gate"
    # Flush on the town wall (content_h 0.80), same as Silverbough's exit.
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "The gate stands open on the sand road."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Return to the desert"
          action: "enter_map"
          map: "desert"
        - text: "Stay in Dunehold"
          action: "leave"

  nomad_city_safiya:
    name: "Safiya, Keeper of the Caravan Ledger"
    type: "quest_giver"
    description: "A caravan clerk with an ink-stained ledger and a sharp eye for missing cargo"
    sprite: "nomad_city_safiya"
    render_category: npc
    size_class: person
    biomes: ["nomad_city"]
    min_party_level: 20
    dialogue:
      greeting: "Another wagon late. Another driver with a knife cut and no purse. I keep the caravan accounts; lately I spend more ink on losses than on trade."
      active_message: "The dervishes travel in daylight. If one band escapes you, keep your count for the next. My ledger can wait longer than their luck."
      completed_message: "Five crossed out. Here is your pay, and some mirage salt from the oasis caravans. May their next knife find only hot air."
      visited_message: "The wagons are moving again. Give me time to balance the books before you offer to unbalance anyone else."
      choice_prompt: "Safiya holds her place with one ink-stained finger."
      choices:
        - text: "Who is robbing the caravans?"
          action: "info"
          response: "Desert dervishes. They collect tolls where there is no road, and offer receipts with the point of a knife. Five fewer collectors should improve trade. I can pay for another hunt three full days after you collect this one's reward."
          choices:
            - text: "We will deal with the dervishes."
              action: "give_quest"
              quest_id: "toll_of_blades"
            - text: "Back."
              action: "back"
        - text: "We will hunt the dervishes."
          action: "give_quest"
          quest_id: "toll_of_blades"
        - text: "Report the dervishes slain."
          action: "turn_in_quest"
          quest_id: "toll_of_blades"

  nomad_city_caravan:
    name: "Zaira of the Long Road"
    type: "merchant"
    description: "A caravan mistress selling armor and travel supplies from her desert stall"
    sprite: "nomad_caravan_merchant"
    render_category: npc
    size_class: person
    sell_available: true
    dialogue:
      greeting: "Come under the awning. Zaira of the Long Road. Mail, plate, potions, road gear. Everything survived the journey here; now let's see what will get you through yours."
    inventory:
      - { type: "item", name: "Chain Armor",     cost: 260,  quantity: 3, tab: "Chain" }
      - { type: "item", name: "Chain Coif",      cost: 170,  quantity: 3, tab: "Chain" }
      - { type: "item", name: "Chain Leggings",  cost: 180,  quantity: 3, tab: "Chain" }
      - { type: "item", name: "Iron Armor",      cost: 380,  quantity: 2, tab: "Plate" }
      - { type: "item", name: "Iron Helmet",     cost: 280,  quantity: 2, tab: "Plate" }
      - { type: "item", name: "Iron Greaves",    cost: 300,  quantity: 2, tab: "Plate" }
      - { type: "item", name: "Belt of Strength", cost: 900,  quantity: 1, tab: "Road" }
      - { type: "item", name: "Belt of Speed",    cost: 1900, quantity: 1, tab: "Road" }
      - { type: "item", name: "Magic Ring",       cost: 600,  quantity: 2, tab: "Road" }
      - { type: "potion", name: "Health Potion",  cost: 60,   quantity: 15, tab: "Road" }
      - { type: "potion", name: "Mana Potion",    cost: 70,   quantity: 15, tab: "Road" }
      - { type: "item", name: "Ordinary Key",     cost: 500,  quantity: -1, tab: "Road" }
      - { type: "item", name: "Inlaid Key",       cost: 2500, quantity: -1, tab: "Road" }

  nomad_city_trainer:
    name: "Blademaster Nadira"
    type: "skill_trainer"
    description: "Dunehold's drill master, who trains caravan guards and proven arena fighters"
    sprite: "nomad_combat_trainer"
    render_category: npc
    size_class: person
    # No training until the party has a record in the pit (pit_standing). The
    # trainer dialog has no quest tab, so the errand is the whole conversation
    # while the gate is shut and the mastery grid replaces it once it is paid.
    requires_quest: "pit_standing"
    training: { grandmaster: 10000 }
    dialogue:
      greeting: "Back again? Good. Leave your pack by the wall. You will want both hands free."
      quest_greeting: "Half the caravans bring me a champion. Most have never had sand kicked in their teeth. Win three arena bouts, then we will talk."
      active_message: "Still a few bruises short? The arena takes fresh wagers at dawn and dusk. I will be here."
      completed_message: "Three victories! The bookkeeper looked quite sour when I asked. Here, take your purse. We can begin whenever you are ready."
      choice_prompt: "Nadira rests a practice blade across her shoulder."
      choices:
        - text: "Why the arena?"
          action: "info"
          response: "Anyone can swing at a post. A living opponent has objections. Three wins, at any stakes, will do. After that, bring me a Master of a skill or school of magic, and I can teach Grandmaster. For earlier lessons, try Ilyra in Seabright."
          choices:
            - text: "We will win three bouts."
              action: "give_quest"
              quest_id: "pit_standing"
            - text: "Back."
              action: "back"
        - text: "We will win three bouts."
          action: "give_quest"
          quest_id: "pit_standing"
        - text: "Report three bouts won"
          action: "turn_in_quest"
          quest_id: "pit_standing"
        - text: "Leave"
          action: "leave"

  nomad_city_spells:
    name: "Yusra of the Oasis"
    type: "spell_trader"
    description: "The oasis lamp-keeper, who sells copied spells at the shrine steps and lights the pool at dusk"
    sprite: "nomad_oasis_spell_seller"
    render_category: npc
    size_class: person
    # Her shrine is dark until its lamps come back out of the pyramid: no spell
    # rows until shrine_lamps is turned in (service gate). The Light/Dark school
    # requirement below is a SECOND, separate gate on each purchase.
    requires_quest: "shrine_lamps"
    dialogue:
      greeting: "Light spells on this side, Dark on that. Choose who will study them. They must already know the spell's school; bringing my lamps back does not grant that knowledge."
      insufficient_gold: "That page costs %d gold. Come back with it."
      already_known: "%s carries that one already."
      success: "Written out for %s. Do not waste it on lizards."
      quest_greeting: "Welcome. I am Yusra, keeper of the oasis shrine. Three pilgrims borrowed my lamps to explore the Pyramid. I am still waiting for them. Bring back the lamps and I will reopen the spell book."
      active_message: "One shrine lamp on each of the Pyramid's three floors. Look in the wall brackets. They will be warm, though you won't find a drop of oil in them."
      completed_message: "All three! Help me set them on the steps. There, I can see the writing again. Here is your reward; the Light and Dark pages are available to you now."
      visited_message: "The lamps are burning well. I can copy a Light or Dark spell for anyone who already knows its school."
      choice_prompt: "Yusra rests her hands on the spell book."
      choices:
        - text: "Why is the shrine dark?"
          action: "info"
          response: "Those pilgrims wanted Light spells and thought a descent into the Pyramid would prove them worthy. They borrowed three lamps and never returned. Bring the lamps back from their wall brackets, one on each floor. I need them to work here."
          choices:
            - text: "We will bring the three lamps up."
              action: "give_quest"
              quest_id: "shrine_lamps"
            - text: "Back."
              action: "back"
        - text: "We will bring the three lamps up."
          action: "give_quest"
          quest_id: "shrine_lamps"
        - text: "Return the three shrine lamps"
          action: "turn_in_quest"
          quest_id: "shrine_lamps"
        - text: "Leave"
          action: "leave"
    # Light and Dark, priced 10000+. NOTE the hard gate: a row sells only to a
    # character who already holds ONE OF the page's schools (HasSchoolOpenFor over
    # the spell's whole school list - a dual-school page sells to a holder of
    # either), and NO starting class opens Light or Dark (config.yaml class kits)
    # - so this shop only becomes usable once a party member holds the school,
    # i.e. after the Archmage trial or a lich turn. That is deliberate: it is the
    # endgame gold sink, and her greeting says the requirement out loud instead of
    # leaving a wall of red rows.
    # alien_dark_bolt is monster_only and is excluded - it is never learnable.
    spells:
      # Light
      ray_of_light: { cost: 10000 }
      hour_of_power: { cost: 12000 }
      day_of_the_gods: { cost: 16000 }
      resurrect: { cost: 20000 }
      # Dark
      darkbolt: { cost: 10000 }
      bind_undead: { cost: 12000 }
      darkness: { cost: 16000 }
      disintegrate: { cost: 22000 }

  # Overworld entrances show each complete town, matching Seabright's
  # city_exterior landmark. The gate-only art remains inside each town.
  silverbough_gate:
    name: "Silverbough Gate"
    type: "encounter"
    description: "A white arch grown through with roots, standing in the highland pinewood"
    sprite: "elf_city_exterior"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "The elven town of Silverbough stands behind the arch, up in the pinewood. A ranger on the step waves you through: bows and potions inside, and an archive that copies spells."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter Silverbough"
          action: "enter_map"
          map: "elf_city"
        - text: "Stay in the highlands"
          action: "leave"

  dunehold_gate:
    name: "Dunehold Gate"
    type: "encounter"
    description: "A twin-tower gate of pale brick where the caravan road leaves the dunes"
    sprite: "nomad_city_exterior"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "The caravan town of Dunehold sits inside the wall, around its oasis. The guard leans on the gatepost: armour for sale, a drill master, and spells at the shrine."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter Dunehold"
          action: "enter_map"
          map: "nomad_city"
        - text: "Stay in the desert"
          action: "leave"

  # --- Deep Jungle (deep_jungle) ---
  # Pure-wilderness zone: the only NPC is the canoe back to Seabright at the
  # landing. Reuses the vine-arch object sprite as the riverside gateway.
  deep_jungle_exit:
    name: "Moored Riverboat"
    type: "encounter"
    description: "The shallow-draught riverboat that bore you upriver, tied at the landing"
    sprite: "deep_jungle_arch"
    render_category: scenery
    prompt_verb: board
    transparent: true
    size_class: medium_prop
    dialogue:
      greeting: "The riverboat rocks against the muddy landing, ready to carry you back down the green river to Seabright."
      choice_prompt: "Cast off downriver?"
      choices:
        - text: "Ride the river back to Seabright"
          action: "enter_map"
          map: "city"
        - text: "Stay in the jungle"
          action: "leave"

  # Arena entrance (landmark, like the church) - the actual arena map + fights
  # arrive in a later phase; for now the gate is barred (info-only).
  arena:
    name: "The Grand Arena"
    type: "encounter"
    description: "A towering stone colosseum; the roar of unseen crowds drifts over its walls"
    sprite: "arena_building"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "The arena's iron gates tower above you, banners snapping in the wind. From within comes the clash of steel and the roar of a crowd."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter the arena"
          action: "enter_map"
          map: "arena"
        - text: "Leave"
          action: "leave"

  # Gladiator gatekeeper - ushers challengers into the arena interior. Carries
  # the arena points shop + champions' board as dialog tabs (shared &arena_shop
  # block with the duel master inside).
  gladiator_gatekeeper:
    name: "Arena Gatekeeper"
    type: "encounter"
    description: "A scarred gladiator in gilded armour, halberd planted, sizing up every passerby"
    sprite: "gladiator_gatekeeper"
    render_category: npc
    transparent: true
    size_class: person
    currency: "arena_points"
    arena_board: true
    stock_weapons_rarity: "uncommon"
    stock_weapons_cost: 750
    inventory: &arena_shop # quantity -1 = unlimited stock (never sells out)
      - type: "potion"
        name: "Health Potion"
        cost: 250
        quantity: -1
      - type: "potion"
        name: "Mana Potion"
