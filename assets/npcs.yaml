    sprite: "storage_clerk"
    render_category: npc
    transparent: true
    size_class: person
    dialogue:
      greeting: "The clerk looks up from her ledger. 'Here to store your things? Your stash travels with you across all your journeys.'"
      choice_prompt: "What would you like to do?"
      choices:
        - text: "Manage your stash"
          action: "manage_stash"
        - text: "Leave"
          action: "leave"

  # Arena interior: the duel master (the gatekeeper's twin inside the pit).
