    size_class: full_tile
    lock_label: "wooden"
    door_key_items: ["ordinary_key"]
    door_stat_reqs:
      - stat: "Might"
        value: 55
    dialogue:
      greeting: "The wooden door is barred from the far side. It might yield to a strong shoulder - or the right key."
      choice_prompt: "How do you open it?"
      choices: []

