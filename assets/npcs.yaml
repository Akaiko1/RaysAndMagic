      - { type: "potion", name: "Revival Potion", cost: 500, quantity: 10 }
      - { type: "item",   name: "Dead Branch",    cost: 240, quantity: 5 }

  elf_city_archive:
    name: "Keeper Ilthaea"
    type: "spell_trader"
    description: "Keeper of the Starlight Archive; she carries its keys on her belt and its oldest book under her arm"
    sprite: "elf_starlight_librarian"
    render_category: npc
    size_class: person
    # The shelf is shut until the Archive's loan is settled: no spell rows at all
    # until archive_missing_volumes is turned in (service gate, npcServiceGateOpen).
    requires_quest: "archive_missing_volumes"
    dialogue:
      greeting: "Keeper Ilthaea. Every page Seabright's scriptorium can copy, it copies cheaper. What is on this shelf is what Oletta cannot write at all, and the Archive prices it accordingly. Choose a character and a page."
      insufficient_gold: "That page costs %d gold. The Archive does not lend."
      already_known: "%s has that page already. I will not sell it twice."
      success: "Copied out for %s. Read it before you need it, not after."
      quest_greeting: "Keeper Ilthaea. Nothing on this shelf is for sale to you yet. The Archive lent three books to the clockmaker's tower and got none of them back, and I will not copy a fourth until the loan is settled."
      active_message: "Three books, in the Gearworks of the Clock Tower. They walk on their own legs and they will come at you. Put them down and come back."
      completed_message: "Three books down. The Archive is square with the tower, and the shelf is yours to buy from."
      visited_message: "The tower keeps no books of mine now. Ask for any page on the shelf."
      choice_prompt: "Ilthaea keeps one hand flat on the shelf."
      choices:
        - text: "Why will you not sell to us?"
          action: "info"
          response: "Three volumes went up to the Gearworks with a clockmaker's apprentice and none came down. They are still there, and they move. I copy nothing while the Archive is short three books."
          choices:
            - text: "We will put the three books down."
              action: "give_quest"
              quest_id: "archive_missing_volumes"
            - text: "Back."
              action: "back"
        - text: "We will put the three books down."
          action: "give_quest"
          quest_id: "archive_missing_volumes"
        - text: "Report the three books destroyed"
          action: "turn_in_quest"
          quest_id: "archive_missing_volumes"
        - text: "Leave"
          action: "leave"
    # The mage schools' deep pages: every Fire/Water/Air/Earth spell that
    # Seabright does NOT stock - Fly excluded on purpose, so the wandering
    # spell_lectern keeps one spell nobody can buy. Priced 10000+ because these
    # were exploration-only until now; the Archive is a gold sink, not a
    # shortcut. (The lectern degrades gracefully: with its pool known it says so
    # and is not consumed - useSpellLectern.)
    spells:
      # Air
      jump: { cost: 10000 }
      # Earth
      town_portal: { cost: 12000 }
      stone_blossom: { cost: 16000 }
      earthquake: { cost: 20000 }
      # Fire
      fire_shield: { cost: 14000 }
      firewall: { cost: 14000 }
      # Water
      summon_ice_elemental: { cost: 18000 }

  # --- Dunehold (nomad_city), the caravan town in the deep desert ---
