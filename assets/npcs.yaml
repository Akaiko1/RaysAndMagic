# UgaTaima NPC Configuration
#
# NPC TYPES:
# - spell_trader: Teaches spells to party members for gold
# - skill_trainer: Trains skills (already implemented in code)
# - merchant: Sells items
# - quest_giver: Gives quests
#
# PLACEMENT FORMAT:
# Use [npc:key] in map files to place NPCs
# The key corresponds to an NPC definition in this file

npcs:
  # Spell Traders - NPCs who teach spells for gold
  spell_trader_mage:
    name: "Priestess Liora"
    type: "spell_trader"
    description: "A priestess in white and gold who teaches Body, Mind, and Spirit at the lakeside shrine"
    sprite: "priestess_spell_merchant"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Welcome to the shrine. Rest a moment; the lesson can wait until you have caught your breath. I am Liora, and I teach Body, Mind, and Spirit magic. Who wishes to learn?"
      insufficient_gold: "The lesson costs %d gold. I must keep the shrine supplied."
      already_known: "%s already knows this spell. Shall we choose another?"
      success: "%s has learned the spell. Take time to practice it."

    # Self & divine magic - every Body, Mind and Spirit spell. Each entry authors
    # only its shop price; name/school/description are backfilled from spells.yaml
    # (see backfillTraderSpells), so this stays in sync automatically.
    spells:
      # Body
      heal: { cost: 150 }
      heal_other: { cost: 500 }
      harm: { cost: 300 }
      mass_heal: { cost: 800 }
      # Mind
      awaken: { cost: 300 }
      mind_blast: { cost: 350 }
      psychic_shock: { cost: 1200 }
      charm: { cost: 1200 }
      # Spirit
      bless: { cost: 700 }
      spirit_lash: { cost: 300 }
      heroism: { cost: 900 }
      raise_dead: { cost: 1500 }

  # Forest waterside service: she does not TEACH her water charms, she casts
  # them over the party for gold (cast_buff, fixed spans).
  mtrader0:
    name: "Apprentice Mira"
    type: "quest_giver"
    description: "An apprentice with two water charms, a stack of bridge planks, and plans to study at the shrine"
    sprite: "beginner_spell_merchant"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Oh! Customers. I know two water charms, and both work. I cannot teach them yet, but I can cast them for you. Which do you need?"
      quest_greeting: "Liora's shrine is just across the lake. I have the timber, the nails, even a plan. What I haven't got is someone to keep the wolves off me while I build. Will you help?"
      active_message: "There are still wolves in the Elvish Forest. I need every last one gone before I can finish the bridge."
      completed_message: "There! A bridge all the way to Liora's shrine. Mind the new boards. Here is your pay, and do tell her Mira built it."
      visited_message: "Have you crossed my bridge yet? I keep finding excuses to walk over it."
      choice_prompt: "Mira brushes sawdust from her sleeves."
      choices:
        - text: "Walk us over the water"
          action: "cast_buff"
          buff: "walk_on_water"
          duration_seconds: 300
          cost: 2000
        - text: "Give us the deep breath"
          action: "cast_buff"
          buff: "water_breathing"
          duration_seconds: 600
          cost: 5000
        - text: "Why are you building a bridge?"
          action: "info"
          response: "Priestess Liora teaches Body, Mind, and Spirit at the shrine across the lake. I want to learn from her. First I have to finish this bridge, but whenever the wolves come near I have to drop my tools and run."
          choices:
            - text: "What's the trouble with the wolves?"
              action: "info"
              response: "They come out of the trees just as I settle down to work. I've dropped enough nails to build another bridge. Kill every Wolf in the Elvish Forest and come back; I will finish the crossing."
              choices:
                - text: "Consider it done. We'll cull the pack."
                  action: "give_quest"
                  quest_id: "forest_wolf_cull"
                - text: "Let me think."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "We'll silence the wolves for you."
          action: "give_quest"
          quest_id: "forest_wolf_cull"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "forest_wolf_cull"
        - text: "Leave"
          action: "leave"
  # Example of other NPC types for future expansion
  merchant_general:
    name: "Trader Aelwen"
    type: "merchant"
    description: "An elven trader in green robes, with healing vials hanging from her belt"
    sprite: "elf"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Aelwen's supplies. Potions, provisions, the things you remember halfway into a dungeon. Have a look before you set off."
    inventory:
      - type: "potion"
        name: "Health Potion"
        cost: 50
        quantity: 10
      - type: "weapon"
        name: "Iron Sword"
        cost: 200
        quantity: 3

  desert_merchant:
    name: "Esna the Wayfarer"
    type: "merchant"
    description: "A traveling peddler carrying a tray of potions and a well-used bedroll"
    sprite: "merchant"
    render_category: npc
    size_class: person
    sell_available: true
    dialogue:
      greeting: "Esna, at your service. I've carried these goods a long way, so I'd be pleased to sell you some. I buy spare equipment too. Let's see what you've got."

  card_collector:
    name: "Cartomancer Odette"
    type: "card_collector"
    description: "A scholar with a monocle and belt pouches full of monster cards"
    sprite: "card_collector"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Collecting monster cards? Let me examine them. I can pin a card into your collection so the whole party shares its power. I can remove cards too, if you wish to change the arrangement."

  quest_elder:
    name: "Warden Sylvaine"
    type: "quest_giver"
    description: "An elven road warden in green and leather, with a blade at her hip"
    sprite: "elf_warrior"
    size_class: person
    render_category: npc
    dialogue:
      greeting: "Before you take the road: keep your party together and watch the bends. I am Sylvaine, warden here. We've had too many travelers go missing beyond the village."

  shipwreck_bandit_camp:
    name: "Abandoned Shipwreck"
    type: "encounter"
    description: "An old shipwreck that appears abandoned, but sounds come from within"
    sprite: "shipwreck"
    size_class: medium_prop
    render_category: scenery
    transparent: true
    dialogue:
      greeting: "Firelight shows through the wreck's split planking. Inside, men argue over a purse. One calls for silence; another reaches for his sword."
      visited_message: "The bandits are gone. The wreck smells of wet timber and old smoke."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Leave quietly"
          action: "leave"
        - text: "Attack the bandits"
          action: "combat"
    encounter:
      type: "bandit_camp"
      start_message: "Bandits emerge from the shipwreck to attack!"
      quest_id: "shipwreck_bandits"
      quest_name: "Clear the Shipwreck"
      quest_description: "Bandits have occupied the old shipwreck. Defeat every bandit in the encounter to claim the bounty."
      monsters:
        - type: "bandit"
          count_min: 2
          count_max: 5
      rewards:
        gold: 2000
        experience: 250
        completion_message: "The bandits are defeated. You collect the bounty."
      first_visit_only: true

  # Dragon statues (desert corners). Unique names so save/load tracks each
  # spent statue independently. The "summon" choice is injected at dialog-open
  # from the statuettes the party holds; only "Leave" is static here.
  dragon_statue_black:
    name: "Black Dragon Statue"
    type: "encounter"
    description: "A coiled obsidian dragon, mouth agape as if mid-roar"
    sprite: "dragon_statue"
    render_category: scenery
    transparent: true
    size_class: full_tile
    hide_when_visited: true
    dialogue:
      greeting: "A hollow is cut into the base of the black dragon statue. The runes call for a matching black dragon statuette and an oath to hunt the four Elder Dragons."
      choice_prompt: "Place a statuette?"
      choices:
        - text: "Leave"
          action: "leave"
    summons:
      - statuette: "Black Dragon Statuette"
        monster: "elder_dragon"
        label: "Black"
        quest_id: "dragon_slayer"
        locked_response: "The inscription says this seal will answer only to someone sworn to hunt all four Elder Dragons. A pilgrim keeping watch among the dunes may know how to take that oath."

  dragon_statue_red:
    name: "Red Dragon Statue"
    type: "encounter"
    description: "A rearing crimson dragon wrought in dark stone"
    sprite: "dragon_statue"
    render_category: scenery
    transparent: true
    size_class: full_tile
    hide_when_visited: true
    dialogue:
      greeting: "A hollow is cut into the base of the red dragon statue. The runes call for a matching red dragon statuette and an oath to hunt the four Elder Dragons."
      choice_prompt: "Place a statuette?"
      choices:
        - text: "Leave"
          action: "leave"
    summons:
      - statuette: "Red Dragon Statuette"
        monster: "elder_dragon_red"
        label: "Red"
        quest_id: "dragon_slayer"
        locked_response: "The inscription says this seal will answer only to someone sworn to hunt all four Elder Dragons. A pilgrim keeping watch among the dunes may know how to take that oath."

  dragon_statue_green:
    name: "Green Dragon Statue"
    type: "encounter"
    description: "A serpentine dragon of mossy green stone"
    sprite: "dragon_statue"
    render_category: scenery
    transparent: true
    size_class: full_tile
    hide_when_visited: true
    dialogue:
      greeting: "A hollow is cut into the base of the green dragon statue. The runes call for a matching green dragon statuette and an oath to hunt the four Elder Dragons."
      choice_prompt: "Place a statuette?"
      choices:
        - text: "Leave"
          action: "leave"
    summons:
      - statuette: "Green Dragon Statuette"
        monster: "elder_dragon_green"
        label: "Green"
        quest_id: "dragon_slayer"
        locked_response: "The inscription says this seal will answer only to someone sworn to hunt all four Elder Dragons. A pilgrim keeping watch among the dunes may know how to take that oath."

  dragon_statue_gold:
    name: "Gold Dragon Statue"
    type: "encounter"
    description: "A gilded dragon that glints even in the shade"
    sprite: "dragon_statue"
    render_category: scenery
    transparent: true
    size_class: full_tile
    hide_when_visited: true
    dialogue:
      greeting: "A hollow is cut into the base of the gold dragon statue. The runes call for a matching gold dragon statuette and an oath to hunt the four Elder Dragons."
      choice_prompt: "Place a statuette?"
      choices:
        - text: "Leave"
          action: "leave"
    summons:
      - statuette: "Gold Dragon Statuette"
        monster: "elder_dragon_gold"
        label: "Gold"
        quest_id: "dragon_slayer"
        locked_response: "The inscription says this seal will answer only to someone sworn to hunt all four Elder Dragons. A pilgrim keeping watch among the dunes may know how to take that oath."

  prison:
    name: "Mountain Prison"
    type: "encounter"
    description: "A grim stockade of black iron, two elf jailers pacing the gate"
    sprite: "prison"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: medium_prop
    dialogue:
      greeting: "Two champions are locked in the stockade. At the bars stand two elf swordsmen. One spots you looking at the prisoners and reaches for his blade."
      visited_message: "Both cages are empty. The freed champions have gone to the tavern, where you can recruit them."
      choice_prompt: "Free the prisoners?"
      choices:
        - text: "Break them out (fight the jailers)"
          action: "combat"
        - text: "Leave"
          action: "leave"
    encounter:
      type: "prison_break"
      first_visit_only: true
      start_message: "The elf jailers draw steel!"
      monsters:
        - type: "elf_swordsman"
          count_min: 2
          count_max: 2
      rewards:
        experience: 0
        completion_message: "The cages open. Both champions head for the tavern, ready to join your company."
        frees_captives: true

  tavern:
    name: "The Wandering Wyvern"
    type: "encounter"
    description: "A cozy timber tavern; off-duty heroes nurse their drinks here"
    sprite: "tavern"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: medium_prop
    town_portal: true   # recall anchor: makes its map a Town Portal destination
    dialogue:
      greeting: "The keeper sets down a bowl. 'Stew is hot, beds are upstairs. Your companions have claimed the corner table. Staying the night?'"
      choice_prompt: "The keeper wipes her hands on an apron."
      choices:
        - text: "Manage roster"
          action: "open_roster"
        - text: "Manage your stash"
          action: "manage_stash"
        - text: "Rest the night (25 gold)"
          action: "tavern_rest"
          cost: 25
        - text: "Buy rations"
          action: "buy_food"
          cost: 250
          amount: 5
        - text: "Leave"
          action: "leave"

  mage_tower:
    name: "Mage Tower"
    type: "encounter"
    description: "A slender spire of pale stone, its wards flickering white"
    sprite: "mage_tower"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    rejects_lich: true
    dialogue:
      greeting: "White fire runs up the tower door. A voice speaks from above: 'Petitioners for the rank of Archmage, hear the trial.'"
      active_message: "'The Lich King still rules his Nexus. Destroy him and return to this tower.'"
      completed_message: "The door shines white. 'The Lich King is defeated. Let one of you step forward to receive the Light and be raised to Archmage.'"
      visited_message: "The tower's wards part at your approach. One of your company now bears its Light."
      choice_prompt: "White fire outlines the open door."
      choices:
        - text: "What trial does the tower offer?"
          action: "info"
          response: "'Since the Lich King rose, we have appointed no Archmage. Slay him in the Lich Nexus and return. One of your company may then receive the Light.'"
          choices:
            - text: "What does becoming Archmage grant?"
              action: "info"
              response: "'An Archmage can learn Light spells from the pages sold at shrines. Without the school, those pages cannot be used. We place the Light within the candidate, where it remains. The undead cannot receive it. First, you must defeat the Lich King.'"
              choices:
                - text: "We accept. The Lich King will fall."
                  action: "give_quest"
                  quest_id: "archmage_trial"
                - text: "Not yet."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "Accept the trial (slay the Lich King)"
          action: "give_quest"
          quest_id: "archmage_trial"
        - text: "I have slain the Lich King"
          action: "turn_in_quest"
          quest_id: "archmage_trial"
        - text: "Leave"
          action: "leave"

  dragon_cliffs_ranger:
    name: "Maera Cliffwatch"
    type: "quest_giver"
    description: "A wind-battered scout who watches the dragon cliffs for raiders and trolls"
    sprite: "dragon_cliffs_ranger"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Keep below the ridge. The wind can throw a grown troll off these cliffs, and I doubt you weigh as much. Maera Cliffwatch. Have you come up from the bridges?"
      active_message: "My offer stands: kill the Mountain Trolls here on the Dragon Cliffs, then report to me. Watch the bridge approaches."
      completed_message: "The bridges are clear. Good work. I can send the caravans through again. Here is your pay."
      visited_message: "Glad to see you on your feet. Keep an eye on the mist when you cross."
      choice_prompt: "Maera studies the ridgeline."
      choices:
        - text: "What kind of trouble?"
          action: "info"
          response: "Mountain Trolls come up from the gorges with the mist. They settle on the bridges and wait for a caravan. I've never seen this many climb out together."
          choices:
            - text: "Why are they suddenly so bold?"
              action: "info"
              response: "Varric blames the mages and their rites. Ask him if you want the theory. I need the Mountain Trolls driven off on these cliffs so I can get the caravans moving."
              choices:
                - text: "We'll thin the ridge for you."
                  action: "give_quest"
                  quest_id: "dragon_cliffs_troll_cull"
                - text: "Let me look around first."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "We'll clear the trolls."
          action: "give_quest"
          quest_id: "dragon_cliffs_troll_cull"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "dragon_cliffs_troll_cull"
        - text: "Leave"
          action: "leave"

  dragon_cliffs_bone_hermit:
    name: "Old Varric Bone-Speaker"
    type: "quest_giver"
    description: "A hermit draped in dragon teeth and old cliff charms"
    sprite: "dragon_cliffs_bone_hermit"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Stand still a moment. Feel that through your boots? Thirty years I've lived among these dragon bones. They've only just started knocking. Two mountain mages are meddling with them."
      active_message: "The rite is still going. Kill the Archmages on these cliffs and come back. I would rather spend my remaining years above ground."
      completed_message: "Put your ear to the rock. Nothing! Best thing I've heard all week. You stopped the rite. Here, take your pay."
      visited_message: "No more knocking. I slept so well I missed sunrise. Stay a while if you like."
      choice_prompt: "Varric taps his dragon-bone staff against the stone."
      choices:
        - text: "What is knocking in the rock?"
          action: "info"
          response: "Dragon bones, buried deep in the cliffs. The mages chant over them to wake their old fire. Twice I've seen a light flash inside the rock in reply. Exactly the same flashes, both times."
          choices:
            - text: "What happens if the rite is finished?"
              action: "info"
              response: "If they finish, we'll have dragon fire coming up through the ground. The trolls feel it already; that's why they're climbing toward Maera's bridges. Kill the Archmages conducting the rite. I'll pay you when you return."
              choices:
                - text: "We'll silence the mages and end the rite."
                  action: "give_quest"
                  quest_id: "dragon_cliffs_ember_rites"
                - text: "Let me weigh it."
                  action: "back"
            - text: "Back."
              action: "back"
        - text: "We'll end the ember rites."
          action: "give_quest"
          quest_id: "dragon_cliffs_ember_rites"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "dragon_cliffs_ember_rites"
        - text: "Leave"
          action: "leave"

  dragon_cliffs_bone_lair:
    name: "Bone-Maw Lair"
    type: "encounter"
    description: "A cliff cave framed by fossilized dragon jaws and scattered ribs"
    sprite: "dragon_cliffs_bone_lair"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "Dragon ribs frame the cave mouth. From farther in comes a scrape of claws, then a rush of cold air."
      visited_message: "Loose ribs crunch underfoot. The dragon's chamber is empty."
      choice_prompt: "Enter the Bone-Maw?"
      choices:
        - text: "Enter the lair"
          action: "combat"
        - text: "Back away"
          action: "leave"
    encounter:
      type: "dragon_lair"
      first_visit_only: true
      start_message: "A green dragon coils out of the bone-strewn dark!"
      quest_id: "dragon_cliffs_bone_lair"
      quest_name: "Bone-Maw Lair"
      quest_description: "Enter the Bone-Maw Lair on the Dragon Cliffs and defeat its defenders."
      monsters:
        - type: "dragon_green"
          count_min: 1
          count_max: 1
      rewards:
        gold: 1500
        experience: 750
        completion_message: "The Bone-Maw Lair is cleared."

  dragon_cliffs_ember_lair:
    name: "Ember-Heart Lair"
    type: "encounter"
    description: "A basalt dragon den split by glowing ember cracks"
    sprite: "dragon_cliffs_ember_lair"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "Heat beats against your face. Beyond the glowing cracks in the basalt, a dragon shifts its weight."
      visited_message: "The cave has cooled. A few red cracks still show in the black basalt."
      choice_prompt: "Enter the Ember-Heart?"
      choices:
        - text: "Enter the lair"
          action: "combat"
        - text: "Back away"
          action: "leave"
    encounter:
      type: "dragon_lair"
      first_visit_only: true
      start_message: "A red dragon erupts from the ember-lit cavern!"
      quest_id: "dragon_cliffs_ember_lair"
      quest_name: "Ember-Heart Lair"
      quest_description: "Enter the Ember-Heart Lair on the Dragon Cliffs and defeat its defenders."
      monsters:
        - type: "dragon_red"
          count_min: 1
          count_max: 1
      rewards:
        gold: 2000
        experience: 750
        completion_message: "The Ember-Heart Lair is cleared."

  abandoned_church:
    name: "Abandoned Church"
    type: "encounter"
    description: "A ruined stone church whose broken doorway descends into darkness"
    sprite: "abandoned_church"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "The church doors hang open. Villagers say the priest barred them when the crypt bells began to ring by themselves. Those who went in after dusk came back changed. Steps lead down beneath the nave."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter the church"
          action: "enter_map"
          map: "church"
        - text: "Leave it alone"
          action: "leave"

  abandoned_church_exit:
    name: "Church Entrance"
    type: "encounter"
    description: "The cold doorway back to the forest"
    sprite: "church_exit"
    size_class: full_tile
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    dialogue:
      greeting: "Cold air moves through the doorway behind you. The forest path is still visible beyond the ruined arch."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Return to the forest"
          action: "enter_map"
          map: "forest"
        - text: "Stay inside"
          action: "leave"

  pyramid_entrance:
    name: "Ancient Pyramid"
    type: "encounter"
    description: "A sun-baked pyramid with a narrow stairway descending into darkness"
    sprite: "pyramid_facade"
    render_category: wide_landmark
    size_class: structure
    grid_span_tiles: 4
    grid_span_dir: "e"
    prompt_verb: enter
    transparent: true
    dialogue:
      greeting: "A narrow stair leads under the sandstone blocks. The air below smells of dust and old pitch. Someone has broken the entrance seal."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter the pyramid"
          action: "enter_map"
          map: "pyramid_1"
        - text: "Leave it alone"
          action: "leave"

  pyramid_exit:
    name: "Pyramid Entrance"
    type: "encounter"
    description: "The stairway back out of the pyramid"
    sprite: "pyramid_stairs_up"
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "Warm daylight spills down the sandstone stairs behind you."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Leave the pyramid"
          action: "enter_map"
          map: "desert"
        - text: "Stay inside"
          action: "leave"

  pyramid_stairs_to_1:
    name: "Stairs to Level 1"
    type: "encounter"
    description: "Sandstone stairs leading upward"
    sprite: "pyramid_stairs_up"
    render_category: wall_mounted
    prompt_verb: climb
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "The stairs climb toward the upper chambers."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Go to level 1"
          action: "enter_map"
          map: "pyramid_1"
        - text: "Stay here"
          action: "leave"

  pyramid_stairs_to_2:
    name: "Stairs to Level 2"
    type: "encounter"
    description: "Sandstone stairs leading deeper"
    sprite: "pyramid_stairs_down"
    render_category: wall_mounted
    prompt_verb: climb
    transparent: true
    size_class: medium_prop
    dialogue:
      greeting: "The stairs descend into a colder, darker level of the pyramid."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Go to level 2"
          action: "enter_map"
          map: "pyramid_2"
        - text: "Stay here"
          action: "leave"

  pyramid_stairs_to_3:
    name: "Stairs to the Sanctum"
    type: "encounter"
    description: "A narrow stairway toward the sealed sanctum"
    sprite: "pyramid_stairs_down"
    render_category: wall_mounted
    prompt_verb: climb
    transparent: true
    size_class: medium_prop
    dialogue:
      greeting: "A painted stairway falls away into a chamber marked by four dragon seals."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Go to the sanctum"
          action: "enter_map"
          map: "pyramid_3"
        - text: "Stay here"
          action: "leave"

  lich_nexus_entrance:
    name: "Lich Nexus"
    type: "encounter"
    description: "A black stone arch crawling with trapped souls"
    sprite: "lich_nexus_entrance"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "Green and violet fire fills the black arch. A chorus of dead kings chants beyond it, each voice insisting on its own name."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter the nexus"
          action: "enter_map"
          map: "lich_nexus"
        - text: "Step away"
          action: "leave"

  lich_nexus_exit:
    name: "Nexus Portal"
    type: "encounter"
    description: "A portal back to the living world"
    sprite: "lich_nexus_exit"
    render_category: scenery
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "The portal flickers with a path away from the liches' hall."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Leave the nexus"
          action: "enter_map"
          map: "highlands"
        - text: "Stay inside"
          action: "leave"

  seabright_gate:
    name: "Seabright Gate"
    type: "encounter"
    description: "A stone road gate leading toward the sea city of Seabright"
    sprite: "city_exterior"
    render_category: landmark
    prompt_verb: enter
    transparent: true
    size_class: structure
    dialogue:
      greeting: "Seabright's gate stands open beyond the forest road. An eastbound ship takes on water for the far isles, and a riverboat at the slip hires crew for the green river into the deep jungle."
      choice_prompt: "What do you want to do?"
      choices:
        - text: "Enter Seabright"
          action: "enter_map"
          map: "city"
        - text: "Sail to the eastern islands"
          action: "enter_map"
          map: "japanese_castle"
        - text: "Take the riverboat up the river into the deep jungle"
          action: "enter_map"
          map: "deep_jungle"
        - text: "Stay in the forest"
          action: "leave"

  # --- Seabright Culverts (sewer dungeon) ---
  culverts_entrance:
    name: "Culvert Outflow"
    type: "encounter"
    description: "A great barred storm-drain venting into the harbor"
    sprite: "culvert_outlet"
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "Steps descend through the harbor outflow into Seabright's culverts. Water rushes below the grate. For a moment, lamplight catches gold in the channel."
      choice_prompt: "Descend into the culverts?"
      choices:
        - text: "Enter the culverts"
          action: "enter_map"
          map: "culverts"
        - text: "Stay in the city"
          action: "leave"

  culverts_exit:
    name: "Outflow Grate"
    type: "encounter"
    description: "The barred outflow back up to Seabright harbor"
    sprite: "culvert_outlet"
    render_category: wall_mounted
    prompt_verb: enter
    transparent: true
    size_class: full_tile
    dialogue:
      greeting: "Daylight filters down through the outflow grate - the way back up to Seabright."
      choice_prompt: "Leave the culverts?"
      choices:
        - text: "Climb back to Seabright"
          action: "enter_map"
          map: "city"
        - text: "Stay below"
          action: "leave"

  culverts_oldman:
    name: "Grist the Sluice-Rat"
    type: "quest_giver"
    description: "A cloaked ratfolk with a lantern who tends Seabright's seven sluice valves"
    sprite: "ratman_cloak"
    render_category: npc
    size_class: person
    dialogue:
      greeting: "Watch where you put those boots! That channel's deeper than it looks. Grist the Sluice-Rat, keeper of these culverts. If you've come for the gold, we ought to talk."
      active_message: "Shut all 7 sluice valves, then come back. There is still water feeding the bug's hall."
      completed_message: "Hear those pincers scraping? That's a rich beetle with a dry moat. All seven valves shut, just as promised. Here is your pay. The bug is yours to deal with."
      visited_message: "Mind the pincers when you go down there. You won't spend much of that gold with your head bitten off."
      choice_prompt: "Grist's whiskers twitch toward the dark."
      choices:
        - text: "What glitters down here? (ask Grist)"
          action: "info"
          response: "The Golden Thief Bug. Big as a hound, with a taste for rings and crowns. Keeps them in a flooded hall. Warm little cases, too, that spark when you pry them open. And the thief can blink away just as you swing at it."
          choices:
            - text: "So how do you corner a thing that vanishes?"
              action: "info"
              response: "Drain its hall. Seven sluice valves feed it; shut the lot and come back to me. Then you can get down there and fight the beast on dry ground."
              choices:
                - text: "Then I'll shut all seven valves."
                  action: "give_quest"
                  quest_id: "culverts_valves"
                - text: "Let me think on it."
                  action: "back"
            - text: "Hm. Tell me the rest later."
              action: "back"
        - text: "Why does a rat keep the harbor's drains?"
          action: "info"
          response: "Somebody has to. My people worked these drains when Seabright was three huts and a weir. You sleep in a dry cellar, you can thank a rat. Now this beetle is making a mess of our channels."
          choices:
            - text: "Fair enough. Back to the bug."
              action: "back"
        - text: "I'll drain its lair for you."
          action: "give_quest"
          quest_id: "culverts_valves"
        - text: "Claim your reward"
          action: "turn_in_quest"
          quest_id: "culverts_valves"
        - text: "Leave"
          action: "leave"

  # Seven sluice valves. Distinct keys/names so each remembers being shut
  # independently (NPC Visited is save-tracked by name). Dialogue is shared via a
  # YAML anchor - it's a read-only template; only npc.Visited mutates at runtime.
  culvert_valve_1:
    name: "Sluice Valve I"
    type: "encounter"
    sprite: "culvert_valve"
    render_category: scenery
    transparent: true
    size_class: small_prop
    steam_when_visited: true
    dialogue: &valve_dialogue
      greeting: "A rust-caked sluice valve, half-open. Water roars through the channel below."
      visited_message: "The valve is wrenched shut; the channel runs dry."
      choice_prompt: "Close the valve?"
      choices:
        - text: "Heave the wheel shut"
          action: "prop"
          prop:
            tag: "valve"
            not_yet: "The valve won't budge - no reason to shut it yet."
            took: "You heave the valve shut."
            completed: "The flood drains from the lair."
          quest_id: "culverts_valves"
        - text: "Leave it"
          action: "leave"
  culvert_valve_2:
    name: "Sluice Valve II"
    type: "encounter"
    sprite: "culvert_valve"
    render_category: scenery
    transparent: true
    size_class: small_prop
    steam_when_visited: true
