      greeting: "The clerk opens her ledger. 'Deposits or withdrawals? Your stash is shared across all your journeys. We will keep it here until you want it.'"
      choice_prompt: "What would you like to do?"
      choices:
        - text: "Manage your stash"
          action: "manage_stash"
        - text: "Leave"
          action: "leave"

  # Arena interior: the duel master (the gatekeeper's twin inside the pit).
  # start_arena_duel picks the difficulty; the champion is rolled randomly from
