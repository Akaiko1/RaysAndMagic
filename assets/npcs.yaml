    currency: "arena_points"
    arena_board: true
    stock_weapons_rarity: "uncommon"
    stock_weapons_cost: 750
    inventory: *arena_shop
    dialogue:
      greeting: "'Choose your stakes. You may fight once a day at each wager; the arena chooses your opponent. Once you enter, the gates stay shut until the fight is over. Still interested?' The duel master lifts her pen."
      choice_prompt: "What stakes?"
      choices:
        - text: "An easy bout"
          action: "start_arena_duel"
          tier: "easy"
        - text: "A proper duel"
          action: "start_arena_duel"
          tier: "normal"
        - text: "An impossible match"
          action: "start_arena_duel"
          tier: "impossible"
        - text: "Not yet"
          action: "leave"

