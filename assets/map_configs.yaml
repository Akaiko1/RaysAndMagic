        - "culverts_floor_1"
        - "culverts_floor_2"
        - "culverts_floor_3"

  # Each castle floor is its OWN single-texture group so the map can paint floors
  # deliberately by tile letter (cobble courtyard / wood halls / tatami rooms /
  # blossom garden), not the random-from-group variety the other biomes use.
  japanese_castle:
    floor_transitions:
      default: hard
      cobble: hard
      wood: hard
      tatami: hard
      garden: natural
    camp_scene: camp_japanese_castle
    elemental_attack_school: spirit
    floor_texture_groups:
      # "default" is what stitched open-world corridor cells (tile: empty)
      # wear - without it the castle half of the garden passage rendered the
      # flat grey default_floor_color. Cobble = the castle's '.' ground and
      # the courtyard right behind the carved south opening.
      default:
        - "japanese_castle_floor_0"
      cobble:
        - "japanese_castle_floor_0"
      wood:
        - "japanese_castle_floor_1"
      tatami:
        - "japanese_castle_floor_2"
      garden:
        - "japanese_castle_floor_3"

  # Castle-style deliberate floors: each group is one texture so the map paints
  # subregions by letter (moss garden / blossom earth / granite paving / koi
  # shallows), plus the four transition accents (digits 1-4 in tiles.yaml).
  sakura_garden:
    floor_transitions:
      default: hard
      moss: natural
      earth: natural
      paving: hard
      koi: water
      grass_edge: hard
      path: hard
      pond_edge: hard
      stream: hard
      beach: hard
    camp_scene: camp_sakura_garden
    elemental_attack_school: mind
    floor_texture_groups:
      # "default" is what stitched open-world corridor cells (tile: empty)
      # wear. Deliberately the granite PAVING, not the moss: the carved
      # passage lands on the paved entry court, so the corridor continues
      # the courtyard stone instead of dropping a green moss strip between
      # the castle cobble and the court.
      default:
        - "sakura_garden_floor_2"
      moss:
        - "sakura_garden_floor_0"
      earth:
        - "sakura_garden_floor_1"
      paving:
        - "sakura_garden_floor_2"
      koi:
        - "sakura_garden_floor_3"
      grass_edge:
        - "sakura_garden_floor_4"
      path:
        - "sakura_garden_floor_5"
      pond_edge:
        - "sakura_garden_floor_6"
      stream:
        - "sakura_garden_floor_7"
      # Authored directional shoreline: kept intact, not used as a generic sand overlay.
      beach:
        - "sakura_garden_floor_6"

  city:
    floor_transitions:
      default: hard
    camp_scene: camp_forest
    elemental_attack_school: water
    floor_texture_groups:
      default:
        - "city_cobblestone_0"
        - "city_cobblestone_1"
        - "city_cobblestone_2"
        - "city_cobblestone_3"

  # Both towns split their four floor variants into a walking group and a court
  # group, so the plaza around the landmark reads as a deliberate paved circle
  # instead of more street. Same split, same letters (. and ,) in each.
  elf_city:
    floor_transitions:
      default: hard
      court: hard
    camp_scene: camp_highlands
    elemental_attack_school: air
    floor_texture_groups:
      default:
        - "elf_city_floor_0"
        - "elf_city_floor_2"
      court:
        - "elf_city_floor_1"
        - "elf_city_floor_3"

  nomad_city:
