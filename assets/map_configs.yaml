# Floor-texture groups are biome-driven: defined once per biome below and
# shared by every map that declares that biome. Tiles pick a group via their
# `floor_texture_group` field (see tiles.yaml); the renderer builds one atlas
# per biome. The optional "beach" group is a distance-based shoreline layer
# over resolved default ground; it does not replace the ground tile.

# Groups every biome inherits, for universal tiles that can turn up on any map.
# Water (W) and deep water (Q) live in half the maps in the game, so their
# texture is defined here once instead of copied into each biome - a biome that
# forgot the copy used to render flat blue. A biome may still override a shared
# group by naming it in its own floor_texture_groups.
shared_floor_texture_groups:
  water:
    - "water_0"
    - "water_1"

shared_floor_transitions:
  water: water

# floor_transitions maps texture-group names to visual blending profiles.
# After shared inheritance, unlisted groups use hard (no neighbor blending).
# Profiles: hard, natural, water, void, cliff_east, cliff_west.
# Cliff names describe the authored drop side; they do not rotate the artwork.
# Rules, compatibility, shoreline behavior: docs/floor-transitions.md
biomes:
  solstice_fire:
    elemental_attack_school: "fire"
    out_of_bounds_tile: "solstice_fire_wall"
    floor_texture_groups:
      default: ["solstice_fire_floor_0"]
      service: ["solstice_fire_floor_1"]
      thermal: ["solstice_fire_floor_1"]
      circulation: ["solstice_water_floor_1"]
      pressure: ["solstice_earth_floor_1"]
    floor_transitions:
      default: "hard"
      service: "hard"
      thermal: "hard"
      circulation: "hard"
      pressure: "hard"
  solstice_water:
    elemental_attack_school: "water"
    out_of_bounds_tile: "solstice_water_wall"
    floor_texture_groups:
      default: ["solstice_water_floor_0"]
      service: ["solstice_water_floor_1"]
      thermal: ["solstice_fire_floor_1"]
      circulation: ["solstice_water_floor_1"]
      pressure: ["solstice_earth_floor_1"]
    floor_transitions:
      default: "hard"
      service: "hard"
      thermal: "hard"
      circulation: "hard"
      pressure: "hard"
  solstice_earth:
    elemental_attack_school: "earth"
    out_of_bounds_tile: "solstice_earth_wall"
    floor_texture_groups:
      default: ["solstice_earth_floor_0"]
      service: ["solstice_earth_floor_1"]
      thermal: ["solstice_fire_floor_1"]
      circulation: ["solstice_water_floor_1"]
      pressure: ["solstice_earth_floor_1"]
    floor_transitions:
      default: "hard"
      service: "hard"
      thermal: "hard"
      circulation: "hard"
      pressure: "hard"
  solstice_air:
    elemental_attack_school: "air"
    out_of_bounds_tile: "solstice_air_wall"
    floor_texture_groups:
      default: ["solstice_air_floor_0"]
      service: ["solstice_air_floor_1"]
      thermal: ["solstice_fire_floor_1"]
      circulation: ["solstice_water_floor_1"]
      pressure: ["solstice_earth_floor_1"]
    floor_transitions:
      default: "hard"
      service: "hard"
      thermal: "hard"
      circulation: "hard"
      pressure: "hard"
  solstice_vestibule:
    elemental_attack_school: "earth"
    out_of_bounds_tile: "wall"
    floor_texture_groups:
      default: ["solstice_earth_floor_0"]
      service: ["solstice_earth_floor_1"]
      thermal: ["solstice_fire_floor_1"]
      circulation: ["solstice_water_floor_1"]
      pressure: ["solstice_earth_floor_1"]
    floor_transitions:
      default: "hard"
      service: "hard"
      thermal: "hard"
      circulation: "hard"
      pressure: "hard"

  forest:
    floor_transitions:
      default: natural
      beach: natural
      forest_stream: water
      quest_bridge: hard
      clearing: natural
      highlands_stream: water
    camp_scene: camp_forest
    elemental_attack_school: earth
    floor_texture_groups:
      default:
        - "forest_grass_0"
        - "forest_grass_1"
        - "forest_grass_2"
        - "forest_grass_3"
      beach:
        - "beach_sand_0"
        - "beach_sand_1"
      forest_stream:
        - "forest_stream_0"
        - "forest_stream_1"
      # Quest bridge planks (wolf cull opens a bridge to the lake trader)
      quest_bridge:
        - "quest_bridge_0"
      clearing:
        - "clearing_grass_0"
        - "clearing_grass_1"
      # Used only by the Highlands portal stream tile (J) in forest.map.
      highlands_stream:
        - "highlands_stream_0"
        - "highlands_stream_1"

  desert:
    floor_transitions:
      default: natural
      beach: natural
    camp_scene: camp_desert
    elemental_attack_school: fire
    floor_texture_groups:
      default:
        - "desert_sand_0"
        - "desert_sand_1"
        - "desert_sand_2"
        - "desert_sand_3"
      beach:
        - "beach_sand_0"
        - "beach_sand_1"

  water:
    floor_transitions:
      default: natural
    camp_scene: camp_water
    elemental_attack_school: water
    floor_texture_groups:
      default:
        - "underwater_floor_0"
        - "underwater_floor_1"
        - "underwater_floor_2"
        - "underwater_floor_3"

  church:
    floor_transitions:
      default: hard
    elemental_attack_school: dark
    floor_texture_groups:
      default:
        - "church_floor_0"
        - "church_floor_1"
        - "church_floor_2"
        - "church_floor_3"

  clock_tower_workshop:
    floor_transitions:
      default: hard
      clocktower_slate: hard
      clocktower_mosaic: hard
      clocktower_planks: hard
      clocktower_grate: hard
    elemental_attack_school: earth
    floor_texture_groups:
      default:
        - "clocktower_planks_0"
      clocktower_slate:
        - "clocktower_slate_0"
      clocktower_mosaic:
        - "clocktower_mosaic_0"
      clocktower_planks:
        - "clocktower_planks_0"
      clocktower_grate:
        - "clocktower_grate_0"

  clock_tower_gearworks:
    floor_transitions:
      default: hard
      clocktower_slate: hard
      clocktower_mosaic: hard
      clocktower_planks: hard
      clocktower_grate: hard
    elemental_attack_school: earth
    floor_texture_groups:
      default:
        - "clocktower_grate_0"
      clocktower_slate:
        - "clocktower_slate_0"
      clocktower_mosaic:
        - "clocktower_mosaic_0"
      clocktower_planks:
        - "clocktower_planks_0"
      clocktower_grate:
        - "clocktower_grate_0"

  clock_tower_belfry:
    floor_transitions:
      default: hard
      clocktower_slate: hard
      clocktower_mosaic: hard
      clocktower_planks: hard
      clocktower_grate: hard
    elemental_attack_school: air
    floor_texture_groups:
      default:
        - "clocktower_mosaic_0"
      clocktower_slate:
        - "clocktower_slate_0"
      clocktower_mosaic:
        - "clocktower_mosaic_0"
      clocktower_planks:
        - "clocktower_planks_0"
      clocktower_grate:
        - "clocktower_grate_0"

  arena:
    floor_transitions:
      default: natural
    camp_scene: camp_desert
    elemental_attack_school: light
    floor_texture_groups:
      default:
        - "arena_sand_0"
        - "arena_sand_1"

  pyramid:
    floor_transitions:
      default: hard
    elemental_attack_school: spirit
    floor_texture_groups:
      default:
        - "pyramid_floor_0"
        - "pyramid_floor_1"
        - "pyramid_floor_2"
        - "pyramid_floor_3"

  lich_nexus:
    floor_transitions:
      default: hard
    elemental_attack_school: dark
    floor_texture_groups:
      default:
