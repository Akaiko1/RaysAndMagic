# =============================================================================
# SPELL ADDING INSTRUCTIONS
# =============================================================================
# To add a new spell:
# 1. Add a new entry under 'spells:' with a unique key (spell ID)
# 2. Fill in all the basic spell properties. cooldown_seconds is REQUIRED for a
#    castable spell (validated at load) and must be OMITTED for category: buff -
#    buffs have no real-time cooldown, so a value there would do nothing.
# 3. For projectile spells (is_projectile: true):
#    - Add 'physics:' section with:
#      - speed_tiles: Speed in tiles per second
#      - range_tiles: Maximum range in tiles
#      - hitbox: standard | wide (closed set; sizes in config.yaml world.projectile_hitboxes)
#    - Add 'graphics:' section with max_size, min_size, base_size, color
# 4. For utility spells (is_utility: true):
#    - Add effect properties like heal_amount, vision_bonus, stat_bonus, etc.
#    - Add custom message
#    - No physics or graphics sections needed
#    - Add category: buff for persistent beneficial effects, whether timed or
#      charged and personal or party-wide. They have no personal RT recovery;
#      mana, TB actions and any separate reuse_seconds still apply.
# 5. Build and test: go run .
#
# Example new projectile spell:
# ice_shard:
#   name: "Ice Shard"
#   description: "Launches a sharp shard of ice"
#   school: "water"
#   spell_points_cost: 6
#   # For a timed effect, author duration_by_mastery: [N, E, M, G] in seconds.
#   projectile_size: 12
#   is_projectile: true
#   is_utility: false
#   physics:
#     speed_tiles: 10.0          # 10 tiles per second
#     range_tiles: 10.0          # 10 tile range
#     hitbox: standard           # arrows, bolts, bullets; wide = large shots (fireball, swarm)
#   graphics:
#     max_size: 50
#     min_size: 3
#     base_size: 12
#     color: [100, 200, 255]  # Light blue
